<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원이야 - 학부모 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --cream:#FBF6EE;
    --ink:#403733;
    --ink-soft:#6E625B;
    --coral:#FF8A6B;
    --coral-deep:#F2715A;
    --sage:#9CB89A;
    --paper:#FFFFFF;
    --line:#f1e9e0;
    --display:'Gowun Dodum',sans-serif;
    --hand:'Gaegu',cursive;
    --body:'Pretendard',sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;
    font-family:var(--body);
    color:var(--ink);
    background:var(--cream);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  [hidden]{display:none!important}

  /* 상단 네비 (admissions.html/directions.html/template-sunshine.html과 동일한 구름 밑단 실루엣) */
  .topbar{
    position:sticky;top:0;z-index:20;
    --cloud-dip:16px; --cloud-unit:64px;
    padding:18px 0 calc(18px + var(--cloud-dip));
    background:var(--paper);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    filter:drop-shadow(0 4px 6px rgba(180,140,110,.28));
    -webkit-mask:radial-gradient(var(--cloud-dip) at 50% 100%, #0000 96%, #000) 50% 0 / var(--cloud-unit) 100% repeat-x;
    mask:radial-gradient(var(--cloud-dip) at 50% 100%, #0000 96%, #000) 50% 0 / var(--cloud-unit) 100% repeat-x;
  }
  @media (max-width:719px){ .topbar{--cloud-dip:12px; --cloud-unit:52px} }
  .topbar-inner{max-width:560px;margin:0 auto;padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}
  .brand{font-family:var(--display);font-size:1.2rem;color:var(--ink);text-decoration:none;letter-spacing:-.5px}
  .topbar-actions{display:flex;align-items:center;gap:10px}
  .back-link{font-size:.85rem;color:var(--coral-deep);text-decoration:none;font-weight:700}

  .wrap{max-width:480px;margin:0 auto;padding:46px 22px 70px}
  .section-eyebrow{font-family:var(--hand);font-size:1.15rem;color:var(--sage);font-weight:700;text-align:center}
  .section-title{font-family:var(--display);font-size:1.72rem;margin:8px 0 22px;letter-spacing:-.5px;line-height:1.38;text-align:center}
  .lead{color:var(--ink-soft);font-size:.95rem;text-align:center;margin-bottom:24px}
  .panel{background:var(--paper);border-radius:24px;padding:26px;box-shadow:0 18px 44px -22px rgba(120,80,60,.35)}
  .field{margin-bottom:16px}
  label{display:block;font-size:.86rem;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
  input[type=email],input[type=password],input[type=text],textarea{
    width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;
    font-family:var(--body);font-size:.98rem;color:var(--ink);background:var(--cream);
    outline:none;transition:border-color .2s ease;
  }
  textarea{min-height:104px;resize:vertical;line-height:1.6}
  input:focus,textarea:focus{border-color:var(--coral)}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;width:100%;border:none;
    border-radius:30px;padding:14px;background:var(--coral);color:#fff;font-weight:700;
    font-size:1rem;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;
    box-shadow:0 14px 28px -10px var(--coral-deep);
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .btn.ghost{background:transparent;color:var(--ink-soft);box-shadow:none;border:1.5px solid #e7dccf}
  .btn.kakao{background:#FEE500;color:#191919;box-shadow:0 14px 28px -12px rgba(60,45,0,.35)}
  .btn.small{width:auto;padding:8px 16px;font-size:.84rem;box-shadow:none}
  .auth-divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--ink-soft);font-size:.82rem}
  .auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .switch-link{margin-top:16px;text-align:center;font-size:.9rem;color:var(--ink-soft)}
  .switch-link button{border:none;background:transparent;color:var(--coral-deep);font-weight:800;cursor:pointer;font-family:var(--body)}
  .msg{margin-top:14px;font-size:.88rem;text-align:center;color:var(--ink-soft)}
  .msg.error{color:#D9534F}
  .msg.ok{color:var(--sage)}
  .result-title{font-family:var(--display);font-size:1.28rem;text-align:center;margin-bottom:10px}
  .result-desc{text-align:center;color:var(--ink-soft);font-size:.94rem;line-height:1.7}
  .class-list{display:flex;flex-direction:column;gap:12px}
  .class-card{background:var(--cream);border:1.5px solid var(--line);border-radius:20px;padding:18px}
  .class-title{font-weight:800;font-size:1rem;color:var(--ink)}
  .class-meta{margin-top:4px;font-size:.84rem;color:var(--ink-soft)}
  .class-actions{margin-top:14px}
  .extra-invite{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
  body.mini-open .wrap{max-width:760px;padding-top:24px}
  body.mini-open .wrap > .section-eyebrow,
  body.mini-open .wrap > .section-title,
  body.mini-open .wrap > .lead{display:none}
  .mini-panel{background:transparent;box-shadow:none;padding:0}
  .mini-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
  .mini-top > div{min-width:0}
  .mini-title{font-family:var(--display);font-size:1.26rem;line-height:1.35;overflow-wrap:anywhere}
  .mini-top .btn{flex:0 0 auto}
  .mini-cover{position:relative;min-height:210px;border-radius:30px;padding:18px;margin-bottom:18px;overflow:hidden;background:linear-gradient(135deg,#ffd8df,#d8c7ff);box-shadow:0 24px 60px -32px rgba(120,80,60,.55);border:2px solid rgba(255,255,255,.8)}
  .mini-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.08),rgba(255,255,255,.22) 46%,rgba(255,255,255,.78));pointer-events:none}
  .mini-cover.has-photo::after{background:linear-gradient(to bottom,rgba(39,31,28,.05),rgba(39,31,28,.16) 42%,rgba(39,31,28,.76))}
  .mini-cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .enrollment-pill{position:absolute;z-index:1;left:18px;top:18px;display:inline-flex;max-width:calc(100% - 92px);border-radius:999px;padding:6px 10px;background:rgba(255,255,255,.88);font-size:.76rem;line-height:1.3;font-weight:900;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 18px -14px rgba(64,55,51,.55);pointer-events:none}
  .month-sticker{position:absolute;z-index:1;right:18px;top:18px;transform:rotate(4deg);background:#fff0a8;border:1px solid rgba(64,55,51,.08);border-radius:10px;padding:6px 10px;font-family:var(--hand);font-size:1.02rem;line-height:1.15;font-weight:700;box-shadow:0 10px 20px -16px rgba(64,55,51,.45);pointer-events:none}
  .cover-caption{position:absolute;z-index:1;left:20px;right:20px;bottom:18px}
  .cover-caption-meta{display:flex;align-items:center;flex-wrap:wrap;gap:5px 7px;min-width:0;margin-bottom:6px}
  .cover-class-label,.cover-activity-label{display:inline-flex;max-width:100%;border-radius:999px;padding:3px 8px;background:rgba(255,255,255,.8);color:var(--ink);font-size:.68rem;line-height:1.35;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cover-activity-label{background:rgba(255,240,168,.9);color:var(--ink-soft)}
  .cover-caption p{display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-family:var(--display);font-size:1.12rem;line-height:1.4;color:var(--ink-soft);font-weight:700;overflow-wrap:anywhere;word-break:break-word}
  .mini-cover.has-photo .cover-caption p{color:#fff;text-shadow:0 2px 12px rgba(30,23,20,.58)}
  .mini-summary-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px}
  .teacher-note{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start;background:var(--paper);border-radius:28px;padding:18px;margin-bottom:18px;border:1.5px solid var(--line)}
  .teacher-avatar{width:72px;height:72px;border-radius:50%;border:2px dashed var(--coral);background:#fff8f5;display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:1.12rem;color:var(--coral-deep);transform:rotate(-4deg)}
  .speech{position:relative;background:#fffaf3;border:1.5px solid #f1e2d4;border-radius:22px;padding:14px 16px;color:var(--ink-soft);font-size:.94rem}
  .speech::before{content:"";position:absolute;left:-9px;top:24px;width:16px;height:16px;background:#fffaf3;border-left:1.5px solid #f1e2d4;border-bottom:1.5px solid #f1e2d4;transform:rotate(45deg)}
  .event-teaser{position:relative;width:100%;text-align:left;border:1.5px dashed #ead7e7;background:#fff7fb;border-radius:28px;padding:18px 18px 52px;cursor:pointer;box-shadow:0 16px 42px -30px rgba(120,80,60,.45);overflow:hidden;font-family:var(--body);color:var(--ink)}
  .event-badge{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;background:#fff0a8;font-family:var(--hand);font-size:1rem;font-weight:700;transform:rotate(-3deg);margin-bottom:10px}
  .event-teaser-title{font-weight:700;font-size:1.04rem;line-height:1.45;margin-bottom:4px;word-break:break-word}
  .event-teaser-date{font-size:.84rem;color:var(--ink-soft);font-weight:800}
  .event-more{position:absolute;right:16px;bottom:14px;display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 10px;background:#fff;color:var(--coral-deep);font-size:.78rem;font-weight:900;box-shadow:0 10px 20px -16px rgba(242,113,90,.7);border:1px solid #f6d8cf}
  .event-more span{font-size:.9rem;line-height:1}
  .notice-alert{position:relative;width:100%;text-align:left;border:2px solid #ffb7c6;background:#fff4f7;border-radius:28px;padding:18px 18px 52px;cursor:pointer;box-shadow:0 18px 42px -30px rgba(242,113,90,.58);font-family:var(--body);color:var(--ink);overflow:hidden}
  .notice-alert-badge{display:inline-flex;border-radius:999px;padding:6px 10px;background:#fff;color:var(--coral-deep);font-size:.78rem;font-weight:900;margin-bottom:10px;border:1px solid #ffd7df}
  .notice-alert-title{font-weight:700;font-size:1.04rem;line-height:1.45;margin-bottom:4px;word-break:break-word}
  .notice-alert-date{font-size:.84rem;color:var(--ink-soft);font-weight:800}
  .event-badge,.notice-alert-badge{max-width:calc(100% - 54px)}
  .summary-visual{position:absolute;right:14px;top:12px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:visible;color:var(--coral-deep);background:#ffe9e2;border:1px solid rgba(242,113,90,.18)}
  .summary-visual svg{display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .summary-photo{overflow:hidden;background:#eaf5fb;color:#668da3;border-color:#cfe1ec}
  .summary-photo svg{width:21px;height:21px}
  .summary-photo-img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover}
  .summary-photo.is-error .summary-photo-img{display:none}
  .summary-event{flex-direction:column;gap:0;background:#fff0a8;color:var(--ink);border-color:#f0d97c;font-weight:900;line-height:1}
  .summary-event-day{font-size:1rem;line-height:1}
  .summary-event-label{margin-top:2px;font-size:.52rem;line-height:1;letter-spacing:-.04em;color:var(--ink-soft)}
  .summary-notice{overflow:visible;background:#fff;color:var(--coral-deep);border-color:#ffd7df}
  .summary-notice::after{content:"";position:absolute;right:-1px;top:-1px;width:9px;height:9px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 4px rgba(255,138,107,.16)}
  .diary-teaser{background:#fffaf3;border-color:#efdcc7}
  .album-teaser{background:#f5fbff;border-color:#cfe1ec}
  .summary-empty{padding:14px 16px;margin-bottom:14px;font-size:.9rem}
  .mini-tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:100%;gap:6px;padding:2px 2px 12px;margin-bottom:6px}
  .mini-tab{width:100%;min-width:0;min-height:44px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink-soft);border-radius:999px;padding:8px 4px;font-family:var(--body);font-size:.78rem;line-height:1.25;font-weight:800;white-space:normal;overflow-wrap:anywhere;word-break:break-word;cursor:pointer}
  .mini-tab-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--coral);margin-left:6px;vertical-align:middle;box-shadow:0 0 0 3px rgba(255,138,107,.16)}
  .mini-tab.active{background:var(--coral);border-color:var(--coral);color:#fff;box-shadow:0 12px 22px -16px var(--coral-deep)}
  .mini-content{display:flex;flex-direction:column;gap:14px}
  .mini-card{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 16px 42px -28px rgba(120,80,60,.35)}
  .mini-card::before{content:"";position:absolute;top:-9px;left:34px;width:64px;height:20px;background:rgba(255,226,167,.86);transform:rotate(-5deg);border-radius:4px;box-shadow:0 4px 10px -8px rgba(64,55,51,.6)}
  .mini-date{font-size:.78rem;color:var(--sage);font-weight:900;margin-bottom:6px}
  .mini-card-title{font-weight:700;font-size:1.04rem;margin-bottom:8px}
  .mini-body{color:var(--ink-soft);font-size:.94rem;line-height:1.75;word-break:break-word}
  .scrap-photo{position:relative;margin:6px 0 14px;padding:9px;background:#fff;border-radius:10px;box-shadow:0 14px 26px -22px rgba(64,55,51,.55);transform:rotate(-1deg)}
  .scrap-photo img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:7px;display:block}
  .album-grid-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .album-photo{border:none;padding:0;background:#fff;border-radius:16px;overflow:hidden;aspect-ratio:1;cursor:pointer;box-shadow:0 12px 26px -22px rgba(64,55,51,.55);transform:rotate(-1deg)}
  .album-photo:nth-child(2n){transform:rotate(1.5deg)}
  .album-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .album-list-mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,225px));justify-content:center;gap:14px}
  .album-card{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:24px;padding:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--body);text-align:left;cursor:pointer;box-shadow:0 16px 36px -26px rgba(120,80,60,.48);transition:transform .2s ease,box-shadow .2s ease}
  .album-card:hover{transform:translateY(-2px);box-shadow:0 20px 42px -26px rgba(120,80,60,.56)}
  .album-card:focus-visible{outline:3px solid rgba(255,138,107,.48);outline-offset:3px}
  .album-card-cover{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;background:#f3ece3}
  .album-card-cover img{display:block;width:100%;height:100%;object-fit:cover}
  .album-card-kind{position:absolute;right:10px;top:10px;border-radius:999px;padding:5px 8px;background:rgba(255,255,255,.92);color:var(--coral-deep);font-size:.72rem;font-weight:900;box-shadow:0 8px 18px -12px rgba(64,55,51,.6)}
  .album-card-body{display:block;padding:13px 14px 14px}
  .album-card-title{display:-webkit-box;min-height:2.8em;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-size:.96rem;font-weight:700;line-height:1.4;overflow-wrap:anywhere;word-break:break-word}
  .album-card-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;color:var(--ink-soft);font-size:.78rem;font-weight:800}
  .album-detail{display:flex;flex-direction:column;gap:14px;min-width:0}
  .album-detail-head{display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-width:0}
  .album-back{width:auto;max-width:100%;min-height:44px;padding:10px 14px;text-align:left;white-space:normal}
  .album-detail-title{max-width:100%;font-family:var(--display);font-size:1.34rem;line-height:1.4;overflow-wrap:anywhere;word-break:break-word}
  .album-detail-meta{color:var(--sage);font-size:.82rem;font-weight:900}
  .album-detail-body{width:100%;padding:14px 16px;border:1.5px dashed var(--line);border-radius:18px;background:rgba(255,255,255,.72);color:var(--ink-soft);font-size:.92rem;line-height:1.7;overflow-wrap:anywhere;word-break:break-word}
  .comment-item{background:#fffdf8;border:1.5px dashed #eadccc;border-radius:22px;padding:16px}
  .comment-reply{margin-top:12px;margin-left:20px;background:#f7f0ff;border-radius:18px;padding:12px 14px;color:var(--ink-soft);font-size:.9rem}
  .comment-form{margin-top:4px;background:var(--paper);border-radius:24px;padding:18px;border:1.5px solid var(--line)}
  .event-calendar-card{background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 16px 42px -28px rgba(120,80,60,.35)}
  .event-calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .event-calendar-title{font-family:var(--display);font-size:1.16rem;font-weight:900}
  .event-nav{width:auto;min-width:44px;padding:8px 12px;box-shadow:none}
  .event-weekdays,.event-calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .event-weekdays{margin-bottom:6px;color:var(--ink-soft);font-size:.74rem;font-weight:900;text-align:center}
  .event-day{position:relative;min-height:62px;border:1.5px solid var(--line);border-radius:16px;background:#fffdf8;padding:8px;text-align:left;font-family:var(--body);color:var(--ink);cursor:pointer}
  .event-day.out{opacity:.38}
  .event-day.today{background:#fff7fb;border-color:#f6c5d8}
  .event-day.selected{outline:2px dashed var(--coral);outline-offset:2px}
  .event-day-num{font-size:.82rem;font-weight:900}
  .event-day-dot{position:absolute;left:8px;bottom:8px;min-width:18px;height:18px;border-radius:999px;background:var(--coral);color:#fff;font-size:.68rem;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .event-detail{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .event-detail-title{font-weight:700}
  .event-detail-item{background:#fff7fb;border:1.5px dashed #ead7e7;border-radius:18px;padding:14px}
  .empty-mini{background:rgba(255,255,255,.72);border:1.5px dashed var(--line);border-radius:22px;padding:22px;text-align:center;color:var(--ink-soft)}
  .image-modal{--image-modal-side:22px;--image-modal-close-size:44px;--image-modal-close-gap:10px;position:fixed;inset:0;background:rgba(64,55,51,.72);z-index:20;display:flex;align-items:center;justify-content:center;padding:22px var(--image-modal-side)}
  .image-modal[hidden]{display:none!important}
  .image-modal-frame{position:relative;display:flex;max-width:min(920px,calc(100vw - var(--image-modal-side) - var(--image-modal-side) - var(--image-modal-close-size) - var(--image-modal-close-gap)));max-height:82vh;transform:translateX(-27px)}
  .image-modal img{display:block;max-width:100%;max-height:82vh;border-radius:18px;background:#fff;box-shadow:0 30px 80px -24px rgba(0,0,0,.65)}
  .image-modal .btn.small{position:absolute;left:calc(100% + var(--image-modal-close-gap));top:0;width:var(--image-modal-close-size);min-width:var(--image-modal-close-size);height:var(--image-modal-close-size);padding:0;box-shadow:none}
  @media (max-width:560px){
    .image-modal{--image-modal-side:12px;padding:12px var(--image-modal-side)}
    .image-modal-frame{width:fit-content;max-width:calc(100vw - var(--image-modal-side) - var(--image-modal-side));max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);flex-direction:column;align-items:stretch;transform:none}
    .image-modal img{order:2;width:auto;height:auto;max-width:100%;max-height:min(82vh,calc(100vh - 76px));max-height:min(82vh,calc(100dvh - 76px))}
    .image-modal .btn.small{position:static;order:1;align-self:flex-end;flex:0 0 var(--image-modal-close-size);left:auto;top:auto;margin:0 0 8px}
    body.mini-open .wrap{padding-top:18px}
    .mini-cover{min-height:160px;border-radius:24px;padding:14px}
    .enrollment-pill{left:14px;top:14px;max-width:calc(100% - 80px);padding:5px 9px;font-size:.72rem}
    .month-sticker{right:14px;top:14px}
    .cover-caption{left:16px;right:16px;bottom:14px}
    .cover-caption-meta{margin-bottom:4px}
    .cover-caption p{font-size:1.02rem;line-height:1.35}
    .teacher-note{grid-template-columns:1fr}

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var cfg = window.__SUPABASE_CONFIG__;
  var client = supabase.createClient(cfg.url, cfg.anonKey);

  var leadText = document.getElementById('leadText');
  var logoutBtn = document.getElementById('logoutBtn');
  var loadingPanel = document.getElementById('loadingPanel');
  var authPanel = document.getElementById('authPanel');
  var invitePanel = document.getElementById('invitePanel');
  var pendingPanel = document.getElementById('pendingPanel');
  var classesPanel = document.getElementById('classesPanel');
  var miniPanel = document.getElementById('miniPanel');
  var noticePanel = document.getElementById('noticePanel');
  var noticeTitle = document.getElementById('noticeTitle');
  var noticeDesc = document.getElementById('noticeDesc');
  var miniTitle = document.getElementById('miniTitle');
  var miniBackBtn = document.getElementById('miniBackBtn');
  var miniRoot = document.getElementById('miniRoot');
  var imageModal = document.getElementById('imageModal');
  var imageModalImg = document.getElementById('imageModalImg');
  var imageModalClose = document.getElementById('imageModalClose');

  var authForm = document.getElementById('authForm');
  var authEmail = document.getElementById('authEmail');
  var authPassword = document.getElementById('authPassword');
  var authSubmit = document.getElementById('authSubmit');
  var authMsg = document.getElementById('authMsg');
  var authSwitchText = document.getElementById('authSwitchText');
  var authModeBtn = document.getElementById('authModeBtn');
  var kakaoLoginBtn = document.getElementById('kakaoLoginBtn');

  var inviteForm = document.getElementById('inviteForm');
  var inviteCode = document.getElementById('inviteCode');
  var inviteSubmit = document.getElementById('inviteSubmit');
  var inviteMsg = document.getElementById('inviteMsg');

  var classList = document.getElementById('classList');
  var showExtraInviteBtn = document.getElementById('showExtraInviteBtn');
  var extraInviteBox = document.getElementById('extraInviteBox');
  var extraInviteForm = document.getElementById('extraInviteForm');
  var extraInviteCode = document.getElementById('extraInviteCode');
  var extraInviteSubmit = document.getElementById('extraInviteSubmit');
  var extraInviteMsg = document.getElementById('extraInviteMsg');

  var currentSession = null;
  var authMode = 'login';
  var initialAuthLoaded = false;
  var authTransitionVersion = 0;
  var authTransitionRunning = false;
  var pendingAuthTransition = null;
  var pendingInitialAuthTransition = null;
  var approvedClasses = [];
  var currentMiniClass = null;
  var currentEnrollment = null;
  var currentMini = null;
  var currentMiniTab = 'diary';
  var selectedAlbumKey = null;
  var classLoadVersion = 0;
  var eventCalendarDate = firstOfMonth(new Date());
  var selectedEventDate = toDateInput(new Date());
  var miniCache = { posts: [], media: [], comments: [], coverPath: '', coverSignedUrl: '', coverRequest: null };
  var BUCKET = 'center-images';
  var directClassId = new URLSearchParams(location.search).get('class_id') || '';

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
    });
  }

  function escWithBr(s){
    return esc(s).replace(/\r?\n/g, '<br>');
  }

  function showPanel(panel){
    [loadingPanel, authPanel, invitePanel, pendingPanel, classesPanel, miniPanel, noticePanel].forEach(function(item){
      item.hidden = item !== panel;
    });
    document.body.classList.toggle('mini-open', panel === miniPanel);
  }

  function resetMiniStateForAuthChange(){
    classLoadVersion += 1;
    approvedClasses = [];
    currentMiniClass = null;
    currentEnrollment = null;
    currentMini = null;
    currentMiniTab = 'diary';
    selectedAlbumKey = null;
    miniCache = { posts: [], media: [], comments: [], coverPath: '', coverSignedUrl: '', coverRequest: null };
    imageModal.hidden = true;
    imageModalImg.removeAttribute('src');
  }

  function isCurrentAuthTransition(version){
    return version == null || version === authTransitionVersion;
  }

  function isCurrentClassLoad(authVersion, loadVersion, classId){
    return isCurrentAuthTransition(authVersion) &&
      loadVersion === classLoadVersion &&
      !!classId &&
      !!currentMiniClass &&
      currentMiniClass.id === classId;
  }

  function authSessionUserId(session){
    return session && session.user ? session.user.id : '';
  }

  function isNewerSameUserSession(candidate, existing){
    var candidateUserId = authSessionUserId(candidate);
    if (!candidateUserId) return false;
    if (!existing) return true;
    if (candidateUserId !== authSessionUserId(existing)) return false;
    var candidateExpiresAt = Number(candidate.expires_at || 0);
    var existingExpiresAt = Number(existing.expires_at || 0);
    if (candidateExpiresAt && existingExpiresAt && candidateExpiresAt !== existingExpiresAt) {
      return candidateExpiresAt > existingExpiresAt;
    }
    if (candidateExpiresAt && !existingExpiresAt) return true;
    return !!candidate.access_token && candidate.access_token !== existing.access_token;
  }

  function resolveInitialAuthSession(fallbackSession){
    if (!pendingInitialAuthTransition) return fallbackSession || null;
    if (pendingInitialAuthTransition.event === 'SIGNED_OUT' || !pendingInitialAuthTransition.session) return null;
    var pendingSession = pendingInitialAuthTransition.session;
    var pendingUserId = authSessionUserId(pendingSession);
    var fallbackUserId = authSessionUserId(fallbackSession);
    if (!fallbackUserId || fallbackUserId !== pendingUserId) return pendingSession;
    return isNewerSameUserSession(fallbackSession, pendingSession) ? fallbackSession : pendingSession;
  }

  function queueAuthTransition(session){
    var transition = {
      version: ++authTransitionVersion,
      session: session
    };
    pendingAuthTransition = transition;
    return transition;
  }

  async function drainAuthTransitions(){
    if (authTransitionRunning) return;
    authTransitionRunning = true;
    try {
      while (pendingAuthTransition) {
        var transition = pendingAuthTransition;
        pendingAuthTransition = null;
        await loadParentState(transition.session, transition.version);
      }
    } finally {
      authTransitionRunning = false;
      if (pendingAuthTransition) drainAuthTransitions();
    }
  }

  function showNotice(title, desc){
    noticeTitle.textContent = title || '';
    noticeDesc.innerHTML = escWithBr(desc || '');
    showPanel(noticePanel);
  }

  function setAuthMode(mode){
    authMode = mode;
    authMsg.textContent = '';
    if (mode === 'signup') {
      authSubmit.textContent = '회원가입';
      authSwitchText.textContent = '이미 계정이 있으신가요?';
      authModeBtn.textContent = '로그인';
      authPassword.setAttribute('autocomplete', 'new-password');
    } else {
      authSubmit.textContent = '로그인';
      authSwitchText.textContent = '처음이신가요?';
      authModeBtn.textContent = '회원가입';
      authPassword.setAttribute('autocomplete', 'current-password');
    }
  }

  function classTitle(row){
    if (!row) return '이름 없는 반';
    if (row.name && row.age_label) return row.name + ' · ' + row.age_label;
    return row.name || row.age_label || '이름 없는 반';
  }

  function renderClassCard(row){
    return '<div class="class-card">' +
      '<div class="class-title">' + esc(classTitle(row)) + ' 미니홈피</div>' +
      '<div class="class-meta">담임 선생님이 전하는 우리 반 소식을 확인해요.</div>' +
      '<div class="class-actions"><button type="button" class="btn" data-open-class="' + esc(row.id) + '">반 미니홈피 열기</button></div>' +
    '</div>';
  }

  async function loadClassRows(ids){
    if (!ids.length) return [];
    var res = await client.rpc('get_my_approved_class_summaries');
    if (res.error) throw res.error;
    var rows = Array.isArray(res.data) ? res.data : [];
    var requestedIds = new Set(ids);
    var rowsById = new Map();
    rows.forEach(function(row){
      if (!row || !requestedIds.has(row.id)) return;
      rowsById.set(row.id, {
        id: row.id,
        name: row.name,
        age_label: row.age_label,
        enrolled: row.enrolled
      });
    });
    return ids.map(function(id){
      return rowsById.get(id) || { id:id };
    });
  }

  function formatDate(value){
    if (!value) return '';
    var date = new Date(value);
    if (isNaN(date.getTime())) return '';
    return (date.getMonth() + 1) + '월 ' + date.getDate() + '일';
  }

  function pad2(n){
    return String(n).padStart(2, '0');
  }

  function toDateInput(date){
    return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
  }

  function firstOfMonth(date){
    return new Date(date.getFullYear(), date.getMonth(), 1);
  }

  function dateKey(value){
    if (!value) return '';
    if (typeof value === 'string' && /^\d{4}-\d{2}-\d{2}/.test(value)) return value.slice(0, 10);
    var date = new Date(value);
    if (isNaN(date.getTime())) return '';
    return toDateInput(date);
  }

  function sameMonth(a, b){
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth();
  }

  function currentMonthLabel(){
    return (new Date().getMonth() + 1) + '월';
  }

  function safeThemeColor(value){
    var text = String(value || '').trim();
    return /^#[0-9a-fA-F]{3,8}$/.test(text) ? text : '#F7B7C8';
  }

  function dayFromDateKey(value){
    var match = String(value || '').match(/^\d{4}-\d{2}-(\d{2})(?:$|T)/);
    return match ? String(Number(match[1])) : '';
  }

  function summaryVisualHtml(card){
    if (card.kind === 'diary') {
      return '<span class="summary-visual summary-diary" aria-hidden="true">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 5.3l4 4M4 20l4.2-1 10.5-10.5a1.4 1.4 0 000-2l-1.2-1.2a1.4 1.4 0 00-2 0L5 15.8 4 20z"/><path d="M12.8 7.9l3.3 3.3"/></svg>' +
      '</span>';
    }
    if (card.kind === 'album') {
      return '<span class="summary-visual summary-photo" aria-hidden="true">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.5"/><path d="M5.5 17l4.2-4 3.1 2.8 2.4-2.2 3.3 3.4"/></svg>' +
        (card.image ? '<img class="summary-photo-img" src="' + esc(card.image) + '" alt="" aria-hidden="true">' : '') +
      '</span>';
    }
    if (card.kind === 'event') {
      return '<span class="summary-visual summary-event" aria-hidden="true">' +
        '<span class="summary-event-day">' + esc(card.day) + '</span>' +
        '<span class="summary-event-label">일정</span>' +
      '</span>';
    }
    return '<span class="summary-visual summary-notice" aria-hidden="true">' +
      '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13.5v-3l11-4.5v12L4 13.5z"/><path d="M15 9.2c2 .4 3 1.3 3 2.8s-1 2.4-3 2.8M6.5 14.5l1.2 4h3l-1.8-3"/></svg>' +
    '</span>';
  }

  function enrolledLabel(row){
    var enrolled = Number(row && row.enrolled);
    return Number.isFinite(enrolled) && enrolled > 0 ? '재원 ' + Math.floor(enrolled) + '명' : '';
  }

  async function signedUrl(path){
    if (!path) return '';
    var res = await client.storage.from(BUCKET).createSignedUrl(path, 3600);
    if (res.error) throw res.error;
    return res.data ? res.data.signedUrl : '';
  }

  async function signedMediaRows(rows){
    var out = [];
    for (var i = 0; i < rows.length; i++) {
      var row = Object.assign({}, rows[i]);
      try { row.signed_url = await signedUrl(row.url); }
      catch (_err) { row.signed_url = ''; }
      out.push(row);
    }
    return out;
  }

  async function signedCoverUrl(path, authVersion, loadVersion, classId){
    if (!path) return '';
    var targetCache = miniCache;
    if (targetCache.coverPath !== path) {
      targetCache.coverPath = path;
      targetCache.coverSignedUrl = '';
      targetCache.coverRequest = null;
    }
    if (targetCache.coverSignedUrl) return targetCache.coverSignedUrl;
    if (!targetCache.coverRequest) targetCache.coverRequest = signedUrl(path);
    var request = targetCache.coverRequest;
    try {
      var url = await request;
      if (
        targetCache !== miniCache ||
        targetCache.coverPath !== path ||
        !isCurrentClassLoad(authVersion, loadVersion, classId) ||
        !currentMini ||
        currentMini.cover_image !== path
      ) return '';
      targetCache.coverSignedUrl = url;
      return url;
    } finally {
      if (targetCache.coverRequest === request) targetCache.coverRequest = null;
    }
  }

  function enabledModules(){
    var enabled = currentMini && currentMini.modules_enabled ? currentMini.modules_enabled : {};
    var modules = [
      { key:'diary', label:'일지' },
      { key:'event', label:'행사' },
      { key:'album', label:'사진첩' },
      { key:'guestbook', label:'방명록' },
      { key:'notice', label:'공지' }
    ];
    return modules.filter(function(item){
      return enabled[item.key] !== false;
    });
  }

  function eventRows(){
    return miniCache.posts
      .filter(function(row){ return row.type === 'event' && row.event_date; })
      .sort(function(a, b){ return dateKey(a.event_date).localeCompare(dateKey(b.event_date)); });
  }

  function upcomingEvent(){
    var today = toDateInput(new Date());
    return eventRows().find(function(row){
      return dateKey(row.event_date) >= today;
    }) || null;
  }

  function noticeRows(){
    return miniCache.posts
      .filter(function(row){ return row.type === 'notice'; })
      .sort(function(a, b){ return new Date(b.created_at).getTime() - new Date(a.created_at).getTime(); });
  }

  function latestNotice(){
    return noticeRows()[0] || null;
  }

  function diaryRows(){
    return miniCache.posts
      .filter(function(row){ return row.type === 'diary'; })
      .sort(function(a, b){ return new Date(b.created_at).getTime() - new Date(a.created_at).getTime(); });
  }

  function latestDiary(){
    return diaryRows()[0] || null;
  }

  function albumRows(){
    return miniCache.media
      .filter(function(row){ return row.signed_url; })
      .sort(function(a, b){ return new Date(b.uploaded_at).getTime() - new Date(a.uploaded_at).getTime(); });
  }

  function albumGroups(){
    function timestamp(value){
      var time = new Date(value).getTime();
      return Number.isFinite(time) ? time : 0;
    }

    function sortedPhotos(rows){
      return rows.slice().sort(function(a, b){
        var timeDiff = timestamp(b.uploaded_at) - timestamp(a.uploaded_at);
        if (timeDiff) return timeDiff;
        return String(a.id || '').localeCompare(String(b.id || ''));
      });
    }

    var albumPosts = miniCache.posts
      .filter(function(row){ return row.type === 'album'; })
      .slice()
      .sort(function(a, b){
        var timeDiff = timestamp(b.created_at) - timestamp(a.created_at);
        if (timeDiff) return timeDiff;
        return String(a.id || '').localeCompare(String(b.id || ''));
      });

    var groups = albumPosts.map(function(post){
      var photos = sortedPhotos(miniCache.media.filter(function(row){
        return row.post_id === post.id && row.signed_url;
      }));
      return {
        album_key: post.id,
        post_id: post.id,
        title: post.title || '',
        body: post.body || '',
        created_at: post.created_at,
        photos: photos,
        photo_count: photos.length,
        representative_photo: photos[0] || null,
        is_virtual: false
      };
    }).filter(function(group){
      return group.photo_count > 0;
    });

    var standalonePhotos = sortedPhotos(miniCache.media.filter(function(row){
      return row.post_id === null && row.signed_url;
    }));
    if (standalonePhotos.length) {
      groups.push({
        album_key: '**standalone**',
        post_id: null,
        title: '우리 반 일상',
        body: '',
        created_at: standalonePhotos[0].uploaded_at,
        photos: standalonePhotos,
        photo_count: standalonePhotos.length,
        representative_photo: standalonePhotos[0],
        is_virtual: true
      });
    }

    return groups;
  }

  function latestAlbumPhoto(){
    return albumRows()[0] || null;
  }

  function hasUnreadNotice(){
    var latest = latestNotice();
    if (!latest) return false;
    if (!currentEnrollment || !currentEnrollment.last_notice_read_at) return true;
    return new Date(latest.created_at).getTime() > new Date(currentEnrollment.last_notice_read_at).getTime();
  }

  function firstMediaForPost(postId){
    return miniCache.media.find(function(row){
      return row.post_id === postId && row.signed_url;
    });
  }

  async function openClassMini(classId, authVersion){
    var startedAuthVersion = authVersion == null ? authTransitionVersion : authVersion;
    if (!isCurrentAuthTransition(startedAuthVersion)) return;
    var targetClassId = classId;
    var startedClassLoadVersion = ++classLoadVersion;
    var row = approvedClasses.find(function(item){ return item.id === targetClassId; });
    if (!row) return;
    currentMiniClass = row;
    currentEnrollment = {
      id: row.enrollment_id || null,
      last_notice_read_at: row.last_notice_read_at || null
    };
    currentMini = null;
    currentMiniTab = 'diary';
    selectedAlbumKey = null;
    miniCache = { posts: [], media: [], comments: [], coverPath: '', coverSignedUrl: '', coverRequest: null };
    miniTitle.textContent = classTitle(row);
    miniRoot.innerHTML = '<div class="empty-mini">반 미니홈피를 불러오고 있어요.</div>';
    leadText.textContent = classTitle(row) + ' 소식입니다.';
    showPanel(miniPanel);

    try {
      var miniRes = await client.from('class_mini').select('*').eq('class_id', targetClassId).maybeSingle();
      if (!isCurrentClassLoad(startedAuthVersion, startedClassLoadVersion, targetClassId)) return;
      if (miniRes.error) throw miniRes.error;
      currentMini = miniRes.data || {
        class_id: targetClassId,
        theme_color: '#F7B7C8',
        intro: '',
        teacher_message: '',
        modules_enabled: { diary:false, album:false, guestbook:false, notice:false }
      };

      var postsRes = await client.from('class_posts')
        .select('*')
        .eq('class_id', targetClassId)
        .order('created_at', { ascending:false });
      if (!isCurrentClassLoad(startedAuthVersion, startedClassLoadVersion, targetClassId)) return;
      if (postsRes.error) throw postsRes.error;
      var postRows = postsRes.data || [];

      var mediaRes = await client.from('class_media')
        .select('*')
        .eq('class_id', targetClassId)
        .order('uploaded_at', { ascending:false });
      if (!isCurrentClassLoad(startedAuthVersion, startedClassLoadVersion, targetClassId)) return;
      if (mediaRes.error) throw mediaRes.error;
      var mediaRows = mediaRes.data || [];

      var commentsRes = await client.from('class_comments')
        .select('*')
        .eq('class_id', targetClassId)
        .order('created_at', { ascending:false });
      if (!isCurrentClassLoad(startedAuthVersion, startedClassLoadVersion, targetClassId)) return;
      if (commentsRes.error) throw commentsRes.error;
      var commentRows = commentsRes.data || [];

      var signedRows = await signedMediaRows(mediaRows);
      if (!isCurrentClassLoad(startedAuthVersion, startedClassLoadVersion, targetClassId)) return;
      miniCache = {
        posts: postRows,
        media: signedRows,
        comments: commentRows,
        coverPath: '',
        coverSignedUrl: '',
        coverRequest: null
      };
      var next = upcomingEvent();
      if (next) {
        selectedEventDate = dateKey(next.event_date);
        eventCalendarDate = firstOfMonth(new Date(selectedEventDate + 'T00:00:00'));
      } else {
        selectedEventDate = toDateInput(new Date());
        eventCalendarDate = firstOfMonth(new Date());
      }
      await renderMiniHome(startedAuthVersion, startedClassLoadVersion, targetClassId);
    } catch (err) {
      if (!isCurrentClassLoad(startedAuthVersion, startedClassLoadVersion, targetClassId)) return;
      miniRoot.innerHTML = '<div class="empty-mini">' + escWithBr(err && err.message ? err.message : String(err)) + '</div>';
    }
  }

  async function loadDirectClassMini(session, authVersion){
    var classRes = await client.from('classes')
      .select('id,name,age_label,teacher_id,center_id')
      .eq('id', directClassId)
      .maybeSingle();
    if (!isCurrentAuthTransition(authVersion)) return true;
    if (classRes.error) throw classRes.error;

    var classRow = classRes.data || null;
    var isTeacher = !!(classRow && classRow.teacher_id === session.user.id);
    var isCenterOwner = false;

    if (classRow && !isTeacher && classRow.center_id) {
      var centerRes = await client.from('centers')
        .select('id,owner_id')
        .eq('id', classRow.center_id)
        .maybeSingle();
      if (!isCurrentAuthTransition(authVersion)) return true;
      if (centerRes.error) throw centerRes.error;
      isCenterOwner = !!(centerRes.data && centerRes.data.owner_id === session.user.id);
    }

    if (!classRow || (!isTeacher && !isCenterOwner)) {
      if (!isCurrentAuthTransition(authVersion)) return true;
      showNotice('미니홈피를 열 수 없습니다', '해당 반의 담임 선생님 또는 원장님만 직접 접근할 수 있어요.');
      return true;
    }

    var miniRes = await client.from('class_mini').select('id').eq('class_id', directClassId).maybeSingle();
    if (!isCurrentAuthTransition(authVersion)) return true;
    if (miniRes.error) throw miniRes.error;
    if (!miniRes.data) {
      showNotice('아직 미니홈피가 준비되지 않았어요', '담임 선생님이 미니홈피를 준비한 뒤 다시 확인해주세요.');
      return true;
    }
    if (!isCurrentAuthTransition(authVersion)) return true;
    approvedClasses = [Object.assign({}, classRow, {
      enrollment_id: null,
      last_notice_read_at: null
    })];
    classList.innerHTML = approvedClasses.map(renderClassCard).join('');
    extraInviteBox.hidden = true;
    extraInviteMsg.textContent = '';
    extraInviteCode.value = '';
    await openClassMini(directClassId, authVersion);
    return true;
  }

  async function renderMiniHome(authVersion, loadVersion, classId){
    if (!isCurrentClassLoad(authVersion, loadVersion, classId)) return;
    var modules = enabledModules();
    var latestDiaryRow = latestDiary();
    var latestPhoto = latestAlbumPhoto();
    var latestDiaryPhoto = latestDiaryRow ? firstMediaForPost(latestDiaryRow.id) : null;
    var coverStyle = '';
    var coverImg = '';
    if (currentMini.cover_image) {
      try {
        coverImg = await signedCoverUrl(currentMini.cover_image, authVersion, loadVersion, classId);
      } catch (_err) {
        coverImg = '';
      }
    }
    if (!isCurrentClassLoad(authVersion, loadVersion, classId)) return;
    if (!coverImg && latestDiaryPhoto) coverImg = latestDiaryPhoto.signed_url;
    if (!coverImg && latestPhoto) coverImg = latestPhoto.signed_url;
    if (!coverImg) {
      coverStyle = ' style="background:linear-gradient(135deg,' + safeThemeColor(currentMini.theme_color) + ',#D9C8FF)"';
    }

    if (modules.length && !modules.some(function(item){ return item.key === currentMiniTab; })) {
      currentMiniTab = modules[0].key;
    }
    var nextEvent = upcomingEvent();
    var unreadNotice = hasUnreadNotice();
    var latestUnreadNotice = unreadNotice ? latestNotice() : null;
    var enabledKeys = modules.map(function(item){ return item.key; });
    var summaryCards = [];
    var enrolledText = enrolledLabel(currentMiniClass);
    var diaryHeroTitle = latestDiaryRow && String(latestDiaryRow.title || '').trim();
    var photoHeroCaption = latestPhoto && String(latestPhoto.caption || '').trim();
    var miniIntro = String(currentMini.intro || '').trim();
    var ageLabel = String(currentMiniClass.age_label || '').trim();
    var heroText = diaryHeroTitle || photoHeroCaption || miniIntro || ageLabel || '오늘도 반짝이는 하루';
    var heroClassLabel = String(currentMiniClass.name || '').trim() || '우리 반';

    if (enabledKeys.includes('notice') && latestUnreadNotice) {
      summaryCards.push({
        tab:'notice',
        kind:'notice',
        badge:'새 공지',
        title:latestUnreadNotice.title || '공지사항',
        date:latestUnreadNotice.created_at
      });
    }
    if (enabledKeys.includes('diary') && latestDiaryRow) {
      summaryCards.push({
        tab:'diary',
        kind:'diary',
        badge:'최근 일지',
        title:latestDiaryRow.title || '오늘의 반 일지',
        date:latestDiaryRow.created_at
      });
    }
    if (enabledKeys.includes('album') && latestPhoto) {
      summaryCards.push({
        tab:'album',
        kind:'album',
        badge:'최근 사진',
        title:'사진첩에 올라온 사진',
        date:latestPhoto.uploaded_at,
        image:latestPhoto.signed_url
      });
    }
    if (enabledKeys.includes('event') && nextEvent) {
      summaryCards.push({
        tab:'event',
        kind:'event',
        badge:'다가오는 행사',
        title:nextEvent.title || '행사',
        date:dateKey(nextEvent.event_date),
        day:dayFromDateKey(nextEvent.event_date)
      });
    }

    miniRoot.innerHTML =
      (summaryCards.length ? '<div class="mini-summary-grid has-cards">' +
        summaryCards.map(function(card){
          var isNotice = card.kind === 'notice';
          var cardClass = isNotice ? 'notice-alert' : 'event-teaser' + (card.kind === 'event' ? '' : ' ' + card.kind + '-teaser');
          var badgeClass = isNotice ? 'notice-alert-badge' : 'event-badge';
          var titleClass = isNotice ? 'notice-alert-title' : 'event-teaser-title';
          var dateClass = isNotice ? 'notice-alert-date' : 'event-teaser-date';
          return '<button type="button" class="' + cardClass + '" data-summary-tab="' + esc(card.tab) + '">' +
            summaryVisualHtml(card) +
            '<span class="' + badgeClass + '">' + esc(card.badge) + '</span>' +
            '<div class="' + titleClass + '">' + escWithBr(card.title) + '</div>' +
            '<div class="' + dateClass + '">' + esc(formatDate(card.date)) + '</div>' +
          '<span class="event-more">더보기 <span aria-hidden="true">→</span></span>' +
          '</button>';
        }).join('') +
      '</div>' : '<div class="empty-mini summary-empty">아직 올라온 새 소식이 없어요.</div>') +
      (modules.length
        ? '<div class="mini-tabs">' + modules.map(function(item){
            return '<button type="button" class="mini-tab' + (item.key === currentMiniTab ? ' active' : '') + '" data-mini-tab="' + esc(item.key) + '">' +
              esc(item.label) +
              (item.key === 'notice' && unreadNotice ? '<span class="mini-tab-dot" aria-label="안 읽은 공지"></span>' : '') +
            '</button>';
          }).join('') + '</div>'
        : '') +
      '<div class="mini-cover' + (coverImg ? ' has-photo' : '') + '"' + coverStyle + '>' +
        (coverImg ? '<img class="mini-cover-img" src="' + esc(coverImg) + '" alt="">' : '') +
        (enrolledText ? '<div class="enrollment-pill">' + esc(enrolledText) + '</div>' : '') +
        '<div class="month-sticker">' + esc(currentMonthLabel()) + '</div>' +
        '<div class="cover-caption">' +
          '<div class="cover-caption-meta">' +
            '<span class="cover-class-label">' + esc(heroClassLabel) + '</span>' +
            (diaryHeroTitle ? '<span class="cover-activity-label">우리 반 오늘 이야기</span>' : '') +
          '</div>' +
          '<p>' + esc(heroText) + '</p>' +
        '</div>' +
      '</div>' +
      '<section class="teacher-note">' +
        '<div class="teacher-avatar">담임</div>' +
        '<div class="speech">' + escWithBr(currentMini.teacher_message || currentMini.intro || '선생님의 한마디가 곧 올라올 예정이에요.') + '</div>' +
      '</section>' +
      (modules.length
        ? '<div class="mini-content" id="miniContent"></div>'
        : '<div class="empty-mini">아직 준비 중이에요.</div>');

    if (modules.length) renderMiniTab();
  }

  function renderMiniTab(){
    var content = document.getElementById('miniContent');
    if (!content) return;
    if (currentMiniTab === 'diary') renderDiaryTab(content);
    if (currentMiniTab === 'event') renderEventTab(content);
    if (currentMiniTab === 'album') renderAlbumTab(content);
    if (currentMiniTab === 'guestbook') renderGuestbookTab(content);
    if (currentMiniTab === 'notice') renderNoticeTab(content);
  }

  function renderDiaryTab(content){
    var rows = diaryRows();
    if (!rows.length) {
      content.innerHTML = '<div class="empty-mini">아직 올라온 일지가 없어요.</div>';
      return;
    }
    content.innerHTML = rows.map(function(row){
      var media = firstMediaForPost(row.id);
      return '<article class="mini-card">' +
        '<div class="mini-date">' + esc(formatDate(row.created_at)) + '</div>' +
        '<div class="mini-card-title">' + esc(row.title || '오늘의 반 일지') + '</div>' +
        (media ? '<div class="scrap-photo"><img src="' + esc(media.signed_url) + '" alt=""></div>' : '') +
        '<div class="mini-body">' + escWithBr(row.body || '') + '</div>' +
      '</article>';
    }).join('');
  }

  function renderEventTab(content){
    var rows = eventRows();
    if (!rows.length) {
      content.innerHTML = '<div class="empty-mini">아직 등록된 행사가 없어요.</div>';
      return;
    }

    var monthEvents = rows.filter(function(row){
      var key = dateKey(row.event_date);
      return key && sameMonth(new Date(key + 'T00:00:00'), eventCalendarDate);
    });
    if (!selectedEventDate || !sameMonth(new Date(selectedEventDate + 'T00:00:00'), eventCalendarDate)) {
      var firstInMonth = monthEvents[0];
      selectedEventDate = firstInMonth ? dateKey(firstInMonth.event_date) : toDateInput(eventCalendarDate);
    }

    var start = new Date(eventCalendarDate);
    start.setDate(1 - eventCalendarDate.getDay());
    var today = toDateInput(new Date());
    var days = [];
    for (var i = 0; i < 42; i++) {
      var d = new Date(start);
      d.setDate(start.getDate() + i);
      var key = toDateInput(d);
      var count = rows.filter(function(row){ return dateKey(row.event_date) === key; }).length;
      days.push('<button type="button" class="event-day' +
        (sameMonth(d, eventCalendarDate) ? '' : ' out') +
        (key === today ? ' today' : '') +
        (key === selectedEventDate ? ' selected' : '') +
        '" data-event-date="' + esc(key) + '">' +
        '<span class="event-day-num">' + d.getDate() + '</span>' +
        (count ? '<span class="event-day-dot">' + count + '</span>' : '') +
      '</button>');
    }

    var selectedRows = rows.filter(function(row){ return dateKey(row.event_date) === selectedEventDate; });
    content.innerHTML =
      '<section class="event-calendar-card">' +
        '<div class="event-calendar-head">' +
          '<button type="button" class="btn ghost event-nav" data-event-month="-1">◀</button>' +
          '<div class="event-calendar-title">' + eventCalendarDate.getFullYear() + '년 ' + (eventCalendarDate.getMonth() + 1) + '월</div>' +
          '<button type="button" class="btn ghost event-nav" data-event-month="1">▶</button>' +
        '</div>' +
        '<div class="event-weekdays"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>' +
        '<div class="event-calendar-grid">' + days.join('') + '</div>' +
        '<div class="event-detail">' +
          '<div class="event-detail-title">' + esc(formatDate(selectedEventDate)) + ' 행사</div>' +
          (selectedRows.length ? selectedRows.map(function(row){
            return '<article class="event-detail-item">' +
              '<div class="mini-card-title">' + escWithBr(row.title || '행사') + '</div>' +
              '<div class="mini-body">' + escWithBr(row.body || '') + '</div>' +
            '</article>';
          }).join('') : '<div class="empty-mini">선택한 날짜에 등록된 행사가 없어요.</div>') +
        '</div>' +
      '</section>';
  }

      ? groups.find(function(group){ return group.album_key === selectedAlbumKey; })
      : null;
    if (selectedAlbumKey && !selectedGroup) selectedAlbumKey = null;

    if (selectedGroup) {
      content.innerHTML =
        '<section class="album-detail">' +
          '<button type="button" class="btn ghost album-back" data-album-back>사진첩으로 돌아가기</button>' +
          '<header class="album-detail-head">' +
            '<h2 class="album-detail-title">' + esc(selectedGroup.title || '사진첩') + '</h2>' +
            '<div class="album-detail-meta">' +
              esc(formatDate(selectedGroup.created_at)) + ' · ' + esc(selectedGroup.photo_count) + '장' +
            '</div>' +
            (!selectedGroup.is_virtual && selectedGroup.body
              ? '<div class="album-detail-body">' + escWithBr(selectedGroup.body) + '</div>'
              : '') +
          '</header>' +
          '<div class="album-grid-mini">' + selectedGroup.photos.map(function(row){

              '<img src="' + esc(row.signed_url) + '" alt="' + esc(photoLabel) + '">' +
            '</button>';
          }).join('') + '</div>' +
        '</section>';
      return;
    }

    if (!groups.length) {
      content.innerHTML = '<div class="empty-mini">아직 올라온 사진이 없어요.</div>';
      return;
    }
    content.innerHTML = '<div class="album-list-mini">' + groups.map(function(group){
      return '<button type="button" class="album-card" data-open-album="' + esc(group.album_key) + '">' +
        '<span class="album-card-cover">' +
          '<img src="' + esc(group.representative_photo.signed_url) + '" alt="">' +
          (group.is_virtual ? '<span class="album-card-kind">단독 사진</span>' : '') +
        '</span>' +
        '<span class="album-card-body">' +
          '<span class="album-card-title">' + esc(group.title || '사진첩') + '</span>' +
          '<span class="album-card-meta">' +
            '<span>' + esc(formatDate(group.created_at)) + '</span>' +
            '<span>' + esc(group.photo_count) + '장</span>' +
          '</span>' +
        '</span>' +

  function renderGuestbookTab(content){

        '<button type="submit" class="btn" id="commentSubmit" style="margin-top:12px">등록</button>' +

  function renderNoticeTab(content){
    var rows = noticeRows();
    if (!rows.length) {
      content.innerHTML = '<div class="empty-mini">아직 올라온 공지가 없어요.</div>';
      return;
    }
    content.innerHTML = rows.map(function(row){
      return '<article class="mini-card">' +
        '<div class="mini-date">' + esc(formatDate(row.created_at)) + '</div>' +
        '<div class="mini-card-title">' + esc(row.title || '공지사항') + '</div>' +
        '<div class="mini-body">' + escWithBr(row.body || '') + '</div>' +
      '</article>';

  async function markNoticesRead(){
    var startedAuthVersion = authTransitionVersion;
    var startedClassLoadVersion = classLoadVersion;
    var targetEnrollment = currentEnrollment;
    var targetEnrollmentId = targetEnrollment && targetEnrollment.id;
    var targetClassId = currentMiniClass && currentMiniClass.id;
    var targetUserId = currentSession && currentSession.user ? currentSession.user.id : '';
    var readAt = new Date().toISOString();
    if (!targetEnrollment || !targetEnrollmentId || !targetClassId || !targetUserId) return;
    if (!hasUnreadNotice()) return;
    var res = await client.from('class_enrollments')
      .update({ last_notice_read_at: readAt })
      .eq('id', targetEnrollment.id)
      .eq('parent_id', targetUserId);
    var currentUserId = currentSession && currentSession.user ? currentSession.user.id : '';
    var currentEnrollmentId = currentEnrollment && currentEnrollment.id;
    var currentClassId = currentMiniClass && currentMiniClass.id;
    if (
      startedAuthVersion !== authTransitionVersion ||
      startedClassLoadVersion !== classLoadVersion ||
      currentUserId !== targetUserId ||
      currentEnrollmentId !== targetEnrollmentId ||
      currentClassId !== targetClassId
    ) return;
    if (res.error) {
      showNotice('공지 읽음 처리에 실패했습니다', res.error.message);
      return;
    }
    targetEnrollment.last_notice_read_at = readAt;
    if (currentEnrollment && currentEnrollment.id === targetEnrollmentId) {
      currentEnrollment.last_notice_read_at = readAt;
    }
    if (currentMiniClass && currentMiniClass.id === targetClassId) {
      currentMiniClass.last_notice_read_at = readAt;
    }
    var cached = approvedClasses.find(function(row){ return row.id === targetClassId; });
    if (cached) cached.last_notice_read_at = readAt;
    if (currentMini) {
      await renderMiniHome(startedAuthVersion, startedClassLoadVersion, targetClassId);
    }
  }

  async function submitComment(form){
    var body = form.querySelector('#commentBody');
    var submit = form.querySelector('#commentSubmit');
    var msg = form.querySelector('#commentMsg');
    var text = body.value.trim();
    var startedAuthVersion = authTransitionVersion;
    var targetUserId = currentSession && currentSession.user ? currentSession.user.id : '';
    var targetClass = currentMiniClass;
    var targetClassId = targetClass && targetClass.id;
    var targetEnrollmentId = currentEnrollment && currentEnrollment.id;
    if (!text || !targetUserId || !targetClass || !targetClassId || !targetEnrollmentId) return;
    function isCurrentCommentTarget(){
      var currentUserId = currentSession && currentSession.user ? currentSession.user.id : '';
      var currentClassId = currentMiniClass && currentMiniClass.id;
      var currentEnrollmentId = currentEnrollment && currentEnrollment.id;
      return startedAuthVersion === authTransitionVersion &&
        currentUserId === targetUserId &&
        currentClassId === targetClassId &&
        currentEnrollmentId === targetEnrollmentId;
    }
    submit.disabled = true;
    msg.textContent = '등록 중입니다.';
    msg.className = 'msg';
    var res = await client.from('class_comments').insert({
      class_id: targetClassId,
      author_id: targetUserId,
      body: text
    });
    if (!isCurrentCommentTarget()) return;
    if (res.error) {
      submit.disabled = false;
      msg.innerHTML = escWithBr(res.error.message);
      msg.className = 'msg error';
      return;
    }
    var commentsRes = await client.from('class_comments')
      .select('*')
      .eq('class_id', targetClassId)
      .order('created_at', { ascending:false });
    if (!isCurrentCommentTarget()) return;
    if (commentsRes.error) {
      submit.disabled = false;
      msg.innerHTML = escWithBr(commentsRes.error.message);
      msg.className = 'msg error';
      return;
    }
    miniCache.comments = commentsRes.data || [];
    body.value = '';
    submit.disabled = false;
    msg.textContent = '등록되었습니다.';
    msg.className = 'msg';
    if (currentMiniTab === 'guestbook') {
      var content = document.getElementById('miniContent');
      if (content) {
        renderGuestbookTab(content);
        var renderedMsg = content.querySelector('#commentMsg');
        if (renderedMsg) {
          renderedMsg.textContent = '등록되었습니다.';
          renderedMsg.className = 'msg';
        }
      }
    }
  }

  async function loadParentState(session, authVersion){
    if (!isCurrentAuthTransition(authVersion)) return;
    if (!session || !session.user) {
      if (!isCurrentAuthTransition(authVersion)) return;
      logoutBtn.hidden = true;
      leadText.textContent = '로그인 후 초대 코드를 입력해주세요.';
      showPanel(authPanel);
      return;
    }

    if (!isCurrentAuthTransition(authVersion)) return;
    logoutBtn.hidden = false;
    leadText.textContent = '반 연결 상태를 확인하고 있어요.';
    showPanel(loadingPanel);

    try {
      if (directClassId) {
        var directHandled = await loadDirectClassMini(session, authVersion);
        if (!isCurrentAuthTransition(authVersion)) return;
        if (directHandled) return;
      }

      var res = await client
        .from('class_enrollments')
        .select('id, status, class_id, last_notice_read_at')
        .eq('parent_id', session.user.id);

      if (!isCurrentAuthTransition(authVersion)) return;
      if (res.error) throw res.error;

      var enrollments = res.data || [];
      var approved = enrollments.filter(function(row){ return row.status === 'approved'; });
      var pending = enrollments.filter(function(row){ return row.status === 'pending'; });

      if (approved.length) {
        var rows = await loadClassRows(approved.map(function(row){ return row.class_id; }));
        if (!isCurrentAuthTransition(authVersion)) return;
        rows = rows.map(function(row){
          var enrollment = approved.find(function(item){ return item.class_id === row.id; });
          return Object.assign({}, row, {
            enrollment_id: enrollment ? enrollment.id : null,
            last_notice_read_at: enrollment ? enrollment.last_notice_read_at : null
          });
        });
        approvedClasses = rows;
        if (currentMiniClass && !miniPanel.hidden) return;
        classList.innerHTML = rows.map(renderClassCard).join('');
        extraInviteBox.hidden = true;
        extraInviteMsg.textContent = '';
        extraInviteCode.value = '';
        leadText.textContent = '승인된 반 미니홈피 목록입니다.';
        showPanel(classesPanel);
        return;
      }

      if (pending.length) {
        leadText.textContent = '승인을 기다리고 있어요.';
        showPanel(pendingPanel);
        return;
      }

      inviteMsg.textContent = '';
      inviteCode.value = '';
      leadText.textContent = '선생님이 알려준 초대 코드를 입력해주세요.';
      showPanel(invitePanel);
    } catch (err) {
      if (!isCurrentAuthTransition(authVersion)) return;
      showNotice('상태를 불러오지 못했습니다', err && err.message ? err.message : String(err));
    }
  }

  async function redeemInvite(code, msgEl, submitBtn){
    var startedAuthVersion = authTransitionVersion;
    var targetUserId = currentSession && currentSession.user ? currentSession.user.id : '';
    var targetCode = String(code || '').trim();
    if (!targetUserId || !targetCode) return;
    function isCurrentInviteRequest(){
      var currentUserId = currentSession && currentSession.user ? currentSession.user.id : '';
      return startedAuthVersion === authTransitionVersion &&
        !!currentSession &&
        currentUserId === targetUserId;
    }
    msgEl.textContent = '';
    submitBtn.disabled = true;
    msgEl.textContent = '연결 신청 중입니다.';
    msgEl.className = 'msg';

    var res;
    try {
      res = await client.rpc('redeem_class_invite', { p_code: targetCode });
    } catch (err) {
      if (!isCurrentInviteRequest()) return;
      submitBtn.disabled = false;
      msgEl.innerHTML = escWithBr(err && err.message ? err.message : String(err));
      msgEl.className = 'msg error';
      return;
    }
    if (!isCurrentInviteRequest()) return;

    submitBtn.disabled = false;
    if (res.error) {
      msgEl.innerHTML = escWithBr(res.error.message);
      msgEl.className = 'msg error';
      return;
    }

    leadText.textContent = '연결 신청이 완료되었습니다.';
    showNotice('연결 신청이 완료되었습니다', '선생님 또는 원장님 승인을 기다려주세요.');
  }

  authModeBtn.addEventListener('click', function(){
    setAuthMode(authMode === 'login' ? 'signup' : 'login');
  });

  kakaoLoginBtn.addEventListener('click', async function(){
    authMsg.textContent = '';
    kakaoLoginBtn.disabled = true;

    try {
      var res = await client.auth.signInWithOAuth({
        provider: 'kakao',
        options: {
          redirectTo: window.location.origin + '/parent.html'
        }
      });
      if (res.error) throw res.error;
    } catch (err) {
      authMsg.innerHTML = escWithBr(err && err.message ? err.message : String(err));
      authMsg.className = 'msg error';
      kakaoLoginBtn.disabled = false;
    }
  });

  authForm.addEventListener('submit', async function(e){
    e.preventDefault();
    authMsg.textContent = '';
    authSubmit.disabled = true;

    try {
      if (authMode === 'signup') {
        var signUpRes = await client.auth.signUp({
          email: authEmail.value.trim(),
          password: authPassword.value
        });
        if (signUpRes.error) throw signUpRes.error;
        if (!(signUpRes.data && signUpRes.data.session)) {
          leadText.textContent = '이메일 확인이 필요합니다.';
          showNotice('이메일을 확인해주세요', '가입 확인 메일을 열어 인증을 완료한 뒤 다시 로그인해주세요.');
        }
      } else {
        var loginRes = await client.auth.signInWithPassword({
          email: authEmail.value.trim(),
          password: authPassword.value
        });
        if (loginRes.error) throw loginRes.error;
      }
    } catch (err) {
      authMsg.innerHTML = escWithBr(err && err.message ? err.message : String(err));
      authMsg.className = 'msg error';
    } finally {
      authSubmit.disabled = false;
    }
  });

  inviteForm.addEventListener('submit', async function(e){
    e.preventDefault();
    await redeemInvite(inviteCode.value.trim(), inviteMsg, inviteSubmit);
  });

  showExtraInviteBtn.addEventListener('click', function(){
    extraInviteBox.hidden = !extraInviteBox.hidden;
    extraInviteMsg.textContent = '';
  });

  extraInviteForm.addEventListener('submit', async function(e){
    e.preventDefault();
    await redeemInvite(extraInviteCode.value.trim(), extraInviteMsg, extraInviteSubmit);
  });

  classList.addEventListener('click', function(e){
    var btn = e.target.closest('[data-open-class]');
    if (!btn) return;
    openClassMini(btn.dataset.openClass, authTransitionVersion);
  });

  miniBackBtn.addEventListener('click', function(){
    classLoadVersion += 1;
    leadText.textContent = '승인된 반 미니홈피 목록입니다.';
    showPanel(classesPanel);
  });

  miniRoot.addEventListener('error', function(e){
    if (!e.target || !e.target.matches('.summary-photo-img')) return;
    var visual = e.target.closest('.summary-photo');
    if (visual) visual.classList.add('is-error');
  }, true);

  miniRoot.addEventListener('click', async function(e){
    var summaryCard = e.target.closest('[data-summary-tab]');
    if (summaryCard) {
      var summaryAuthVersion = authTransitionVersion;
      var summaryClassLoadVersion = classLoadVersion;
      var summaryClassId = currentMiniClass && currentMiniClass.id;
      currentMiniTab = summaryCard.dataset.summaryTab;
      if (currentMiniTab !== 'album') selectedAlbumKey = null;
      if (currentMiniTab === 'event') {
        var next = upcomingEvent();
        if (next) {
          selectedEventDate = dateKey(next.event_date);
          eventCalendarDate = firstOfMonth(new Date(selectedEventDate + 'T00:00:00'));
        }
      }
      await renderMiniHome(summaryAuthVersion, summaryClassLoadVersion, summaryClassId);
      if (!isCurrentClassLoad(summaryAuthVersion, summaryClassLoadVersion, summaryClassId)) return;
      if (currentMiniTab === 'notice') await markNoticesRead();
      if (!isCurrentClassLoad(summaryAuthVersion, summaryClassLoadVersion, summaryClassId)) return;
      var tabsForSummary = miniRoot.querySelector('.mini-tabs');
      if (tabsForSummary) tabsForSummary.scrollIntoView({ behavior:'smooth', block:'start' });
      return;
    }
    var tab = e.target.closest('[data-mini-tab]');
    if (tab) {
      var tabAuthVersion = authTransitionVersion;
      var tabClassLoadVersion = classLoadVersion;
      var tabClassId = currentMiniClass && currentMiniClass.id;
      currentMiniTab = tab.dataset.miniTab;
      if (currentMiniTab !== 'album') selectedAlbumKey = null;
      await renderMiniHome(tabAuthVersion, tabClassLoadVersion, tabClassId);
      if (!isCurrentClassLoad(tabAuthVersion, tabClassLoadVersion, tabClassId)) return;
      if (currentMiniTab === 'notice') await markNoticesRead();
      return;
    }
    var albumBackBtn = e.target.closest('[data-album-back]');
    if (albumBackBtn) {
      selectedAlbumKey = null;
      renderAlbumTab(document.getElementById('miniContent'));
      return;
    }
    var albumBtn = e.target.closest('[data-open-album]');
    if (albumBtn) {
      selectedAlbumKey = albumBtn.dataset.openAlbum;
      renderAlbumTab(document.getElementById('miniContent'));
      return;
    }
    var monthBtn = e.target.closest('[data-event-month]');
    if (monthBtn) {
      var delta = Number(monthBtn.dataset.eventMonth || 0);
      eventCalendarDate = new Date(eventCalendarDate.getFullYear(), eventCalendarDate.getMonth() + delta, 1);
      selectedEventDate = toDateInput(eventCalendarDate);
      renderMiniTab();
      return;
    }
    var dateBtn = e.target.closest('[data-event-date]');
    if (dateBtn) {
      selectedEventDate = dateBtn.dataset.eventDate;
      eventCalendarDate = firstOfMonth(new Date(selectedEventDate + 'T00:00:00'));
      renderMiniTab();
      return;
    }
    var imageBtn = e.target.closest('[data-open-image]');
    if (imageBtn) {
      imageModalImg.src = imageBtn.dataset.openImage;
      imageModal.hidden = false;
    }
  });

  miniRoot.addEventListener('submit', async function(e){
    if (e.target && e.target.id === 'commentForm') {
      e.preventDefault();
      await submitComment(e.target);
    }
  });

  imageModalClose.addEventListener('click', function(){
    imageModal.hidden = true;
    imageModalImg.removeAttribute('src');
  });

  imageModal.addEventListener('click', function(e){
    if (e.target === imageModal) {
      imageModal.hidden = true;
      imageModalImg.removeAttribute('src');
    }
  });

  logoutBtn.addEventListener('click', async function(){
    var res = await client.auth.signOut();
    if (res.error) {
      showNotice('로그아웃하지 못했습니다', res.error.message);
      return;
    }
    currentSession = null;
    currentMiniClass = null;
    logoutBtn.hidden = true;
    setAuthMode('login');
    leadText.textContent = '로그인 후 초대 코드를 입력해주세요.';
    showPanel(authPanel);
  });

  client.auth.onAuthStateChange(function(event, session){
    var currentUserId = authSessionUserId(currentSession);
    var nextUserId = authSessionUserId(session);
    currentSession = session;

    if (event === 'INITIAL_SESSION') return;
    if (event === 'TOKEN_REFRESHED') {
      if (!initialAuthLoaded && nextUserId) {
        if (!pendingInitialAuthTransition) {
          pendingInitialAuthTransition = { event: event, session: session };
        } else if (
          pendingInitialAuthTransition.event !== 'SIGNED_OUT' &&
          authSessionUserId(pendingInitialAuthTransition.session) === nextUserId &&
          isNewerSameUserSession(session, pendingInitialAuthTransition.session)
        ) {
          pendingInitialAuthTransition.session = session;
        }
      }
      return;
    }
    if (!initialAuthLoaded) {
      pendingInitialAuthTransition = { event: event, session: session };
      return;
    }

    if (event === 'SIGNED_OUT' || !nextUserId) {
      queueAuthTransition(null);
      resetMiniStateForAuthChange();
      logoutBtn.hidden = true;
      leadText.textContent = '로그인 후 초대 코드를 입력해주세요.';
      showPanel(authPanel);
      drainAuthTransitions();
      return;
    }

    if (currentUserId === nextUserId) return;

    queueAuthTransition(session);
    resetMiniStateForAuthChange();
    logoutBtn.hidden = false;
    leadText.textContent = '반 연결 상태를 확인하고 있어요.';
    showPanel(loadingPanel);
    drainAuthTransitions();
  });

  client.auth.getSession().then(function(res){
    var initialSession = resolveInitialAuthSession(res.data ? res.data.session : null);
    pendingInitialAuthTransition = null;
    currentSession = initialSession;
    initialAuthLoaded = true;
    queueAuthTransition(initialSession);
    return drainAuthTransitions();
  }, function(){
    var initialSession = resolveInitialAuthSession(null);
    pendingInitialAuthTransition = null;
    currentSession = initialSession;
    initialAuthLoaded = true;
    queueAuthTransition(initialSession);
    return drainAuthTransitions();
  });

  setAuthMode('login');
})();
</script>
</body>
</html>
