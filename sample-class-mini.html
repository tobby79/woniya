    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function formatDate(value) {

    }

    function formatDateTime(value) {
      const date = new Date(value);
      const hour = date.getHours();
      const minute = String(date.getMinutes()).padStart(2, '0');
      const period = hour < 12 ? '오전' : '오후';
      const displayHour = hour % 12 || 12;
      return `${date.getMonth() + 1}월 ${date.getDate()}일 ${period} ${displayHour}:${minute}`;
    }

      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

      const closed = item.status === 'closed';
      return `<section class="parent-inquiry-view parent-inquiry-panel" aria-labelledby="inquiryDetailTitle"><div class="parent-inquiry-detail-nav"><button class="btn ghost small" type="button" data-action="inquiry-list">문의 목록으로 돌아가기</button></div><h2 id="inquiryDetailTitle" class="parent-inquiry-visually-hidden">문의 상세</h2><header class="parent-inquiry-detail-head"><div class="parent-inquiry-detail-metadata"><span class="parent-inquiry-detail-document">문의번호 ${escapeHtml(item.documentNo)}</span><span class="parent-inquiry-detail-separator" aria-hidden="true">·</span><span class="parent-inquiry-detail-date">접수 ${formatDate(item.createdAt)}</span></div><div class="parent-inquiry-detail-badges">${item.unread ? '<span class="parent-inquiry-unread-badge">새 메시지</span>' : ''}<span class="parent-inquiry-status-badge">${closed ? '종료' : '진행 중'}</span></div></header><div class="parent-inquiry-message-list">${item.messages.map((message) => { const role = roleInfo(message.senderRole); return `<article class="parent-inquiry-message ${role.className}"><div class="parent-inquiry-message-content"><div class="parent-inquiry-message-role">${role.label}</div><div class="parent-inquiry-message-bubble">${escapeHtml(message.body)}</div><time class="parent-inquiry-message-meta" datetime="${escapeHtml(message.createdAt)}">${formatDateTime(message.createdAt)}</time></div></article>`; }).join('')}</div>${closed ? `<aside class="parent-inquiry-closed-notice" aria-label="종료된 문의 안내"><p class="parent-inquiry-closed-title">이 문의는 종료되었습니다.</p><p class="parent-inquiry-closed-description">추가로 궁금한 내용은 새 문의로 남겨 주세요.<br>샘플에서는 실제 문의가 전송되지 않습니다.</p><div class="parent-inquiry-closed-actions"><button class="btn" type="button" data-action="inquiry-create">새 문의 작성</button></div></aside>` : `<section class="parent-inquiry-reply-section" aria-label="메시지 작성"><div class="parent-inquiry-form"><label for="sampleReplyBody">메시지 작성</label><textarea id="sampleReplyBody" maxlength="1000" placeholder="답장 내용을 입력해 주세요"></textarea><p id="replyFormStatus" class="form-status" role="status" aria-live="polite"></p><div class="parent-inquiry-detail-actions"><button class="btn" type="button" data-action="sample-submit-reply">메시지 보내기</button></div></div></section>`}</section>`;
    }

    function inquiryMarkup() {
      if (state.inquiry.view === 'create') return inquiryCreateMarkup();
      if (state.inquiry.view === 'detail') {
        const item = SAMPLE_DATA.inquiries.find((inquiry) => inquiry.id === state.inquiry.selectedId);
        return item ? inquiryDetailMarkup(item) : inquiryListMarkup();
      }
      return inquiryListMarkup();
    }

    function activeContentMarkup() {
      if (state.miniView === 'home') return homeMarkup();
      if (state.activeTab === 'event') return eventMarkup();
      if (state.activeTab === 'album') return albumMarkup();
      if (state.activeTab === 'inquiry') return inquiryMarkup();
      if (state.activeTab === 'notice') return noticeMarkup();
      return diaryMarkup();
    }

    function render() {
      miniRoot.innerHTML = `${heroMarkup()}${latestMarkup()}${tabsMarkup()}<div id="miniContent" class="mini-content" role="tabpanel" aria-labelledby="${state.miniView === 'section' ? `tab-${state.activeTab}` : 'classTitle'}">${activeContentMarkup()}</div>`;
      syncFloatingInquiry();
    }

    function syncFloatingInquiry() {
      const inquiryVisible = state.miniView === 'section' && state.activeTab === 'inquiry';
      floatingInquiry.hidden = inquiryVisible || Boolean(state.modalPhotoId);
      floatingDot.hidden = !SAMPLE_DATA.inquiries.some((item) => item.unread);
    }

    function showSection(tabKey, options = {}) {
      state.miniView = 'section';
      state.activeTab = tabKey;
      if (tabKey !== 'album') state.selectedAlbumId = null;
      if (tabKey === 'inquiry' && options.resetInquiry !== false) {
        state.inquiry.view = 'list';
        state.inquiry.selectedId = null;
      }
      if (tabKey === 'event' && options.featured) {
        state.calendarMonth = new Date(2026, 7, 1);
        state.selectedEventDate = SAMPLE_DATA.events[0].date;
      }
      render();
      if (options.scroll !== false) document.getElementById('miniContent')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function findPhoto(photoId) {
      for (const album of SAMPLE_DATA.albums) {
        const photo = album.photos.find((item) => item.id === photoId);
        if (photo) return photo;
      }
      return null;
    }

    function openPhoto(photoId, trigger) {
      const photo = findPhoto(photoId);
      if (!photo) return;
      modalReturnFocus = trigger;
      state.modalPhotoId = photo.id;
      modalImage.src = illustrationData(photo.label, photo.colors);
      modalImage.alt = photo.alt;
      modalCaption.textContent = photo.label;
      photoModal.hidden = false;
      photoModal.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
      syncFloatingInquiry();
      modalClose.focus();
    }

    function closePhoto() {
      if (!state.modalPhotoId) return;
      state.modalPhotoId = null;
      photoModal.hidden = true;
      photoModal.setAttribute('aria-hidden', 'true');
      modalImage.removeAttribute('src');
      modalImage.alt = '';
      modalCaption.textContent = '';
      document.body.classList.remove('modal-open');
      syncFloatingInquiry();
      const returnTarget = modalReturnFocus;
      modalReturnFocus = null;
      returnTarget?.focus();
    }

    function showSampleStatus(id) {
      const status = document.getElementById(id);
      if (status) status.textContent = '샘플 화면에서는 실제 문의가 전송되지 않습니다.';
    }

    miniRoot.addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button || !miniRoot.contains(button)) return;

      if (button.dataset.action === 'home') {
        state.miniView = 'home';
        state.activeTab = 'diary';
        state.calendarMonth = new Date(2026, 7, 1);
        state.selectedEventDate = SAMPLE_DATA.events[0].date;
        state.selectedAlbumId = null;
        state.inquiry.view = 'list';
        state.inquiry.selectedId = null;
        render();
        document.querySelector('.mini-hero')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }

      if (button.dataset.summaryTab) {
        if (button.dataset.summaryTab === 'album') state.selectedAlbumId = SAMPLE_DATA.albums[0].id;
        showSection(button.dataset.summaryTab, { featured: button.dataset.summaryTab === 'event' });
        return;
      }

      if (button.dataset.tab) {
        showSection(button.dataset.tab);
        return;
      }

      if (button.dataset.eventMonth) {
        state.calendarMonth = new Date(state.calendarMonth.getFullYear(), state.calendarMonth.getMonth() + Number(button.dataset.eventMonth), 1);
        const firstEventInMonth = SAMPLE_DATA.events.find((item) => {
          const eventDate = new Date(item.date);
          return eventDate.getFullYear() === state.calendarMonth.getFullYear() && eventDate.getMonth() === state.calendarMonth.getMonth();
        });
        state.selectedEventDate = firstEventInMonth ? firstEventInMonth.date : toDateKey(state.calendarMonth);
        render();
        return;
      }

      if (button.dataset.eventDate) {
        state.selectedEventDate = button.dataset.eventDate;
        render();
        return;
      }

      if (button.dataset.albumId) {
        state.selectedAlbumId = button.dataset.albumId;
        render();
        return;
      }

      if (button.dataset.action === 'album-back') {
        state.selectedAlbumId = null;
        render();
        return;
      }

      if (button.dataset.photoId) {
        openPhoto(button.dataset.photoId, button);
        return;
      }

      if (button.dataset.inquiryId) {
        state.inquiry.view = 'detail';
        state.inquiry.selectedId = button.dataset.inquiryId;
        render();
        return;
      }

      if (button.dataset.action === 'inquiry-create') {
        state.inquiry.view = 'create';
        state.inquiry.selectedId = null;
        render();
        return;
      }

      if (button.dataset.action === 'inquiry-list') {
        state.inquiry.view = 'list';
        state.inquiry.selectedId = null;
        render();
        return;
      }

      if (button.dataset.action === 'sample-submit-inquiry') {
        showSampleStatus('inquiryFormStatus');
        return;
      }

      if (button.dataset.action === 'sample-submit-reply') {
        showSampleStatus('replyFormStatus');
      }
    });

    floatingInquiry.addEventListener('click', () => {
      showSection('inquiry');
    });

    modalClose.addEventListener('click', closePhoto);

    photoModal.addEventListener('click', (event) => {
      if (event.target === photoModal) closePhoto();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && state.modalPhotoId) closePhoto();
    });

    render();
  </script>
</body>
</html>
