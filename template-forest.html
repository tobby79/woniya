<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>원이야 - 숲 템플릿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gaegu:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --bark: #2F3D2A;
      --moss: #4A6B3A;
      --leaf: #7BA05B;
      --leaf-light: #A8C686;
      --sun: #F4D58D;
      --sun-warm: #E8B864;
      --soil: #5C4A3A;
      --paper: #FBFBF4;
      --paper-warm: #F4F1E4;
      --ink: #26331F;
      --ink-soft: #566049;
      --canopy-top: #DCE8CC;
      --canopy-bottom: #EEF2E0;

      --display: 'Gowun Batang', serif;
      --hand: 'Gaegu', cursive;
      --body: 'Pretendard', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      font-family: var(--body);
      color: var(--ink);
      background: var(--canopy-bottom);
      overflow-x: hidden;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 숲 배경 ── */
    .forest-bg {
      position: fixed;
      inset: 0;
      z-index: -3;
      background: linear-gradient(180deg, var(--canopy-top) 0%, var(--canopy-bottom) 60%);
      transition: background 1.4s ease;
    }

    .light-rays {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(118deg, transparent 38%, rgba(244, 213, 141, .16) 42%, transparent 46%),
        linear-gradient(122deg, transparent 55%, rgba(244, 213, 141, .1) 59%, transparent 63%),
        linear-gradient(110deg, transparent 70%, rgba(244, 213, 141, .12) 73%, transparent 77%);
      opacity: .9;
      transition: opacity 1.4s ease;
    }

    .leaf-float {
      position: fixed;
      z-index: 1;
      pointer-events: none;
      will-change: transform
    }

    .leaf-float svg {
      display: block;
      filter: drop-shadow(0 4px 6px rgba(47, 61, 42, .15))
    }

    /* ── 상단바 ── */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 40;
      padding: 14px 0;
      background: rgba(251, 251, 244, .74);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 1px 0 rgba(74, 107, 58, .14)
    }

    .topbar .brand {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.3rem;
      color: var(--bark);
      text-decoration: none;
      letter-spacing: -.5px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .topbar .brand::before {
      content: "";
      width: 18px;
      height: 18px;
      background: var(--leaf);
      border-radius: 0 50% 50% 50%;
      transform: rotate(45deg);
      flex: none
    }

    .menu-btn {
      visibility: hidden;
      width: 42px;
      height: 42px;
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      border-radius: 10px
    }

    .menu-btn span {
      width: 23px;
      height: 2.5px;
      background: var(--bark);
      border-radius: 2px;
      transition: transform .3s ease, opacity .3s ease
    }

    .menu-btn.open span:nth-child(1) {
      transform: translateY(7.5px) rotate(45deg)
    }

    .menu-btn.open span:nth-child(2) {
      opacity: 0
    }

    .menu-btn.open span:nth-child(3) {
      transform: translateY(-7.5px) rotate(-45deg)
    }

    .menu-panel {
      position: fixed;
      top: 64px;
      right: 16px;
      left: 16px;
      z-index: 41;
      background: var(--paper);
      border-radius: 22px;
      box-shadow: 0 24px 54px -18px rgba(47, 61, 42, .42);
      padding: 12px;
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: opacity .3s ease, transform .3s ease, visibility .3s;
      border: 1px solid rgba(123, 160, 91, .16)
    }

    .menu-panel.open {
      opacity: 1;
      visibility: visible;
      transform: none
    }

    .menu-panel a {
      padding: 14px 18px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 600;
      border-radius: 14px;
      font-size: 1rem
    }

    .menu-panel a:hover {
      background: var(--paper-warm)
    }

    .menu-panel a.menu-cta {
      background: var(--moss);
      color: #fff;
      text-align: center;
      margin-top: 6px
    }

    /* ── 공통 ── */
    .wrap {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 1s ease, transform 1s cubic-bezier(.22, .9, .3, 1)
    }

    .reveal.in {
      opacity: 1;
      transform: none
    }

    /* ── 히어로: 숲 입구 ── */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 14vh 24px 8vh;
      position: relative
    }

    .hero .eyebrow {
      font-family: var(--hand);
      font-size: 1.4rem;
      color: var(--moss);
      letter-spacing: .5px;
      margin-bottom: 16px;
      font-weight: 700
    }

    .hero h1 {
      font-family: var(--display);
      font-weight: 700;
      font-size: clamp(2.7rem, 12vw, 4rem);
      line-height: 1.3;
      letter-spacing: -1px;
      color: var(--bark)
    }

    .hero h1 .glow {
      color: var(--moss);
      position: relative;
      display: inline-block
    }

    .hero h1 .glow::after {
      content: "";
      position: absolute;
      left: -4%;
      right: -4%;
      bottom: 8px;
      height: 16px;
      background: var(--leaf-light);
      opacity: .5;
      z-index: -1;
      border-radius: 8px;
      transform: rotate(-1.2deg)
    }

    .hero p {
      margin-top: 24px;
      font-size: 1.06rem;
      color: var(--ink-soft);
      max-width: 380px
    }

    .hero .enter-cue {
      margin-top: 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      font-family: var(--hand);
      font-size: 1.1rem;
      color: var(--moss);
      font-weight: 700
    }

    .hero .enter-cue .path {
      width: 2px;
      height: 50px;
      background: linear-gradient(180deg, var(--leaf), transparent);
      position: relative
    }

    .hero .enter-cue .path::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      width: 8px;
      height: 8px;
      border-radius: 0 50% 50% 50%;
      background: var(--leaf);
      transform: translateX(-50%) rotate(45deg);
      animation: walk 1.8s infinite
    }

    @keyframes walk {
      0% {
        opacity: 0;
        transform: translate(-50%, 0) rotate(45deg)
      }

      30% {
        opacity: 1
      }

      80% {
        opacity: 0;
        transform: translate(-50%, 42px) rotate(45deg)
      }

      100% {
        opacity: 0
      }
    }

    /* ── 히어로 사진: 연못 프레임 (forest 고유) ── */
    .hero-photo{
      position:relative;
      width:min(420px,88vw);
      aspect-ratio:1/1;
      margin:0 auto 24px;
    }
    /* 이미지 레이어 */
    .hero-photo .pond-img{
      width:100%;
      height:100%;
      border-radius:44% 56% 52% 48% / 46% 44% 56% 54%;
      overflow:hidden;
      position:relative;
      background:linear-gradient(140deg,var(--leaf-light),var(--leaf));
    }
    .hero-photo .pond-img img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    /* 연못 가장자리 페이드 오버레이 */
    .hero-photo::after{
      content:'';
      position:absolute;
      inset:-6%;
      border-radius:50%;
      background:radial-gradient(
        ellipse at center,
        transparent 42%,
        rgba(238,242,224,.55) 58%,
        rgba(220,232,204,.80) 72%,
        var(--canopy-bottom) 86%
      );
      pointer-events:none;
      z-index:2;
    }
    /* ── 나뭇잎 메뉴 버튼 (forest 고유) ── */
    .leaf-menu{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:34px;max-width:430px;margin-left:auto;margin-right:auto}
    .leaf-btn{font-family:var(--body);font-weight:700;font-size:.92rem;color:#fff;text-decoration:none;padding:13px 22px;background:var(--leaf);border-radius:2px 20px 2px 20px;box-shadow:0 8px 18px -8px rgba(74,107,58,.65);transition:transform .2s ease,background .2s ease}
    .leaf-btn:hover{transform:translateY(-2px);background:var(--moss)}

    /* ── 타임라인 시작: 원장 표지판 ── */
    .trail-start {
      padding-top: 30px;
      padding-bottom: 10px;
      text-align: center
    }

    .trail-start .signpost {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      background: var(--paper);
      border-radius: 20px;
      padding: 30px 32px;
      box-shadow: 0 20px 44px -20px rgba(74, 107, 58, .4);
      border: 1px solid rgba(123, 160, 91, .16);
      max-width: 440px
    }

    .trail-start .portrait {
      width: 96px;
      height: 96px;
      border-radius: 48% 52% 50% 50%;
      background: linear-gradient(135deg, var(--leaf-light), var(--leaf));
      overflow: hidden;
      box-shadow: 0 0 0 6px rgba(168, 198, 134, .25)
    }

    .trail-start .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .trail-start .badge {
      font-family: var(--hand);
      font-weight: 700;
      color: var(--moss);
      font-size: 1.1rem
    }

    .trail-start .msg {
      font-family: var(--display);
      font-weight: 400;
      font-size: 1.18rem;
      line-height: 1.8;
      color: var(--ink);
      white-space: pre-line
    }

    .trail-start .sign {
      color: var(--ink-soft);
      font-size: .9rem
    }

    .trail-start .sign strong {
      font-family: var(--display);
      font-weight: 700;
      color: var(--bark);
      margin-left: 4px
    }

    /* ── 핵심: 세로 타임라인 (숲길) ── */
    .timeline {
      position: relative;
      padding-top: 50px;
      padding-bottom: 40px
    }

    .timeline-head {
      text-align: center;
      margin-bottom: 30px
    }

    .timeline-head .eyebrow {
      font-family: var(--hand);
      font-size: 1.25rem;
      color: var(--moss);
      font-weight: 700
    }

    .timeline-head .eyebrow::before {
      content: "🌿 "
    }

    .timeline-head h2 {
      font-family: var(--display);
      font-weight: 700;
      font-size: 2rem;
      color: var(--bark);
      letter-spacing: -.5px;
      margin-top: 4px
    }

    .trail-line {
      position: absolute;
      left: 50%;
      top: 130px;
      bottom: 70px;
      width: 3px;
      transform: translateX(-50%);
      background: repeating-linear-gradient(180deg, var(--leaf) 0 10px, transparent 10px 22px);
      opacity: .4;
      z-index: 0
    }

    .stop {
      position: relative;
      margin: 0 0 54px;
      z-index: 1
    }

    .stop .node {
      position: absolute;
      left: 50%;
      top: 6px;
      transform: translateX(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--paper);
      border: 2.5px solid var(--leaf);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--hand);
      font-weight: 700;
      color: var(--moss);
      font-size: 1.05rem;
      z-index: 3;
      box-shadow: 0 8px 18px -8px rgba(74, 107, 58, .5)
    }

    .stop .card {
      width: calc(50% - 38px);
      background: var(--paper);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 40px -18px rgba(74, 107, 58, .45);
      border: 1px solid rgba(123, 160, 91, .14);
      position: relative
    }

    .stop.left .card {
      margin-right: auto
    }

    .stop.right .card {
      margin-left: auto
    }

    .stop .card::before {
      content: "";
      position: absolute;
      top: 24px;
      width: 30px;
      height: 2px;
      background: var(--leaf);
      opacity: .5;
      z-index: 2
    }

    .stop.left .card::before {
      right: -30px
    }

    .stop.right .card::before {
      left: -30px
    }

    .stop .card .pic {
      aspect-ratio: 4/3;
      overflow: hidden;
      background: var(--leaf-light);
      position: relative
    }

    .stop .card .pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .stop .card .pic .cap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 14px 14px 12px;
      background: linear-gradient(180deg, transparent, rgba(38, 51, 31, .62));
      color: #fff;
      font-family: var(--hand);
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.35
    }

    .stop .card .body {
      padding: 14px 16px 16px
    }

    .stop .card .time {
      font-family: var(--hand);
      font-weight: 700;
      color: var(--moss);
      font-size: 1.02rem
    }

    .stop .card .title {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--bark);
      margin: 2px 0 6px;
      letter-spacing: -.3px;
      line-height: 1.3
    }

    .stop .card .note {
      font-size: .88rem;
      color: var(--ink-soft);
      line-height: 1.55
    }

    .trail-end {
      text-align: center;
      padding: 10px 0 20px;
      position: relative;
      z-index: 1
    }

    .trail-end .glade {
      display: inline-block;
      font-family: var(--hand);
      font-weight: 700;
      color: var(--sun-warm);
      font-size: 1.15rem;
      background: var(--paper);
      padding: 12px 24px;
      border-radius: 30px;
      box-shadow: 0 12px 28px -14px rgba(232, 184, 100, .5)
    }

    .trail-end .glade::before {
      content: "☀️ "
    }

    /* ── 더 둘러보기: 탭 ── */
    .explore {
      padding-top: 60px;
      padding-bottom: 40px
    }

    .explore-head {
      text-align: center;
      margin-bottom: 26px
    }

    .explore-head .eyebrow {
      font-family: var(--hand);
      font-size: 1.2rem;
      color: var(--moss);
      font-weight: 700
    }

    .explore-head h2 {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.85rem;
      color: var(--bark);
      letter-spacing: -.5px;
      margin-top: 4px
    }

    .tab-bar {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 26px
    }

    .tab-btn {
      padding: 9px 18px;
      border-radius: 30px;
      border: 1.5px solid rgba(123, 160, 91, .3);
      background: var(--paper);
      color: var(--ink-soft);
      font-weight: 700;
      font-size: .9rem;
      cursor: pointer;
      font-family: var(--body);
      transition: all .2s
    }

    .tab-btn.active {
      background: var(--moss);
      color: #fff;
      border-color: var(--moss)
    }

    .tab-panel {
      display: none
    }

    .tab-panel.active {
      display: block;
      animation: fadein .5s ease
    }

    @keyframes fadein {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .polaroids {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px
    }

    .polaroid {
      background: var(--paper);
      padding: 9px 9px 13px;
      border-radius: 8px;
      box-shadow: 0 16px 34px -16px rgba(74, 107, 58, .45);
      transition: transform .4s ease, box-shadow .4s ease
    }

    .polaroid .pic {
      border-radius: 5px;
      aspect-ratio: 1/1;
      overflow: hidden;
      background: var(--leaf-light)
    }

    .polaroid .pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .polaroid .label {
      font-family: var(--hand);
      font-weight: 700;
      font-size: 1rem;
      margin-top: 10px;
      color: var(--bark);
      text-align: center
    }

    .polaroid:nth-child(odd) {
      transform: rotate(-2deg)
    }

    .polaroid:nth-child(even) {
      transform: rotate(2deg);
      margin-top: 18px
    }

    .polaroid:hover,
    .polaroid:focus-within {
      transform: rotate(0) scale(1.04);
      box-shadow: 0 24px 44px -16px rgba(74, 107, 58, .5);
      z-index: 2
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 16px
    }

    .flip {
      perspective: 1200px;
      height: 128px
    }

    .flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform .7s cubic-bezier(.4, .2, .2, 1);
      transform-style: preserve-3d;
      cursor: pointer
    }

    .flip.is-static .flip-inner {
      cursor: default
    }

    .flip.flipped .flip-inner {
      transform: rotateY(180deg)
    }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 18px;
      display: flex;
      align-items: center;
      padding: 20px 22px;
      box-shadow: 0 16px 38px -18px rgba(74, 107, 58, .42)
    }

    .front {
      background: var(--paper);
      gap: 18px;
      border-left: 5px solid var(--leaf)
    }

    .front .avatar {
      width: 84px;
      height: 84px;
      border-radius: 46% 54% 50% 50%;
      background: linear-gradient(135deg, var(--leaf-light), var(--leaf));
      flex: none;
      overflow: hidden
    }

    .front .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .front .t-info {
      flex: 1;
      min-width: 0;
      text-align: left
    }

    .front .name {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--bark)
    }

    .front .role {
      color: var(--ink-soft);
      font-size: .88rem;
      margin-top: 2px
    }

    .front .tap {
      font-family: var(--hand);
      color: var(--moss);
      font-size: .92rem;
      margin-top: 7px;
      font-weight: 700
    }

    .back {
      background: linear-gradient(135deg, var(--moss), var(--bark));
      color: var(--paper-warm);
      transform: rotateY(180deg);
      font-family: var(--display);
      font-size: 1.18rem;
      line-height: 1.6;
      justify-content: center;
      text-align: center
    }

    .notice-list {
      list-style: none
    }

    .notice-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--paper);
      border-radius: 16px;
      padding: 15px 18px;
      margin-bottom: 12px;
      box-shadow: 0 12px 28px -18px rgba(74, 107, 58, .4);
      border: 1px solid rgba(123, 160, 91, .12)
    }

    .notice-item .tag {
      flex: none;
      font-size: .74rem;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 30px;
      color: #fff
    }

    .tag-event {
      background: var(--leaf)
    }

    .tag-info {
      background: var(--sun-warm)
    }

    .tag-must {
      background: var(--soil)
    }

    .notice-item .n-title {
      font-weight: 600;
      font-size: 1rem;
      line-height: 1.4
    }

    .notice-item .n-date {
      color: var(--ink-soft);
      font-size: .82rem;
      margin-top: 3px
    }

    .more-link {
      display: inline-block;
      margin-top: 8px;
      color: var(--moss);
      font-weight: 700;
      text-decoration: none;
      font-size: .92rem
    }

    .cal {
      background: var(--paper);
      border-radius: 22px;
      padding: 22px 20px;
      box-shadow: 0 18px 44px -22px rgba(74, 107, 58, .4);
      border: 1px solid rgba(123, 160, 91, .12)
    }

    .cal-head {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.25rem;
      margin-bottom: 14px;
      color: var(--bark)
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px
    }

    .cal-grid .dow {
      font-size: .78rem;
      color: var(--ink-soft);
      padding: 6px 0;
      font-weight: 600
    }

    .cal-grid .dow:first-child {
      color: var(--soil)
    }

    .day-cell {
      position: relative;
      padding: 10px 0;
      font-size: .9rem;
      border-radius: 10px;
      text-align: center
    }

    .day-cell.muted {
      color: #cdd4c2
    }

    .day-cell.ev {
      background: #EDF3E2;
      color: var(--moss);
      font-weight: 700
    }

    .day-cell.ev::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 5px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--leaf);
      transform: translateX(-50%)
    }

    .event-list {
      list-style: none;
      margin-top: 18px
    }

    .event-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 4px;
      border-bottom: 1px solid var(--paper-warm);
      font-size: .95rem
    }

    .event-list li:last-child {
      border-bottom: none
    }

    .event-list .e-date {
      font-weight: 700;
      color: var(--moss);
      font-size: .86rem;
      min-width: 46px
    }

    .faq-item {
      background: var(--paper);
      border-radius: 16px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 12px 28px -20px rgba(74, 107, 58, .4);
      border: 1px solid rgba(123, 160, 91, .12)
    }

    .faq-q {
      width: 100%;
      border: none;
      background: transparent;
      text-align: left;
      padding: 17px 20px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-family: var(--body)
    }

    .faq-q .chev {
      flex: none;
      width: 11px;
      height: 11px;
      border-right: 2.5px solid var(--leaf);
      border-bottom: 2.5px solid var(--leaf);
      transform: rotate(45deg);
      transition: transform .35s ease;
      margin-top: -4px
    }

    .faq-item.open .faq-q .chev {
      transform: rotate(-135deg);
      margin-top: 2px
    }

    .faq-a {
      max-height: 0;
      overflow: hidden;
      transition: max-height .4s ease
    }

    .faq-a p {
      padding: 0 20px 18px;
      color: var(--ink-soft);
      font-size: .94rem;
      line-height: 1.7
    }

    /* ── 마무리 ── */
    .finale {
      padding-top: 80px;
      padding-bottom: 150px;
      text-align: center
    }

    .finale h2 {
      font-family: var(--display);
      font-weight: 700;
      font-size: 2.1rem;
      line-height: 1.4;
      letter-spacing: -.5px;
      color: var(--bark)
    }

    .finale p {
      color: var(--ink-soft);
      margin: 18px 0 36px;
      font-size: 1rem
    }

    .btn-big {
      display: inline-block;
      background: var(--moss);
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 18px 46px;
      border-radius: 8px 30px 30px 30px;
      text-decoration: none;
      box-shadow: 0 16px 34px -10px rgba(74, 107, 58, .6);
      transition: transform .3s ease, box-shadow .3s ease;
      border: none;
      cursor: pointer;
      font-family: var(--body)
    }

    .btn-big:hover {
      transform: translateY(-3px);
      box-shadow: 0 22px 40px -10px rgba(74, 107, 58, .7)
    }

    /* ── 플로팅 CTA ── */
    .float {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(120px);
      z-index: 30;
      transition: transform .5s cubic-bezier(.22, .9, .3, 1)
    }

    .float.show {
      transform: translateX(-50%) translateY(0)
    }

    .float.hide {
      transform: translateX(-50%) translateY(120px)
    }

    .float a {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bark);
      color: var(--paper-warm);
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 30px;
      text-decoration: none;
      box-shadow: 0 12px 30px -8px rgba(38, 51, 31, .5);
      font-size: .98rem
    }

    .float a .pulse {
      width: 9px;
      height: 9px;
      border-radius: 0 50% 50% 50%;
      background: var(--leaf);
      transform: rotate(45deg);
      animation: leafpulse 1.8s infinite
    }

    @keyframes leafpulse {

      0%,
      100% {
        transform: rotate(45deg) scale(1)
      }

      50% {
        transform: rotate(45deg) scale(1.3)
      }
    }

    /* ── 모달 ── */
    .csl-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(38, 51, 31, .5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px
    }

    .csl-overlay.open {
      display: flex
    }

    .csl-panel {
      position: relative;
      width: 100%;
      max-width: 390px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--paper);
      border-radius: 24px;
      padding: 32px 28px;
      box-shadow: 0 30px 60px -20px rgba(38, 51, 31, .55)
    }

    .csl-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 34px;
      height: 34px;
      border: none;
      background: var(--paper-warm);
      border-radius: 50%;
      font-size: 1.2rem;
      line-height: 1;
      color: var(--ink-soft);
      cursor: pointer
    }

    .csl-title {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.4rem;
      margin-bottom: 22px;
      letter-spacing: -.5px;
      color: var(--bark)
    }

    .csl-field {
      margin-bottom: 16px;
      text-align: left
    }

    .csl-field label {
      display: block;
      font-size: .85rem;
      font-weight: 700;
      color: var(--ink-soft);
      margin-bottom: 6px
    }

    .csl-field input[type=text],
    .csl-field input[type=tel],
    .csl-field select {
      width: 100%;
      border: 1.5px solid rgba(123, 160, 91, .3);
      border-radius: 14px;
      padding: 12px 14px;
      font-family: var(--body);
      font-size: .96rem;
      color: var(--ink);
      background: var(--paper-warm);
      outline: none;
    }

    .csl-field input:focus,
    .csl-field select:focus {
      border-color: var(--leaf)
    }

    .csl-consent label {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: .85rem;
      font-weight: 400;
      color: var(--ink-soft);
      line-height: 1.5
    }

    .csl-consent input {
      margin-top: 3px;
      flex: none
    }

    .csl-submit {
      width: 100%;
      margin-top: 6px
    }

    .csl-msg.error {
      margin-top: 12px;
      font-size: .85rem;
      color: #C0392B;
      text-align: center
    }

    .csl-done {
      text-align: center;
      font-family: var(--display);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--bark);
      padding: 30px 0;
      line-height: 1.7
    }

    footer {
      text-align: center;
      padding: 34px 22px 44px;
      color: var(--ink-soft);
      font-size: .82rem
    }

    footer .demo-tag {
      display: inline-block;
      background: var(--paper);
      border: 1px solid rgba(123, 160, 91, .2);
      border-radius: 30px;
      padding: 6px 16px;
      margin-bottom: 14px;
      font-family: var(--hand);
      font-weight: 700;
      color: var(--moss)
    }

    a:focus-visible,
    .flip-inner:focus-visible,
    .tab-btn:focus-visible {
      outline: 3px solid var(--leaf);
      outline-offset: 3px;
      border-radius: 8px
    }

    @media (max-width:480px) {
      .trail-line {
        left: 28px
      }

      .stop .node {
        left: 28px;
        transform: none;
        width: 42px;
        height: 42px
      }

      .stop .card {
        width: calc(100% - 70px) !important;
        margin-left: auto !important;
        margin-right: 0 !important
      }

      .stop.left .card::before,
      .stop.right .card::before {
        left: -30px !important;
        right: auto !important;
        top: 24px
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important
      }

      .reveal {
        opacity: 1;
        transform: none
      }

      .leaf-float {
        display: none
      }
    }
    .preview-banner{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:55;background:rgba(34,50,39,.94);color:#fff;border-radius:999px;padding:9px 16px;font-size:.84rem;font-weight:800;box-shadow:0 14px 34px -18px rgba(22,44,26,.5)}
    .preview-banner[hidden]{display:none}
  </style>
</head>

    .director-modal-photo{width:120px;height:120px;border-radius:50%;margin:0 auto 24px;overflow:hidden;box-shadow:0 0 0 7px rgba(255,255,255,.5),0 16px 34px -14px rgba(47,61,42,.3)}
    .director-modal-photo img{width:100%;height:100%;object-fit:cover;display:block}
    .info-modal-greeting{font-size:1rem;color:var(--ink-soft);line-height:1.9;white-space:pre-line;margin-bottom:24px;text-align:center}
    .info-modal-motto{font-family:var(--display);font-size:1.2rem;color:var(--ink);text-align:center;padding:16px;background:var(--paper-warm);border-radius:14px}
    .info-modal-values{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
    .info-modal-value{font-size:.9rem;font-weight:700;color:#fff;background:var(--moss);padding:8px 20px;border-radius:30px}

    /* ── 원 시설 (배지 + 썸네일 + 모달) ── */
    .facilities{padding-top:70px;padding-bottom:40px}
    .fac-badges{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0 28px}
    .fac-badge{font-size:.88rem;font-weight:700;color:var(--moss);background:var(--paper);padding:8px 16px;border-radius:30px;box-shadow:0 6px 16px -8px rgba(47,61,42,.25)}
    .fac-thumb-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
    .fac-thumb{border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:var(--paper-warm)}
    .fac-thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .fac-more-btn{display:block;width:100%;padding:14px;background:none;border:1.5px solid var(--moss);border-radius:14px;color:var(--moss);font-weight:700;font-size:.95rem;cursor:pointer;font-family:var(--body);margin-top:4px}
    .info-modal-prog-intro{font-size:.96rem;color:var(--ink-soft);line-height:1.75;margin-bottom:22px}
    .fac-modal-list{display:flex;flex-direction:column;gap:18px}
    .fac-modal-item{background:var(--paper-warm);border-radius:16px;overflow:hidden}
    .fac-modal-item .fm-img{aspect-ratio:16/9;overflow:hidden;background:var(--paper)}
    .fac-modal-item .fm-img img{width:100%;height:100%;object-fit:cover;display:block}
    .fac-modal-item .fm-body{padding:16px 18px}
    .fac-modal-item .fm-name{font-weight:700;font-size:1.05rem;color:var(--ink);margin-bottom:5px}
    .fac-modal-item .fm-desc{font-size:.9rem;color:var(--ink-soft);line-height:1.6}

    /* ── 교육프로그램 (이미지 카드 + 모달) ── */
    .programs{padding-top:70px;padding-bottom:40px}
    .prog-card{background:var(--paper);border-radius:18px;overflow:hidden;box-shadow:0 16px 36px -18px rgba(47,61,42,.3);margin-bottom:14px}
    .prog-card .prog-img{aspect-ratio:16/9;overflow:hidden;background:var(--paper-warm)}
    .prog-card .prog-img img{width:100%;height:100%;object-fit:cover;display:block}
    .prog-card .prog-body{padding:18px 18px 20px}
    .prog-card .prog-name{font-weight:700;font-size:1.05rem;color:var(--ink);margin-bottom:6px}
    .prog-card .prog-desc{font-size:.9rem;color:var(--ink-soft);line-height:1.65}
    .prog-more-btn{display:block;width:100%;padding:14px;background:none;border:1.5px solid var(--moss);border-radius:14px;color:var(--moss);font-weight:700;font-size:.95rem;cursor:pointer;font-family:var(--body);margin-top:4px}
    .prog-modal-item{background:var(--paper-warm);border-radius:16px;overflow:hidden;margin-bottom:18px}
    .prog-modal-item .pm-img{aspect-ratio:16/9;overflow:hidden;background:var(--paper)}
    .prog-modal-item .pm-img img{width:100%;height:100%;object-fit:cover;display:block}
    .prog-modal-item .pm-body{padding:16px 18px}
    .prog-modal-item .pm-name{font-weight:700;font-size:1.05rem;color:var(--ink);margin-bottom:5px}
    .prog-modal-item .pm-desc{font-size:.9rem;color:var(--ink-soft);line-height:1.6}

    /* ── 라이트박스 ── */
    .lightbox-overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:20px}
    .lightbox-overlay.open{display:flex}
    .lightbox-img{max-width:min(680px,92vw);max-height:82vh;object-fit:contain;border-radius:8px;display:block}
    .lightbox-close{position:absolute;top:18px;right:18px;width:40px;height:40px;border:none;background:rgba(255,255,255,.15);border-radius:50%;font-size:1.5rem;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .lightbox-cap{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:min(88vw,680px);color:rgba(255,255,255,.85);font-size:.92rem;white-space:normal;text-align:center;overflow-wrap:anywhere}

    /* ── 숲속 산책 안내서: 반응형 정보 레이아웃 ── */
    :root{
      --pine:#20382c;
      --pine-soft:#31523e;
      --moss:#56734a;
      --leaf:#769365;
      --leaf-light:#b8c9a7;
      --cream:#f7f3e8;
      --cream-deep:#eee7d6;
      --earth:#81684f;
      --line:rgba(49,82,62,.15);
      --shadow:0 22px 55px -36px rgba(32,56,44,.45);
      --forest-content-max:1320px;
      --forest-focus-max:1060px;
      --forest-page-gutter:clamp(20px,2.6vw,36px);
    }
    body{background:var(--cream);color:var(--pine)}
    .forest-bg{background:linear-gradient(180deg,#dfe9d5 0%,#f7f3e8 45%,#e9eddf 100%)}
    .light-rays{opacity:.5}
    .wrap{width:min(100%,var(--forest-content-max));max-width:var(--forest-content-max);padding-left:var(--forest-page-gutter);padding-right:var(--forest-page-gutter)}
    #topbar > .wrap{width:min(100%,var(--forest-content-max));max-width:var(--forest-content-max);padding-left:var(--forest-page-gutter);padding-right:var(--forest-page-gutter)}
    [hidden]{display:none!important}
    .load-error{max-width:680px;margin:120px auto 40px;padding:28px 30px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-family:var(--body);color:var(--pine);text-align:center}
    .reveal{transform:translateY(16px);transition:opacity .55s ease,transform .55s ease}

    .hero{
      min-height:auto;
      padding-top:clamp(88px,7vw,108px);
      padding-bottom:clamp(52px,5vw,72px);
      display:block;
      text-align:left;
      position:relative;
    }
    .hero::before{
      content:"";position:absolute;left:var(--forest-page-gutter);right:var(--forest-page-gutter);bottom:0;height:1px;
      background:linear-gradient(90deg,transparent,rgba(49,82,62,.22) 18%,rgba(86,115,74,.34) 50%,rgba(49,82,62,.22) 82%,transparent)
    }
    #previewBanner:not([hidden]) ~ .hero{padding-top:clamp(108px,8vw,120px)}
    .preview-banner{position:absolute;top:68px;padding:7px 14px;font-size:.8rem;z-index:12}
    #topbar .topbar-actions{gap:12px}
    #topbar .preview-banner{
      position:static;transform:none;max-width:160px;margin:0;padding:5px 10px;
      border:1px solid rgba(255,255,255,.16);box-shadow:none;
      font-size:.7rem;line-height:1.25;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
    }
    .hero-shell{
      display:grid;
      grid-template-columns:minmax(0,.9fr) minmax(480px,1.1fr);
      align-items:center;
      gap:clamp(44px,5vw,74px);
    }
    .hero-copy{position:relative;z-index:3;max-width:600px}
    .hero-kicker{
      display:inline-flex;
      align-items:center;
      gap:9px;
      color:var(--moss);
      font-size:.82rem;
      font-weight:800;
      letter-spacing:.13em;
      text-transform:uppercase;
      margin-bottom:16px;
    }
    .hero-kicker::before{
      content:"";
      width:28px;
      height:1px;
      background:var(--moss);
    }
    .hero-center-name{
      display:block;
      font-family:var(--display);
      font-size:clamp(1rem,1.4vw,1.2rem);
      color:var(--earth);
      margin-bottom:10px;
    }
    .hero h1{font-size:clamp(2.15rem,3.15vw,3.25rem);line-height:1.22;letter-spacing:-.035em}
    .hero h1,.hero-center-name{overflow-wrap:anywhere}
    .hero h1 .glow::after{bottom:.08em;height:.28em;border-radius:2px;opacity:.42}
    .hero p{max-width:520px;margin-top:18px;font-size:clamp(.98rem,1.3vw,1.08rem);line-height:1.82}
    .hero-photo{
      order:2;
      width:100%;
      max-width:690px;
      aspect-ratio:1.16/1;
      margin:0;
      justify-self:end;
    }
    .hero-photo .pond-img{
      border-radius:43% 57% 49% 51% / 47% 43% 57% 53%;
      background:
        radial-gradient(circle at 26% 27%,rgba(255,255,255,.38) 0 7%,transparent 8%),
        repeating-radial-gradient(ellipse at 70% 72%,rgba(255,255,255,.12) 0 2px,transparent 3px 24px),
        linear-gradient(145deg,#b7caa7,#6f916b 56%,#476c52);
      box-shadow:0 36px 80px -44px rgba(32,56,44,.65);
    }
    .hero-photo::after{
      inset:-4%;
      background:radial-gradient(ellipse at center,transparent 58%,rgba(223,233,213,.5) 70%,var(--cream) 88%);
    }
    .hero-no-photo .hero-shell{grid-template-columns:minmax(0,760px);justify-content:center}
    .hero-no-photo .hero-copy{max-width:760px;text-align:center}
    .hero-no-photo .hero-kicker{justify-content:center}
    .leaf-menu{justify-content:flex-start;max-width:620px;margin:28px 0 0;gap:10px}
    .hero-no-photo .leaf-menu{justify-content:center;margin-left:auto;margin-right:auto}
    .leaf-btn{
      padding:12px 18px;
      border:1px solid rgba(49,82,62,.2);
      border-radius:6px 18px 6px 18px;
      color:var(--pine);
      background:rgba(255,255,255,.66);
      box-shadow:none;
    }
    .leaf-btn:hover{color:#fff}
    .hero .enter-cue{align-items:flex-start;margin-top:28px;gap:8px}
    .hero-no-photo .enter-cue{align-items:center}
    .hero .enter-cue .path{height:34px}

    .trail-start,.overview,.timeline,.facilities,.explore,.programs,.info-block{
      padding-top:clamp(52px,6.6vw,82px);
      padding-bottom:clamp(34px,5vw,64px);
    }
    .section-head,.explore-head,.timeline-head{
      text-align:left;
      margin-bottom:clamp(24px,3vw,34px);
      display:grid;
      grid-template-columns:minmax(160px,.32fr) minmax(0,.68fr);
      align-items:end;
      gap:24px;
      border-bottom:1px solid var(--line);
      padding-bottom:18px;
    }
    .section-head .eyebrow,.explore-head .eyebrow,.timeline-head .eyebrow{
      font-family:var(--body);
      font-size:.8rem;
      line-height:1.4;
      color:var(--moss);
      font-weight:800;
      letter-spacing:.12em;
    }
    .section-head h2,.explore-head h2,.timeline-head h2{
      font-family:var(--display);
      font-size:clamp(1.85rem,3vw,2.55rem);
      line-height:1.25;
      color:var(--pine);
      letter-spacing:-.04em;
      margin:0;
    }
    .timeline-head .eyebrow::before{content:""}
    .section-intro,.fac-intro,.prog-intro{
      max-width:760px;
      margin:-13px 0 27px;
      color:var(--ink-soft);
      font-size:1rem;
      line-height:1.8;
    }

    .trail-start{text-align:left}
    #greeting{max-width:var(--forest-focus-max)}
    .trail-start .signpost{
      width:100%;
      max-width:none;
      display:grid;
      grid-template-columns:minmax(160px,200px) minmax(0,620px);
      justify-content:center;
      align-items:center;
      gap:clamp(16px,2.2vw,28px);
      padding:clamp(26px,3.2vw,40px);
      overflow:visible;
      border-radius:0;
      background:transparent;
      box-shadow:none;
      border:0;
      position:relative;
      isolation:isolate;
    }
    .trail-start .signpost::before{
      content:"";position:absolute;inset:0;z-index:-1;
      background:
        radial-gradient(ellipse at 86% 16%,rgba(184,201,167,.16) 0 13%,transparent 14%),
        linear-gradient(142deg,rgba(250,248,237,.96),rgba(229,231,211,.94));
      border-radius:47% 53% 41% 59% / 59% 38% 62% 41%;
      transform:rotate(-.28deg);
      box-shadow:0 28px 58px -46px rgba(32,56,44,.58),inset 0 0 0 1px rgba(49,82,62,.1)
    }
    .trail-start .signpost.no-photo{grid-template-columns:1fr}
    .director-photo{
      width:min(100%,200px);
      min-height:0;
      aspect-ratio:4/5;
      justify-self:center;
      align-self:center;
      overflow:hidden;
      background:var(--cream-deep);
      border-radius:44% 56% 47% 53% / 55% 43% 57% 45%;
      margin:0;
      position:relative;
      z-index:2;
      box-shadow:0 28px 58px -38px rgba(32,56,44,.64);
    }
    .director-photo img{width:100%;height:100%;object-fit:cover;display:block}
    .director-copy{
      width:100%;
      max-width:620px;
      padding:clamp(14px,1.8vw,24px) clamp(10px,1.5vw,20px);
      display:flex;
      flex-direction:column;
      justify-content:center;
      min-width:0;
      position:relative;
      isolation:auto;
    }
    .director-copy::before{display:none}
    .trail-start .signpost.no-photo .director-copy{max-width:880px;margin:0 auto;padding:24px 12px;width:100%}
    .trail-start .badge{
      align-self:flex-start;
      padding:8px 14px;
      border-radius:4px 14px 4px 14px;
      color:#fff;
      background:var(--earth);
      font-family:var(--body);
      font-size:.8rem;
      letter-spacing:.08em;
    }
    .trail-start .msg{margin-top:16px;font-size:clamp(1.08rem,1.8vw,1.3rem);line-height:1.9}
    .director-message.is-collapsed{display:-webkit-box;max-height:none;overflow:hidden;position:relative;-webkit-box-orient:vertical;-webkit-line-clamp:4}
    .director-message.is-collapsed::after{display:none}
    .director-expand{
      align-self:flex-start;
      min-height:44px;
      margin-top:18px;
      padding:10px 15px;
      border:0;
      border-radius:5px 18px 5px 18px;
      background:rgba(86,115,74,.12);
      color:var(--moss);
      font:700 .92rem var(--body);
      cursor:pointer;
    }
    .director-expand:hover{background:rgba(86,115,74,.19);color:var(--pine)}
    .director-expand::after{content:"";display:inline-block;width:7px;height:7px;margin-left:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg) translateY(-1px)}
    .director-greeting-overlay{
      position:fixed;inset:0;z-index:76;display:none;align-items:center;justify-content:center;
      padding:clamp(18px,4vw,42px);background:rgba(20,39,29,.68);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)
    }
    .director-greeting-overlay.open{display:flex}
    .director-greeting-panel{
      position:relative;width:min(100%,680px);max-height:min(86vh,760px);
      overflow:hidden;background:linear-gradient(145deg,#fbf8ed,#e9ead8);
      border-radius:44px 68px 38px 58px / 52px 40px 64px 46px;
      box-shadow:0 32px 70px -38px rgba(20,39,29,.72),inset 0 0 0 1px rgba(49,82,62,.12)
    }
    .director-greeting-scroll{max-height:min(86vh,760px);overflow-y:auto;padding:clamp(34px,6vw,58px)}
    .director-greeting-close{
      position:absolute;top:18px;right:20px;z-index:2;width:40px;height:40px;
      display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;
      background:rgba(49,82,62,.1);color:var(--pine);font:400 1.45rem/1 var(--body);cursor:pointer
    }
    .director-greeting-kicker{text-align:center;color:var(--moss);font-size:.76rem;font-weight:800;letter-spacing:.12em}
    .director-greeting-title{margin:6px 42px 24px;text-align:center;color:var(--pine);font:700 clamp(1.55rem,3vw,2rem)/1.35 var(--display)}
    .director-greeting-photo{width:104px;aspect-ratio:1;margin:0 auto 22px;overflow:hidden;border-radius:41% 59% 47% 53% / 60% 42% 58% 40%;box-shadow:0 14px 28px -22px rgba(32,56,44,.55)}
    .director-greeting-photo img{width:100%;height:100%;object-fit:cover;display:block}
    .director-greeting-full{color:var(--ink-soft);font-size:1rem;line-height:1.9;overflow-wrap:anywhere}
    .director-greeting-sign{margin-top:24px;text-align:right;color:var(--pine);font-weight:700}
    .director-greeting-motto{margin-top:20px;text-align:center;color:var(--pine-soft);font:700 1.05rem/1.7 var(--display)}
    .director-greeting-values{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:12px}
    .director-greeting-value{padding:6px 11px;background:rgba(118,147,101,.14);border-radius:5px 14px 5px 14px;color:var(--pine-soft);font-size:.8rem;font-weight:700}
    .trail-start .sign{margin-top:18px}
    .philosophy-note{margin-top:18px;padding-top:0;border-top:0}
    .philosophy-motto{font-family:var(--display);font-size:1.05rem;line-height:1.7;color:var(--pine)}
    .philosophy-values{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
    .philosophy-value{padding:7px 12px;border-radius:5px 14px 5px 14px;background:var(--cream-deep);color:var(--pine-soft);font-size:.82rem;font-weight:700}
    #greeting .section-head,#teachersSec .section-head{border-bottom:0;padding-bottom:0;margin-bottom:clamp(28px,3vw,36px)}

    .overview-card{position:relative;isolation:isolate;padding:clamp(34px,5vw,54px);border:0;border-radius:0;box-shadow:none;background:transparent}
    .overview-card::before{
      content:"";position:absolute;inset:-10px -18px -14px;z-index:-1;
      background:linear-gradient(145deg,#fbfaf2,#eee8d8);
      border-radius:48% 52% 44% 56% / 58% 43% 57% 42%;
      transform:rotate(.35deg);
      box-shadow:0 30px 64px -48px rgba(32,56,44,.55),inset 0 0 0 1px rgba(49,82,62,.1)
    }
    .overview-title,.overview-sub{text-align:left}
    .overview-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;border-radius:0;background:transparent;overflow:visible}
    .overview-item{position:relative;padding:20px 16px;background:transparent;border-bottom:1px solid rgba(49,82,62,.14)}
    .overview-item::before{display:none}
    .overview-address{position:relative;isolation:isolate;border-radius:0;background:transparent;padding:18px 22px}
    .overview-address::before{content:"";position:absolute;inset:0 -5px;z-index:-1;background:rgba(238,231,214,.72);border-radius:58% 42% 52% 48% / 43% 61% 39% 57%;transform:rotate(-.25deg)}

    .timeline{max-width:var(--forest-focus-max);overflow:visible}
    .trail-line{top:190px;bottom:108px;width:2px}
    .stop{margin-bottom:48px}
    .stop .node{width:44px;height:44px;top:18px;background:var(--cream);border-width:2px}
    .stop .card{
      width:calc(50% - 54px);display:grid;grid-template-columns:minmax(145px,.43fr) minmax(0,.57fr);
      align-items:center;overflow:visible;border:0;border-radius:0;box-shadow:none;background:transparent;isolation:isolate
    }

    .stop .card .pic{
      aspect-ratio:auto;min-height:220px;z-index:2;
      background:var(--cream-deep);
      border-radius:42% 58% 48% 52% / 57% 39% 61% 43%;
      box-shadow:0 24px 48px -34px rgba(32,56,44,.68)
    }
    .stop.right .card .pic{border-radius:59% 41% 54% 46% / 42% 58% 45% 55%}
    .stop .card .body{
      position:relative;z-index:1;
      min-width:0;margin:0;padding:22px 8px 22px 26px;
      display:flex;flex-direction:column;justify-content:center
    }
    .stop .card .body::before{display:none}
    .stop.left .card .body{text-align:right;align-items:flex-end}
    .stop.right .card .body{order:-1;margin:0;padding:22px 26px 22px 8px;text-align:left;align-items:flex-start}
    .stop .card.no-photo .body{max-width:390px;padding:24px 8px}
    .stop.left .card.no-photo .body{margin-left:auto}
    .stop.right .card.no-photo .body{margin-right:auto}
    .stop .card .time{font-family:var(--body);font-size:.8rem;letter-spacing:.1em}
    .stop .card .title{font-size:1.25rem;margin:8px 0 10px}
    .stop .card .note{font-size:.92rem;line-height:1.7}
    .stop .card .pic .cap{display:none;background:none}
    .day-caption{margin-top:8px;color:var(--earth);font-size:.91rem;line-height:1.65;overflow-wrap:anywhere}
    .trail-end .glade{border-radius:6px 18px 6px 18px}

    .facility-grid,.teacher-grid,.program-grid{display:grid;gap:22px}
    .facility-grid,.program-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .teacher-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .facility-card,.teacher-card-view,.prog-card{
      min-width:0;background:transparent;border:0;border-radius:0;overflow:visible;box-shadow:none
    }
    .facility-card,.prog-card{display:flex;flex-direction:column;margin:0;position:relative;isolation:isolate}

  <script>
    // 모든 렌더 함수(async IIFE, initInteractions 등)가 공유하는 escape 헬퍼.
    // 최상단 스크립트 스코프에 둬야 initInteractions처럼 async IIFE 바깥에서 정의된
    // 함수에서도 클로저로 접근할 수 있다.
    const esc = (s) => {
      if (s == null) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    };

    function escWithBr(text){
      var normalized = (text || '').replace(/<br\s*\/?>/gi, '\n');
      return esc(normalized).replace(/\n/g, '<br>');
    }

    function hasVisibleText(value){
      return String(value ?? '').trim().length > 0;
    }

    function cleanText(value){
      return String(value ?? '').trim();
    }

    function cleanItems(items, fields){
      return (Array.isArray(items) ? items : []).filter(function(item){
        return item && fields.some(function(field){ return hasVisibleText(item[field]); });
      });
    }

    function directionItems(text){
      return cleanText(text).split(/\r?\n|\/+/).map(function(value){
        const raw = cleanText(value);
        if (!raw) return null;
        let type = 'general';
        let label = '오시는 길 안내';
        if (/\[주차\]|주차/.test(raw)) {
          type = 'parking';
          label = '주차 안내';
        } else if (/\[통학차량\]|통학차량|셔틀/.test(raw)) {
          type = 'school-bus';
          label = '통학차량 안내';
        } else if (/\[대중교통\]|지하철|버스|도보/.test(raw)) {
          type = 'transit';
          label = '대중교통 안내';
        }
        return {
          type: type,
          label: label,
          text: raw.replace(/^\s*\[[^\]]+\]\s*/, '').trim()
        };
      }).filter(function(item){ return item && hasVisibleText(item.text); });
    }

    function safeBusColor(value){
      return /^#[0-9a-f]{6}$/i.test(cleanText(value)) ? cleanText(value) : '#769365';
    }

    function busTime(value){
      const time = cleanText(value);
      return time ? time.slice(0, 5) : '';
    }

    async function loadBusRouteData(client, centerId, isTemplatePreview){
      if (isTemplatePreview || !hasVisibleText(centerId)) return [];
      const routeRes = await client.from('bus_routes')
        .select('id,center_id,route_name,route_color,sort,created_at')
        .eq('center_id', centerId)
        .order('sort', { ascending:true })
        .order('created_at', { ascending:true });
      if (routeRes.error || !routeRes.data || !routeRes.data.length) return [];
      const routes = routeRes.data;
      const stopRes = await client.from('bus_stops')
        .select('id,route_id,stop_name,pickup_time,dropoff_time,sort,created_at')
        .in('route_id', routes.map(function(route){ return route.id; }))
        .order('sort', { ascending:true })
        .order('created_at', { ascending:true });
      if (stopRes.error) return [];
      const stopsByRoute = {};
      (stopRes.data || []).forEach(function(stop){
        if (!stopsByRoute[stop.route_id]) stopsByRoute[stop.route_id] = [];
        stopsByRoute[stop.route_id].push(stop);
      });
      return routes.map(function(route){
        return {
          name: route.route_name,
          color: route.route_color,
          stops: (stopsByRoute[route.id] || []).filter(function(stop){
            return hasVisibleText(stop.stop_name) || hasVisibleText(stop.pickup_time) || hasVisibleText(stop.dropoff_time);
          })
        };
      }).filter(function(route){ return route.stops.length > 0; });
    }

    function heroTitleHtml(title, accent, accentClass){
      var titleHtml = escWithBr(title);
      var accentHtml = escWithBr(accent);
      if (!accentHtml) return titleHtml;
      var hasBreak = /<br\s*\/?>|\r?\n/i.test(title || '') || /^\s*(?:<br\s*\/?>|\r?\n)/i.test(accent || '');
      var joiner = hasBreak ? '' : (accentClass ? '<br>' : ' ');
      var cls = accentClass ? ' class="' + accentClass + '"' : '';
      return titleHtml + joiner + '<span' + cls + '>' + accentHtml + '</span>';
    }

    function mapRowToData(row, options = {}) {
      const { allowTeacherSampleFallback = false } = options;
      const media = row.center_media || [];
      const byType = (type) => {
        const seen = new Set();
        return media
          .filter(m => m.media_type === type)
          .sort((a, b) => a.sort_order - b.sort_order)
          .filter(m => { // DB에 중복 sort_order 행이 들어간 경우 방어 (같은 사진이 2번 보이는 문제)
            if (seen.has(m.sort_order)) return false;
            seen.add(m.sort_order);
            return true;
          });
      };
      const teacherFallbacks = [
        { name: '김햇살 선생님', role: '만 3세 햇살반 담임', message: '"아이의 속도에<br>맞춰 기다려 줄게요."' },
        { name: '이초록 선생님', role: '만 4세 새싹반 담임', message: '"매일의 작은 성장을<br>놓치지 않을게요."' },
        { name: '박노을 선생님', role: '만 5세 열매반 담임', message: '"마음껏 궁금해하는<br>아이로 도울게요."' }
      ];
      const teacherItems = byType('teacher').map((m, i) => {
        const fallback = teacherFallbacks[i % teacherFallbacks.length];
        return {
          name: allowTeacherSampleFallback ? (m.title || fallback.name) : (m.title ?? ''),
          role: allowTeacherSampleFallback ? (m.subtitle || fallback.role) : (m.subtitle ?? ''),
          photo: m.photo_url,
          message: allowTeacherSampleFallback ? (m.caption || fallback.message) : (m.caption ?? '')
        };
      });
      return {
        heroPhoto: (byType('hero')[0] || {}).photo_url || null,
        center: {
          id: row.id, slug: row.slug, name: row.name, theme: row.theme, status: row.status,
          address: row.address, directions_text: row.directions_text,
          menu: row.menu || [],
          hero: row.hero || { eyebrow:'', title:'', title_accent:'', subtitle:'' },
          director: row.director || { badge:'', photo:'', photo_alt:'', message:'', sign_label:'', sign_name:'', scroll_cue:'' },
          philosophy: row.philosophy || null,
          programs: row.programs || null,
          facilities: row.facilities || null
        },
        day_story: byType('day_story').map(m => ({ slot: m.slot, time: m.time_label, title: m.title, photo: m.photo_url, photo_alt: m.photo_alt, caption: m.caption, note: m.note })),
        teachers: { items: teacherItems },
        notices: row.notices || { eyebrow:'', title:'', items:[], more:'' },
        schedule: row.schedule || { eyebrow:'', title:'', month_label:'', days_in_month:30, event_days:[], trailing_muted:0, events:[] },
        faqs: row.faqs || { eyebrow:'', title:'', items:[] },
        finale: row.finale || null,
        admission: (row.admissions || [])[0] || null,
        footer: row.footer || null
      };
    }

    (async function () {
      let data;
      const cfg = window.__SUPABASE_CONFIG__;
      const client = supabase.createClient(cfg.url, cfg.anonKey);
      let isPreviewMode = false;
      let isReviewMode = false;
      let previewTemplateId = '';
      const PREVIEW_TEMPLATE_IDS = ['sunshine', 'carnival', 'forest', 'gallery'];
      const PREVIEW_MESSAGE = '이것은 템플릿 미리보기입니다. 실제 신청은 접수되지 않습니다.';

      const REVIEW_MESSAGE = '공개 전 검수용 화면에서는 신청이 접수되지 않습니다.';

      function normalizePreviewId(value){
        return PREVIEW_TEMPLATE_IDS.includes(value) ? value : '';
      }

      function publicTemplateUrl(path){
        const value = String(path || '').trim();
        if (!value || /^(?:https?:\/\/|data:|blob:)/i.test(value)) return value;
        const res = client.storage.from('template-previews').getPublicUrl(value);
        return res && res.data && res.data.publicUrl ? res.data.publicUrl : value;
      }

      function resolveTemplateAssets(row){
        if (Array.isArray(row.center_media)){
          row.center_media = row.center_media.map(function(m){
            if (!m || !m.photo_url) return m;
            return Object.assign({}, m, { photo_url: publicTemplateUrl(m.photo_url) });
          });
        }
        if (row.director && row.director.photo){
          row.director = Object.assign({}, row.director, { photo: publicTemplateUrl(row.director.photo) });
        }
        ['facilities', 'programs'].forEach(function(key){
          if (!row[key] || !Array.isArray(row[key].items)) return;
          row[key] = Object.assign({}, row[key], {
            items: row[key].items.map(function(item){
              if (!item || !item.photo_url) return item;
              return Object.assign({}, item, { photo_url: publicTemplateUrl(item.photo_url) });
            })
          });
        });
        return row;
      }

      async function loadTemplatePreview(templateId){
        const centerRes = await client.from('template_centers').select('*').eq('template_id', templateId).single();
        if (centerRes.error) throw centerRes.error;
        const row = centerRes.data;
        const mediaRes = await client.from('template_center_media').select('*').eq('template_center_id', row.id).order('sort_order', { ascending: true });
        if (mediaRes.error) throw mediaRes.error;
        const admissionRes = await client.from('template_admissions').select('*').eq('template_center_id', row.id).maybeSingle();
        if (admissionRes.error) throw admissionRes.error;
        row.center_media = mediaRes.data || [];
        row.admissions = admissionRes.data ? [admissionRes.data] : [];
        return mapRowToData(resolveTemplateAssets(row), { allowTeacherSampleFallback: true });
      }

      let isAdminPreviewMode = false;

      // Storage 경로를 한 번의 batch 서명 요청으로 변환
      async function signPaths(paths){
        const unique = Array.from(new Set(paths.filter(function(path){
          const value = String(path || '').trim();
          return value && !/^(?:https?:\/\/|data:|blob:)/i.test(value);
        }).map(function(path){ return String(path).trim(); })));
        const signedMap = new Map();
        if (unique.length){
          const res = await fetch(cfg.url + '/storage/v1/object/sign/center-images', {
            method: 'POST',
            headers: {
              apikey: cfg.anonKey,
              Authorization: 'Bearer ' + cfg.anonKey,
              'content-type': 'application/json'
            },
            body: JSON.stringify({ paths: unique, expiresIn: 3600 })
          });
          if (!res.ok) throw new Error('Failed to sign center images');
          const signed = await res.json();
          (signed || []).forEach(function(item, index){
            const signedUrl = item.signedURL ? cfg.url + '/storage/v1' + item.signedURL : (item.signedUrl || unique[index]);
            signedMap.set(item.path || unique[index], signedUrl);
          });
        }
        return function(path){
          const value = String(path || '').trim();
          return signedMap.get(value) || value;
        };
      }

      async function signCenterPhotos(data){
        const facilities = data.center.facilities;
        const programs = data.center.programs;
        const resolveSignedPath = await signPaths([]
          .concat((data.day_story || []).map(m => m.photo))
          .concat((data.teachers?.items || []).map(tc => tc.photo))
          .concat((facilities?.items || []).map(it => it && it.photo_url))
          .concat((programs?.items || []).map(it => it && it.photo_url))
          .concat(data.center.director ? [data.center.director.photo] : [])
          .concat(data.heroPhoto ? [data.heroPhoto] : []));
        if (data.heroPhoto){ data.heroPhoto = resolveSignedPath(data.heroPhoto); }
        for (const m of data.day_story){ m.photo = resolveSignedPath(m.photo); }
        for (const tc of data.teachers.items){ tc.photo = resolveSignedPath(tc.photo); }
        ['facilities', 'programs'].forEach(function(key){
          const section = data.center[key];
          if (!section || !Array.isArray(section.items)) return;
          data.center[key] = Object.assign({}, section, {
            items: section.items.map(function(item){
              return item ? Object.assign({}, item, { photo_url: resolveSignedPath(item.photo_url) }) : item;
            })
          });
        });
        if (data.center.director){ data.center.director.photo = resolveSignedPath(data.center.director.photo); }
      }

        if (reviewToken){
          const reviewRes = await client.rpc('get_center_by_review_token', { p_token: reviewToken });

            console.error('[review token RPC]', reviewRes.error.message, reviewRes.error);

            return;
          }
          if (!reviewRes.data){
            document.body.innerHTML = '<p class="load-error">검수 링크가 만료되었거나 폐기되었습니다.</p>';
            return;
          }
          isReviewMode = true;
          data = mapRowToData(reviewRes.data);
          await signCenterPhotos(data);

          isPreviewMode = true;
          previewTemplateId = previewId;
          data = await loadTemplatePreview(previewId);
        } else if (previewCenterSlug){
          // ── 신규: 관리자 draft 원 미리보기 (?preview_center=slug) ──
          const sessionRes = await client.auth.getSession();
          const session = sessionRes.data ? sessionRes.data.session : null;
          const isAdmin = !!(session && (session.user.email || '').toLowerCase() === 'tobby79@naver.com');
          if (!isAdmin){
            document.body.innerHTML = '<p class="load-error">관리자 로그인이 필요합니다.</p>';
            return;
          }
          const previewRes = await client.rpc('get_center_preview', { p_slug: previewCenterSlug });
          if (previewRes.error) throw previewRes.error;
          if (!previewRes.data){
            document.body.innerHTML = '<p class="load-error">원 데이터를 불러오지 못했어요. slug를 확인해주세요.</p>';
            return;
          }
          isAdminPreviewMode = true;
          data = mapRowToData(previewRes.data);
          await signCenterPhotos(data);
        } else {
          // ── 기존: 공개 원 조회 (?slug=slug) — 절대 변경 금지 ──
          const slug = slugParam || 'haetsal';
          const { data: row, error } = await client.from('centers').select('*, center_media(*), admissions(*), philosophy, programs, facilities').eq('slug', slug).single();
          if (error) throw error;
          data = mapRowToData(row);
          await signCenterPhotos(data);
        }

        const previewBanner = document.getElementById('previewBanner');
        if (previewBanner) {

      } catch (e) {
        console.error(e);

      }

      const $ = (id) => document.getElementById(id);
      const c = data.center;

      const canConsult = !isPreviewMode && !isReviewMode && !isAdminPreviewMode &&
        hasVisibleText(c.id) && cleanText(c.status) === 'published';
      const facilityItems = cleanItems(c.facilities && c.facilities.items, ['name','desc','photo_url']);
      const programItems = cleanItems(c.programs && c.programs.items, ['name','desc','photo_url']);
      const teacherItems = cleanItems(data.teachers && data.teachers.items, ['name','role','message','photo']);
      const faqItems = cleanItems(data.faqs && data.faqs.items, ['q','a']).filter(function(item){
        return hasVisibleText(item.q) && hasVisibleText(item.a);
      });
      const admissionData = data.admission || {};
      const hasAdmissionData = ['target','capacity_info','period','process','supplies','notes'].some(function(field){
        return hasVisibleText(admissionData[field]);
      });
      const routeItems = directionItems(c.directions_text);
      const busRoutes = await loadBusRouteData(client, c.id, isPreviewMode);
      // sunshine 기준 구조 통일: 공지·행사일정 제거 → 메뉴 필터. 하루(#day)·FAQ(#faq) 섹션 유지.
      // 시설 소개/교육프로그램(인페이지 섹션) + 입학안내/오시는 길(새 페이지) 런타임 주입
      (function(){

        if (extra.length){

      ${heroPhoto ? `<div class="hero-photo reveal"><div class="pond-img"><img alt="${esc(centerName)} 전경" src="${esc(heroPhoto)}" fetchpriority="high"></div></div>` : ''}
    </div>`;

      const d = c.director || {};

      const directorPhoto = cleanText(d.photo);
      const directorMessage = cleanText(d.message).replace(/<br\s*\/?>/gi,'\n');
      const directorValues = (Array.isArray(philosophy.values) ? philosophy.values : []).filter(hasVisibleText);

      </div>

        if (hasDirectorMessage) {
