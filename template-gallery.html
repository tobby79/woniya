<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원이야 - 갤러리 템플릿</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>

  :root{
    --char:#2B2B2E;
    --char-soft:#5A5A60;
    --line:#E4E2DD;
    --paper:#FFFFFF;
    --bg:#F7F6F3;
    --bg-warm:#EFEDE8;
    --accent:#2B2B2E;
    --ink:#2B2B2E;
    --ink-soft:#6C6A71;

    --serif:'Noto Serif KR',serif;
    --body:'Pretendard',sans-serif;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--body);
    color:var(--ink);
    background:var(--bg);
    overflow-x:hidden;
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
  }

  .skip-link{
    position:fixed;top:0;left:50%;z-index:1000;
    transform:translate(-50%,-200%);
    padding:12px 18px;border:2px solid #fff;border-radius:6px;
    background:var(--char);color:#fff;font-weight:700;text-decoration:none;
    box-shadow:0 6px 20px rgba(0,0,0,.35)
  }
  .skip-link:focus,.skip-link:focus-visible{transform:translate(-50%,12px);outline:3px solid #fff;outline-offset:3px}

  /* ── 상단바: 얇고 미니멀 ── */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:40;padding:18px 0;background:rgba(20,20,22,.62);transition:box-shadow .4s ease,padding .4s ease}
  .topbar.solid{background:rgba(247,246,243,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line);padding:14px 0}
  .topbar .brand{font-family:var(--serif);font-weight:600;font-size:1.2rem;color:#fff;text-decoration:none;letter-spacing:.5px}
  .topbar.solid .brand{color:var(--char)}
  .menu-btn{visibility:hidden;width:40px;height:40px;border:none;background:transparent;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;cursor:pointer}
  .menu-btn span{width:24px;height:1.5px;background:#fff;transition:transform .3s ease,opacity .3s ease}
  .menu-btn.solid span{background:var(--char)}
  .menu-btn.open span{background:var(--char)}
  .menu-btn.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg)}
  .menu-btn.open span:nth-child(2){opacity:0}
  .menu-btn.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg)}
  .topbar:not(.solid) .brand,.topbar:not(.solid) .topbar-home{color:#fff}
  .topbar:not(.solid) .menu-btn span{background:#fff}
  .topbar.solid .topbar-home{color:var(--ink-soft)}
  .topbar .topbar-home{transition:none}
  .menu-panel{position:fixed;top:60px;right:20px;left:20px;z-index:41;background:var(--paper);border:1px solid var(--line);box-shadow:0 24px 54px -20px rgba(43,43,46,.25);padding:10px;display:flex;flex-direction:column;opacity:0;visibility:hidden;transform:translateY(-10px);transition:opacity .3s ease,transform .3s ease,visibility .3s}
  .menu-panel.open{opacity:1;visibility:visible;transform:none}
  .menu-panel a{padding:14px 18px;text-decoration:none;color:var(--char);font-weight:500;font-size:.98rem;letter-spacing:.3px}
  .menu-panel a:hover{background:var(--bg)}
  .menu-panel a.menu-cta{background:var(--char);color:#fff;text-align:center;margin-top:6px}

  /* ── 공통 ── */
  .wrap{max-width:680px;margin:0 auto;padding:0 28px;position:relative}
  .reveal{opacity:0;transform:translateY(24px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.3,1)}
  .reveal.in{opacity:1;transform:none}

  .sec-label{font-size:.78rem;letter-spacing:3px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin-bottom:12px}
  .sec-title{font-family:var(--serif);font-weight:600;font-size:1.9rem;color:var(--char);letter-spacing:-.3px;line-height:1.4}

  /* ── 1. 메인 배너: 풀스크린 ── */
  .banner{position:relative;height:100vh;min-height:560px;display:flex;align-items:flex-end;overflow:hidden}
  .banner .bg{position:absolute;inset:0;z-index:0}
  .banner .bg img{width:100%;height:100%;object-fit:cover;display:block}
  .banner .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,20,22,.28) 0%,transparent 32%,transparent 50%,rgba(20,20,22,.72) 100%)}
  .banner .bg.placeholder{background:linear-gradient(135deg,#3a3a40,#5a5a62)}
  .banner .content{position:relative;z-index:2;width:100%;max-width:680px;margin:0 auto;padding:0 28px 64px;color:#fff}
  .banner .eyebrow{font-size:.82rem;letter-spacing:3px;text-transform:uppercase;font-weight:600;opacity:.9;margin-bottom:18px}
  .banner h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.6rem,9vw,3.6rem);line-height:1.25;letter-spacing:-.5px}
  .banner p{margin-top:18px;font-size:1.05rem;opacity:.92;max-width:420px;font-weight:300}
  /* 액자형 메뉴 버튼 (gallery 고유 — 모노톤·세련) */
  .banner .frame-menu{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
  .banner .frame-btn{font-size:.84rem;font-weight:600;letter-spacing:.5px;color:#fff;text-decoration:none;padding:10px 16px;border:1px solid rgba(255,255,255,.45);border-radius:8px;background:rgba(255,255,255,.08);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:background .2s ease,border-color .2s ease}
  .banner .frame-btn:hover{background:rgba(255,255,255,.2);border-color:#fff}

  /* ── 2. 갤러리 (앨범) — 가로 슬라이드 ── */
  .gallery{padding-top:90px;padding-bottom:70px}
  .gallery .sec-head{margin-bottom:36px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
  .gallery .g-count{font-family:var(--serif);font-size:.9rem;color:var(--ink-soft);white-space:nowrap}
  .gallery-rail{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:14px;scrollbar-width:thin}
  .gallery-rail::-webkit-scrollbar{height:4px}
  .gallery-rail::-webkit-scrollbar-track{background:var(--line)}
  .gallery-rail::-webkit-scrollbar-thumb{background:var(--char-soft)}
  .art{position:relative;flex:0 0 78%;max-width:420px;scroll-snap-align:center}
  .art .frame{overflow:hidden;background:var(--bg-warm);aspect-ratio:4/5}
  .art .art-lightbox-trigger{position:relative;display:block;width:100%;border:0;border-radius:0;color:inherit;font:inherit;text-align:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
  .art .art-lightbox-trigger:focus-visible{outline:3px solid #fff;outline-offset:-6px;box-shadow:inset 0 0 0 8px var(--char)}
  .art .art-lightbox-trigger[disabled]{opacity:1;cursor:wait}
  .art .art-lightbox-trigger[data-image-state="error"]{cursor:not-allowed}
  .art .art-lightbox-trigger[data-image-state="loading"] img,.art .art-lightbox-trigger[data-image-state="error"] img{opacity:.38}
  .art .art-image-status{position:absolute;top:50%;left:50%;z-index:1;max-width:calc(100% - 32px);transform:translate(-50%,-50%);padding:8px 12px;background:rgba(43,43,46,.88);color:#fff;font-size:.8rem;font-weight:600;line-height:1.45;text-align:center;white-space:nowrap;pointer-events:none}
  .art .art-image-status[hidden]{display:none}
  .art .frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s cubic-bezier(.2,.7,.3,1)}
  .art:hover .art-lightbox-trigger:not([disabled]) img{transform:scale(1.03)}
  .art .meta{display:flex;align-items:baseline;gap:14px;margin-top:14px}
  .art .meta .no{font-family:var(--serif);font-size:.9rem;color:var(--ink-soft)}
  .art .meta .cap{font-family:var(--serif);font-size:1.1rem;color:var(--char)}
  .art .meta .line{flex:1;height:1px;background:var(--line)}
  .gallery-hint{margin-top:18px;font-size:.8rem;color:var(--ink-soft);letter-spacing:.5px;text-align:center}
  .gallery-hint .arrow{display:inline-block;margin:0 4px}

  /* ── 소개 영상: 편집 지면 위의 단일 영상 작품 ── */
  .gallery-intro-video{padding-top:34px;padding-bottom:80px}
  .gallery-intro-video .sec-head{margin-bottom:28px}
  .gallery-intro-video-frame{
    position:relative;margin:0;padding:14px;background:var(--paper);border:1px solid var(--line);
    box-shadow:0 24px 54px -38px rgba(43,43,46,.62)
  }
  .gallery-intro-video-frame::before{
    content:"";position:absolute;inset:7px;border:1px solid rgba(43,43,46,.08);pointer-events:none
  }
  .gallery-intro-video-screen{position:relative;z-index:1;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--char)}
  .gallery-intro-video-screen iframe{display:block;width:100%;height:100%;border:0}
  .gallery-intro-video-poster{
    position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    overflow:hidden;border:0;padding:0;color:var(--char);background:linear-gradient(145deg,#54545A,#242426);cursor:pointer
  }
  .gallery-intro-video-poster::after{
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,rgba(20,20,22,.08),rgba(20,20,22,.42))
  }
  .gallery-intro-video-poster-image{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.34);opacity:.88
  }
  .gallery-intro-video-play{
    position:relative;z-index:2;width:62px;height:62px;border:1px solid rgba(43,43,46,.18);border-radius:50%;
    display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.94);
    box-shadow:0 18px 38px -18px rgba(0,0,0,.84);transition:transform .2s ease,background .2s ease
  }
  .gallery-intro-video-play svg{width:24px;height:24px;margin-left:4px}
  .gallery-intro-video-poster:focus-visible{outline:3px solid #fff;outline-offset:-7px}
  @media (hover:hover){
    .gallery-intro-video-poster:hover .gallery-intro-video-play{transform:scale(1.05);background:#fff}
  }

  /* ── 3. 우리 원 둘러보기 ── */
  .tour{padding-top:70px;padding-bottom:70px}
  .tour .sec-head{margin-bottom:40px}
  .space{margin-bottom:60px}
  .space:last-child{margin-bottom:0}
  .space .frame{overflow:hidden;background:var(--bg-warm);aspect-ratio:3/2}
  .space .frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s cubic-bezier(.2,.7,.3,1)}
  .space:hover .frame img{transform:scale(1.03)}
  .space .frame.placeholder{background:linear-gradient(135deg,#d8d6d0,#c4c2bc)}
  .space .info{margin-top:20px}
  .space .info .idx{font-family:var(--serif);font-size:.85rem;color:var(--ink-soft);letter-spacing:1px}
  .space .info h3{font-family:var(--serif);font-weight:600;font-size:1.5rem;color:var(--char);margin:6px 0 10px;letter-spacing:-.3px}
  .space .info p{color:var(--char-soft);font-size:.98rem;line-height:1.75;max-width:480px;font-weight:300}

  /* ── 4. 우리 원 선생님 ── */
  .staff{padding-top:70px;padding-bottom:70px}
  .staff .sec-head{margin-bottom:40px}
  .staff-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px 24px}
  .person{text-align:left}
  .person .portrait{aspect-ratio:3/4;overflow:hidden;background:var(--bg-warm);margin-bottom:14px}
  .person .portrait img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.3);transition:filter .6s ease,transform 1.1s cubic-bezier(.2,.7,.3,1)}
  .person:hover .portrait img{filter:grayscale(0);transform:scale(1.03)}
  .person .name{font-family:var(--serif);font-weight:600;font-size:1.15rem;color:var(--char)}
  .person .role{font-size:.85rem;color:var(--ink-soft);margin-top:2px;letter-spacing:.3px}
  .person .msg{font-size:.9rem;color:var(--char-soft);margin-top:10px;line-height:1.65;font-weight:300;font-style:italic;font-family:var(--serif)}

  /* ── 5. 원장 한마디 ── */
  .director{padding-top:90px;padding-bottom:90px;text-align:center}
  .director .quote-mark{font-family:var(--serif);font-size:3.5rem;color:var(--line);line-height:.6;margin-bottom:10px}
  .director .msg{font-family:var(--serif);font-weight:400;font-size:1.5rem;line-height:1.9;color:var(--char);max-width:520px;margin:0 auto;letter-spacing:-.2px;white-space:pre-line}
  .director .who{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:36px}
  .director .who .portrait{width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--bg-warm)}
  .director .who .portrait img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(.3)}
  .director .who .name{font-size:.9rem;color:var(--ink-soft);letter-spacing:.5px}
  .director .who .name strong{display:block;font-family:var(--serif);font-weight:600;font-size:1.05rem;color:var(--char);margin-top:2px}

  /* ── 6. 안내 (공지·일정·FAQ) ── */
  .info-desk{padding-top:70px;padding-bottom:40px}
  .info-desk .sec-head{margin-bottom:34px}
  .info-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:30px}
  .info-tab{padding:12px 22px;border:none;background:transparent;color:var(--ink-soft);font-family:var(--body);font-size:.96rem;font-weight:600;cursor:pointer;position:relative;letter-spacing:.3px;transition:color .25s}
  .info-tab.active{color:var(--char)}
  .info-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--char)}
  .info-panel{display:none}
  .info-panel.active{display:block;animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .notice-list{list-style:none}
  .notice-item{display:flex;align-items:baseline;gap:16px;padding:18px 2px;border-bottom:1px solid var(--line)}
  .notice-item .tag{flex:none;font-size:.72rem;font-weight:600;letter-spacing:.5px;color:var(--char);min-width:46px}
  .notice-item .n-title{flex:1;font-weight:500;font-size:1rem;color:var(--char)}
  .notice-item .n-date{color:var(--ink-soft);font-size:.82rem;font-family:var(--serif)}
  .more-link{display:inline-block;margin-top:18px;color:var(--char);font-weight:600;text-decoration:none;font-size:.9rem;border-bottom:1px solid var(--char);padding-bottom:2px}

  .cal{border:1px solid var(--line);padding:24px 22px}
  .cal-head{font-family:var(--serif);font-weight:600;font-size:1.2rem;margin-bottom:16px;color:var(--char)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-grid .dow{font-size:.75rem;color:var(--ink-soft);padding:6px 0;font-weight:600;text-align:center}
  .day-cell{position:relative;padding:11px 0;font-size:.88rem;text-align:center;color:var(--char)}
  .day-cell.muted{color:var(--line)}
  .day-cell.ev{font-weight:700;color:var(--char)}
  .day-cell.ev::after{content:"";position:absolute;left:50%;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--char);transform:translateX(-50%)}
  .event-list{list-style:none;margin-top:20px}
  .event-list li{display:flex;align-items:baseline;gap:14px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:.95rem}
  .event-list li:last-child{border-bottom:none}
  .event-list .e-date{font-weight:600;color:var(--char);font-size:.84rem;min-width:46px;font-family:var(--serif)}

  .faq-item{border-bottom:1px solid var(--line)}
  .faq-q{width:100%;border:none;background:transparent;text-align:left;padding:20px 2px;font-size:1rem;font-weight:500;color:var(--char);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--body)}
  .faq-q .sign{flex:none;font-family:var(--serif);font-size:1.3rem;color:var(--ink-soft);transition:transform .35s ease;line-height:1}
  .faq-item.open .faq-q .sign{transform:rotate(45deg)}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .4s ease}
  .faq-a p{padding:0 2px 20px;color:var(--char-soft);font-size:.94rem;line-height:1.8;font-weight:300}

  /* ── 7. 마무리 ── */
  .finale{padding-top:100px;padding-bottom:150px;text-align:center}
  .finale .quote-mark{font-family:var(--serif);font-size:2.5rem;color:var(--line);line-height:.6;margin-bottom:14px}
  .finale h2{font-family:var(--serif);font-weight:600;font-size:2rem;line-height:1.5;letter-spacing:-.3px;color:var(--char)}
  .finale p{color:var(--char-soft);margin:18px 0 40px;font-size:1rem;font-weight:300}
  .btn-big{display:inline-block;background:var(--char);color:#fff;font-weight:500;font-size:1rem;padding:18px 50px;text-decoration:none;letter-spacing:.5px;transition:opacity .3s ease,transform .3s ease;border:none;cursor:pointer;font-family:var(--body)}
  .btn-big:hover{opacity:.85;transform:translateY(-2px)}

  /* ── 플로팅 ── */
  .float{position:fixed;right:24px;bottom:24px;z-index:30;transform:translateY(120px);transition:transform .5s cubic-bezier(.22,.9,.3,1)}
  .float.show{transform:translateY(0)}
  .float.hide{transform:translateY(120px)}
  .float a{display:flex;align-items:center;gap:9px;background:var(--char);color:#fff;font-weight:500;padding:15px 26px;text-decoration:none;box-shadow:0 12px 30px -8px rgba(43,43,46,.5);font-size:.94rem;letter-spacing:.3px}
  .float a .dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 2s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  /* ── 모달 ── */
  .csl-overlay{position:fixed;inset:0;z-index:50;background:rgba(20,20,22,.55);display:none;align-items:center;justify-content:center;padding:20px}
  .csl-overlay.open{display:flex}
  .csl-panel{position:relative;width:100%;max-width:400px;max-height:88vh;overflow-y:auto;background:var(--paper);padding:38px 32px 32px}
  .csl-close{position:absolute;top:18px;right:18px;width:34px;height:34px;border:none;background:transparent;font-size:1.4rem;line-height:1;color:var(--ink-soft);cursor:pointer}
  .csl-title{font-family:var(--serif);font-weight:600;font-size:1.4rem;margin-bottom:6px;color:var(--char)}
  .csl-sub{font-size:.85rem;color:var(--ink-soft);margin-bottom:24px}
  .csl-field{margin-bottom:18px;text-align:left}
  .csl-field label{display:block;font-size:.8rem;font-weight:600;color:var(--char-soft);margin-bottom:7px;letter-spacing:.3px}
  .csl-field input[type=text],.csl-field input[type=tel],.csl-field select{
    width:100%;border:none;border-bottom:1.5px solid var(--line);border-radius:0;padding:10px 2px;
    font-family:var(--body);font-size:.96rem;color:var(--char);background:transparent;outline:none;transition:border-color .25s;
  }
  .csl-field input:focus,.csl-field select:focus{border-color:var(--char)}
  .csl-consent label{display:flex;align-items:flex-start;gap:8px;font-size:.82rem;font-weight:400;color:var(--char-soft);line-height:1.5}
  .csl-consent input{margin-top:3px;flex:none}
  .csl-submit{width:100%;margin-top:10px}
  .csl-msg.error{margin-top:12px;font-size:.84rem;color:#B0413E;text-align:center}
  .csl-done{text-align:center;font-family:var(--serif);font-size:1.3rem;color:var(--char);padding:36px 0;line-height:1.8}

  .gallery-footer{padding:52px 28px 58px;border-top:1px solid var(--line);color:var(--ink-soft);text-align:center}
  .gallery-footer-inner{width:100%;max-width:680px;margin:0 auto}
  .gallery-footer-tag{margin:0 0 12px;font-size:.68rem;font-weight:600;letter-spacing:2.4px;text-transform:uppercase;color:var(--ink-soft);overflow-wrap:anywhere}
  .gallery-footer-name{margin:0;font-family:var(--serif);font-size:1.2rem;font-weight:600;line-height:1.55;color:var(--char);word-break:keep-all;overflow-wrap:anywhere}
  .gallery-footer-copy{max-width:560px;margin:12px auto 0;font-size:.82rem;line-height:1.8;color:var(--char-soft);word-break:keep-all;overflow-wrap:anywhere}
  .gallery-footer-meta{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:4px 18px;max-width:620px;margin:18px auto 0;font-style:normal;font-size:.82rem;line-height:1.65}
  .gallery-footer-address,.gallery-footer-phone{min-width:0;word-break:keep-all;overflow-wrap:anywhere}
  .gallery-footer-meta-label{margin-right:7px;font-size:.68rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft)}
  .gallery-footer-phone{display:inline-flex;align-items:center;justify-content:center;min-height:44px}

<div class="csl-overlay" id="cslOverlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="cslTitle" aria-describedby="cslDescription">

    <button type="button" class="csl-close" id="cslCloseBtn" aria-label="닫기">×</button>

      <h3 class="csl-title" id="cslTitle">입소 상담 신청</h3>

      <form id="cslForm">
        <div class="csl-field">
          <label for="csl-name">학부모 이름</label>
          <input type="text" id="csl-name" required>
        </div>
        <div class="csl-field">
          <label for="csl-phone">연락처</label>
          <input type="tel" id="csl-phone" placeholder="010-0000-0000" required>
        </div>
        <div class="csl-field">
          <label for="csl-kind">신청 종류</label>
          <select id="csl-kind" required>
            <option value="consult">상담</option>
            <option value="waiting">대기</option>
            <option value="info_session">설명회</option>
          </select>
        </div>
        <div class="csl-field">
          <label for="csl-class">희망 반</label>
          <select id="csl-class">
            <option value="">선택 안 함</option>
            <option value="만3세">만 3세</option>
            <option value="만4세">만 4세</option>
            <option value="만5세">만 5세</option>
          </select>
        </div>
        <div class="csl-field">
          <label for="csl-time">희망 시간</label>
          <input type="text" id="csl-time" placeholder="예: 평일 오후 2시">
        </div>
        <div class="csl-field csl-consent">
          <label>
            <input type="checkbox" id="csl-consent" required>
            <span>상담 신청 처리를 위해 이름·연락처 등 개인정보 수집에 동의합니다. <a href="/privacy.html" target="_blank" rel="noopener">개인정보처리방침</a></span>
          </label>
        </div>
        <button type="submit" class="btn-big csl-submit">신청하기</button>
        <div class="csl-msg error" id="cslError" role="alert" aria-atomic="true"></div>
      </form>
    </div>
    <div id="cslDoneWrap" role="status" aria-live="polite" aria-atomic="true" tabindex="-1" hidden>
      <p class="csl-done">접수되었습니다.<br>곧 연락드리겠습니다.</p>

  </div>
</div>

<script>
// 모든 렌더 함수(async IIFE, initInteractions 등)가 공유하는 escape 헬퍼.
// 최상단 스크립트 스코프에 둬야 initInteractions처럼 async IIFE 바깥에서 정의된
// 함수에서도 클로저로 접근할 수 있다.
const esc = (s) => {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
};

function escWithBr(text){
  var normalized = (text || '').replace(/<br\s*\/?>/gi, '\n');
  return esc(normalized).replace(/\n/g, '<br>');
}

function hasVisibleText(value){
  return String(value ?? '').trim().length > 0;
}

function cleanDisplayText(value){
  if (typeof value !== 'string') return '';
  var cleaned = value.trim();
  if (!cleaned || !cleaned.replace(/<br\s*\/?>/gi, '').trim()) return '';
  return cleaned;
}

function hasAdmissionDisplayData(admission){
  if (!admission || typeof admission !== 'object' || Array.isArray(admission)) return false;
  return ['target','capacity_info','period','process','supplies','notes','deadline_date']
    .some(function(field){ return Boolean(cleanDisplayText(admission[field])); });
}

function buildTelHref(value){
  var phone = cleanDisplayText(value);
  if (!phone) return '';
  var digits = phone.replace(/\D/g, '');
  if (digits.length < 7) return '';
  return 'tel:' + (phone.charAt(0) === '+' ? '+' : '') + digits;
}

function normalizeGalleryFooterText(value){
  return cleanDisplayText(value).replace(/<br\s*\/?>/gi, ' ').replace(/\s+/g, ' ').toLowerCase();
}

function isGalleryFooterBrandOnly(value){
  var normalized = normalizeGalleryFooterText(value);
  return normalized === '원이야'
    || normalized === 'powered by 원이야'
    || normalized === '원이야로 만든';
}

function renderGalleryFooter(element, options){
  if (!element) return;
  var footerData = options.footer && typeof options.footer === 'object' && !Array.isArray(options.footer)
    ? options.footer
    : {};
  var centerName = cleanDisplayText(options.centerName);
  var address = cleanDisplayText(options.address);
  var contactPhone = cleanDisplayText(options.contactPhone);
  var contactPhoneHref = buildTelHref(contactPhone);
  var contactNote = cleanDisplayText(options.contactNote);
  var centerNameKey = normalizeGalleryFooterText(centerName);
  var contactNoteKey = normalizeGalleryFooterText(contactNote);
  var rawTag = cleanDisplayText(footerData.tag);
  var rawText = cleanDisplayText(footerData.text);
  var tag = rawTag
    && normalizeGalleryFooterText(rawTag) !== centerNameKey
    && !isGalleryFooterBrandOnly(rawTag)
    ? rawTag
    : '';
  var copy = rawText
    && normalizeGalleryFooterText(rawText) !== centerNameKey
    && normalizeGalleryFooterText(rawText) !== contactNoteKey
    && !isGalleryFooterBrandOnly(rawText)
    ? rawText
    : '';
  var blocks = [];

  if (tag) blocks.push('<p class="gallery-footer-tag">' + esc(tag) + '</p>');
  if (centerName) blocks.push('<p class="gallery-footer-name">' + esc(centerName) + '</p>');
  if (copy) blocks.push('<p class="gallery-footer-copy">' + escWithBr(copy) + '</p>');

  var contactParts = [];
  if (address) {
    contactParts.push('<span class="gallery-footer-address"><span class="gallery-footer-meta-label">Address</span>' + escWithBr(address) + '</span>');
  }
  if (contactPhone) {
    var phoneContent = contactPhoneHref
      ? '<a href="' + esc(contactPhoneHref) + '" aria-label="' + esc(contactPhone + '로 전화하기') + '"><span class="gallery-footer-meta-label" aria-hidden="true">Tel</span><span>' + esc(contactPhone) + '</span></a>'
      : '<span><span class="gallery-footer-meta-label">Tel</span>' + esc(contactPhone) + '</span>';
    contactParts.push('<span class="gallery-footer-phone">' + phoneContent + '</span>');
  }
  if (contactParts.length) {
    blocks.push('<address class="gallery-footer-meta">' + contactParts.join('') + '</address>');
  }
  if (contactNote) {
    blocks.push('<p class="gallery-footer-contact-note">' + escWithBr(contactNote) + '</p>');
  }

  var links = [];
  if (options.detailQuery && options.hasAdmissionData) {
    links.push('<a href="' + esc('admissions.html' + options.detailQuery) + '">입학안내</a>');
  }
  if (options.detailQuery && options.hasDirectionsData) {
    links.push('<a href="' + esc('directions.html' + options.detailQuery) + '">오시는 길</a>');
  }
  if (links.length) {
    blocks.push('<nav class="gallery-footer-links" aria-label="원 안내">' + links.join('') + '</nav>');
  }

  blocks.push('<p class="gallery-footer-powered"><a href="index.html">Powered by 원이야</a></p>');
  element.innerHTML = '<div class="gallery-footer-inner">' + blocks.join('') + '</div>';
}

function heroTitleHtml(title, accent, accentClass){
  var titleHtml = escWithBr(title);
  var accentHtml = escWithBr(accent);
  if (!accentHtml) return titleHtml;
  var hasBreak = /<br\s*\/?>|\r?\n/i.test(title || '') || /^\s*(?:<br\s*\/?>|\r?\n)/i.test(accent || '');
  var joiner = hasBreak ? '' : (accentClass ? '<br>' : ' ');
  var cls = accentClass ? ' class="' + accentClass + '"' : '';
  return titleHtml + joiner + '<span' + cls + '>' + accentHtml + '</span>';
}

function parseGalleryIntroVideo(rawValue){
  var raw = typeof rawValue === 'string' ? rawValue.trim() : '';
  if (!raw) return null;

  var candidate = /^[a-z][a-z0-9+.-]*:\/\//i.test(raw) ? raw : 'https://' + raw;
  var parsed;
  try {
    parsed = new URL(candidate);
  } catch (err) {
    return null;
  }

  if (parsed.protocol !== 'https:' && parsed.protocol !== 'http:') return null;

  var host = parsed.hostname.toLowerCase();
  var parts = parsed.pathname.split('/').filter(function(part){ return part; });
  var videoId = '';
  var youtubeHosts = ['youtube.com', 'www.youtube.com', 'm.youtube.com'];
  var noCookieHosts = ['youtube-nocookie.com', 'www.youtube-nocookie.com'];

  if (host === 'youtu.be') {
    videoId = parts[0] || '';
  } else if (youtubeHosts.indexOf(host) !== -1) {
    if (parts[0] === 'watch') {
      videoId = parsed.searchParams.get('v') || '';
    } else if (parts[0] === 'shorts' || parts[0] === 'embed') {
      videoId = parts[1] || '';
    }
  } else if (noCookieHosts.indexOf(host) !== -1 && parts[0] === 'embed') {
    videoId = parts[1] || '';
  }

  if (/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
    return {
      provider: 'youtube',
      videoId: videoId,
      embedUrl: 'https://www.youtube-nocookie.com/embed/' + videoId
    };
  }

  videoId = '';
  if ((host === 'vimeo.com' || host === 'www.vimeo.com') && parts.length === 1) {
    videoId = parts[0] || '';
  } else if (host === 'player.vimeo.com'
    && parts.length === 2
    && parts[0] === 'video'
    && !parsed.searchParams.has('h')) {
    videoId = parts[1] || '';
  }

  if (/^\d+$/.test(videoId)) {
    return {
      provider: 'vimeo',
      videoId: videoId,
      embedUrl: 'https://player.vimeo.com/video/' + videoId
    };
  }

  return null;
}

var SAMPLE_SPACES = [
  { name:'놀이방', desc:'블록과 역할놀이로 상상력이 자라는 우리 반의 공간입니다.', photo:null },
  { name:'바깥 놀이터', desc:'안전한 모래밭과 미끄럼틀에서 마음껏 뛰노는 시간.', photo:null },
  { name:'그림책 도서관', desc:'포근한 쿠션에 앉아 선생님과 그림책을 읽습니다.', photo:null },
  { name:'급식실', desc:'영양 가득한 식단을 친구들과 함께 나눕니다.', photo:null }
];

function mapRowToData(row, options = {}){
  const { allowTeacherSampleFallback = false } = options;
  const media = row.center_media || [];
  const byType = (type) => {
    const seen = new Set();
    return media
      .filter(m => m.media_type === type)
      .sort((a,b) => a.sort_order - b.sort_order)
      .filter(m => { // DB에 중복 sort_order 행이 들어간 경우 방어 (같은 사진이 2번 보이는 문제)
        if (seen.has(m.sort_order)) return false;
        seen.add(m.sort_order);
        return true;
      });
  };
  // day_story는 같은 sort_order의 실제 행도 모두 보존한다.
  // 동률일 때는 DB 조회 결과의 원래 순서만 유지해 sort_order ASC 의미를 해치지 않는다.
  const dayStoryRows = media
    .map((item, index) => ({ item, index }))
    .filter(entry => entry.item.media_type === 'day_story')
    .sort((a, b) => {
      const aOrder = Number(a.item.sort_order);
      const bOrder = Number(b.item.sort_order);
      const orderDiff = (Number.isFinite(aOrder) ? aOrder : 0) - (Number.isFinite(bOrder) ? bOrder : 0);
      return orderDiff || (a.index - b.index);
    })
    .map(entry => entry.item);
  const teacherFallbacks = [
    { name: '김햇살 선생님', role: '만 3세 햇살반 담임', message: '아이의 속도에 맞춰 기다려 줄게요.' },
    { name: '이초록 선생님', role: '만 4세 새싹반 담임', message: '매일의 작은 성장을 놓치지 않을게요.' },
    { name: '박노을 선생님', role: '만 5세 열매반 담임', message: '마음껏 궁금해하는 아이로 도울게요.' }
  ];
  const teacherItems = byType('teacher').map((m, i) => {
    const fallback = teacherFallbacks[i % teacherFallbacks.length];
    return {
      name: allowTeacherSampleFallback ? (m.title || fallback.name) : (m.title ?? ''),
      role: allowTeacherSampleFallback ? (m.subtitle || fallback.role) : (m.subtitle ?? ''),
      photo: m.photo_url,
      message: allowTeacherSampleFallback ? (m.caption || fallback.message) : (m.caption ?? '')
    };
  });
  const hero = byType('hero')[0] || null;
  return {
    center: {
      id: row.id,
      slug: cleanDisplayText(row.slug),
      name: row.name,
      theme: row.theme,
      status: cleanDisplayText(row.status).toLowerCase(),
      address: cleanDisplayText(row.address),
      contactPhone: cleanDisplayText(row.contact_phone),
      contactNote: cleanDisplayText(row.contact_note),
      intro_video_url: cleanDisplayText(row.intro_video_url),
      intro_video_title: cleanDisplayText(row.intro_video_title),
      directions_text: cleanDisplayText(row.directions_text),
      menu: row.menu || [],
      hero: row.hero || { eyebrow:'', title:'', title_accent:'', subtitle:'' },
      director: row.director || { badge:'', photo:'', photo_alt:'', message:'', sign_label:'', sign_name:'', scroll_cue:'' },
      philosophy: row.philosophy || null,
      programs: row.programs || null,
      facilities: row.facilities || null
    },
    heroPhoto: hero ? hero.photo_url : null,
    day_story: dayStoryRows.map(m => ({
      slot: m.slot,
      time: m.time_label,
      title: m.title,
      photo: m.photo_url,
      photo_alt: m.photo_alt,
      caption: m.caption,
      note: m.note
    })),
    album: { items: byType('album').map(m => ({ label: m.title, photo: m.photo_url })) },
    teachers: { items: teacherItems },
    notices: row.notices || { eyebrow:'', title:'', items:[], more:'' },
    schedule: row.schedule || { eyebrow:'', title:'', month_label:'', days_in_month:30, event_days:[], trailing_muted:0, events:[] },
    faqs: row.faqs || { eyebrow:'', title:'', items:[] },
    finale: row.finale || { title:'', subtitle:'', cta:'입소 상담' },
    admission: (row.admissions || [])[0] || null,
    footer: row.footer || { tag:'원이야', text:'' }
  };
}

(async function(){
  let data;
  const cfg = window.__SUPABASE_CONFIG__;
  const client = supabase.createClient(cfg.url, cfg.anonKey);
  let isPreviewMode = false;
  let isReviewMode = false;
  const PREVIEW_TEMPLATE_IDS = ['sunshine', 'carnival', 'forest', 'gallery'];
  const PREVIEW_MESSAGE = '이것은 템플릿 미리보기입니다. 실제 신청은 접수되지 않습니다.';

  const REVIEW_MESSAGE = '공개 전 검수용 화면에서는 신청이 접수되지 않습니다.';

  function normalizePreviewId(value){
    return PREVIEW_TEMPLATE_IDS.includes(value) ? value : '';
  }

  function normalizePageContext(search){
    const params = new URLSearchParams(search || '');
    const reviewToken = cleanDisplayText(params.get('review_token'));
    const slug = reviewToken ? '' : cleanDisplayText(params.get('slug'));
    const previewCenter = (reviewToken || slug) ? '' : cleanDisplayText(params.get('preview_center'));
    const preview = (reviewToken || slug || previewCenter)
      ? ''
      : normalizePreviewId(cleanDisplayText(params.get('preview')).toLowerCase());
    return {
      review_token: reviewToken,
      slug: slug,
      preview_center: previewCenter,
      preview: preview
    };
  }

  function buildDetailQuery(context, fallbackSlug){
    if (context.review_token) return '?review_token=' + encodeURIComponent(context.review_token);
    if (context.slug) return '?slug=' + encodeURIComponent(context.slug);
    if (context.preview_center) return '?preview_center=' + encodeURIComponent(context.preview_center);
    if (context.preview) return '?preview=' + encodeURIComponent(context.preview);
    const safeFallbackSlug = cleanDisplayText(fallbackSlug);
    return safeFallbackSlug ? ('?slug=' + encodeURIComponent(safeFallbackSlug)) : '';
  }

  function publicTemplateUrl(path){
    const value = String(path || '').trim();
    if (!value || /^(?:https?:\/\/|data:|blob:)/i.test(value)) return value;
    const res = client.storage.from('template-previews').getPublicUrl(value);
    return res && res.data && res.data.publicUrl ? res.data.publicUrl : value;
  }

  function resolveTemplateAssets(row){
    if (Array.isArray(row.center_media)){
      row.center_media = row.center_media.map(function(m){
        if (!m || !m.photo_url) return m;
        return Object.assign({}, m, { photo_url: publicTemplateUrl(m.photo_url) });
      });
    }
    if (row.director && row.director.photo){
      row.director = Object.assign({}, row.director, { photo: publicTemplateUrl(row.director.photo) });
    }
    ['facilities', 'programs'].forEach(function(key){
      if (!row[key] || !Array.isArray(row[key].items)) return;
      row[key] = Object.assign({}, row[key], {
        items: row[key].items.map(function(item){
          if (!item || !item.photo_url) return item;
          return Object.assign({}, item, { photo_url: publicTemplateUrl(item.photo_url) });
        })
      });
    });
    return row;
  }

  async function loadTemplatePreview(templateId){
    const centerRes = await client.from('template_centers').select('*').eq('template_id', templateId).single();
    if (centerRes.error) throw centerRes.error;
    const row = centerRes.data;
    const mediaRes = await client.from('template_center_media').select('*').eq('template_center_id', row.id).order('sort_order', { ascending: true });
    if (mediaRes.error) throw mediaRes.error;
    const admissionRes = await client.from('template_admissions').select('*').eq('template_center_id', row.id).maybeSingle();
    if (admissionRes.error) throw admissionRes.error;
    row.center_media = mediaRes.data || [];
    row.admissions = admissionRes.data ? [admissionRes.data] : [];
    return mapRowToData(resolveTemplateAssets(row), { allowTeacherSampleFallback: true });
  }

  let isAdminPreviewMode = false;

  const signedUrlCache = new Map();
  const signedUrlPending = new Map();
  const SIGNED_CACHE_STORAGE_KEY = 'woniya_signed_cache_v1';
  const SIGNED_CACHE_VERSION = 1;
  const SIGNED_CACHE_BUCKET = 'center-images';
  const SIGNED_URL_TTL_MS = 3600 * 1000;
  const SIGNED_URL_REUSE_BUFFER_MS = 5 * 60 * 1000;
  const SIGNED_CACHE_MAX_ENTRIES = 120;
  const signedCacheNamespace = (function(){
    try {
      return new URL(cfg.url).host.toLowerCase();
    } catch (e) {
      return String(cfg.url || '').trim().toLowerCase()
        .replace(/^https?:\/\//, '').split('/')[0] || 'unknown-project';
    }
  })();
  let signedSessionCacheSnapshot = null;

  function normalizePhotoPath(path){
    return String(path || '').trim();
  }

  function isDirectPhotoUrl(path){
    return /^(?:https?:\/\/|data:|blob:)/i.test(path);
  }

  function emptySignedSessionCache(){
    return { version:SIGNED_CACHE_VERSION, entries:Object.create(null) };
  }

  function signedSessionEntryKey(path){
    return signedCacheNamespace + ':' + SIGNED_CACHE_BUCKET + ':' + path;
  }

  function cleanSignedSessionEntries(entries, now){
    const cleaned = Object.create(null);
    if (!entries || typeof entries !== 'object' || Array.isArray(entries)) return cleaned;
    const bucketMarker = ':' + SIGNED_CACHE_BUCKET + ':';
    Object.keys(entries).forEach(function(key){
      const entry = entries[key];
      if (
        key.indexOf(bucketMarker) < 0 ||
        !entry ||
        typeof entry !== 'object' ||
        typeof entry.url !== 'string' ||
        !entry.url.trim() ||
        typeof entry.expiresAt !== 'number' ||
        !Number.isFinite(entry.expiresAt) ||
        !(now < entry.expiresAt - SIGNED_URL_REUSE_BUFFER_MS)
      ) return;
      cleaned[key] = { url:entry.url, expiresAt:entry.expiresAt };
    });
    const keys = Object.keys(cleaned).sort(function(a, b){
      return cleaned[a].expiresAt - cleaned[b].expiresAt;
    });
    while (keys.length > SIGNED_CACHE_MAX_ENTRIES) {
      delete cleaned[keys.shift()];
    }
    return cleaned;
  }

  function writeSignedSessionCache(cache){
    signedSessionCacheSnapshot = cache;
    try {
      sessionStorage.setItem(SIGNED_CACHE_STORAGE_KEY, JSON.stringify(cache));
    } catch (e) {}
  }

  function readSignedSessionCache(){
    if (signedSessionCacheSnapshot) return signedSessionCacheSnapshot;
    const empty = emptySignedSessionCache();
    try {
      const raw = sessionStorage.getItem(SIGNED_CACHE_STORAGE_KEY);
      if (!raw) {
        signedSessionCacheSnapshot = empty;
        return empty;
      }
      const parsed = JSON.parse(raw);
      if (
        !parsed ||
        typeof parsed !== 'object' ||
        parsed.version !== SIGNED_CACHE_VERSION ||
        !parsed.entries ||
        typeof parsed.entries !== 'object' ||
        Array.isArray(parsed.entries)
      ) {
        writeSignedSessionCache(empty);
        return empty;
      }
      const cleaned = {
        version:SIGNED_CACHE_VERSION,
        entries:cleanSignedSessionEntries(parsed.entries, Date.now())
      };
      writeSignedSessionCache(cleaned);
      return cleaned;
    } catch (e) {
      signedSessionCacheSnapshot = empty;
      return empty;
    }
  }

  async function signPaths(paths){
    const unique = Array.from(new Set((paths || []).map(normalizePhotoPath).filter(function(path){
      return path && !isDirectPhotoUrl(path);
    })));
    const resolvedMap = new Map();
    const cacheMisses = [];
    const sessionCache = readSignedSessionCache();

    unique.forEach(function(path){
      if (signedUrlCache.has(path)) {
        resolvedMap.set(path, signedUrlCache.get(path));
        return;
      }
      if (signedUrlPending.has(path)) return;
      const sessionEntry = sessionCache.entries[signedSessionEntryKey(path)];
      if (sessionEntry) {
        signedUrlCache.set(path, sessionEntry.url);
        resolvedMap.set(path, sessionEntry.url);
        return;
      }
      cacheMisses.push(path);
    });

    const pendingResolvers = new Map();
    cacheMisses.forEach(function(path){
      let settle;
      const pending = new Promise(function(resolve){ settle = resolve; });
      signedUrlPending.set(path, pending);
      pendingResolvers.set(path, settle);
    });

    if (cacheMisses.length){
      const signedMap = new Map();
      try {
        const res = await fetch(cfg.url + '/storage/v1/object/sign/center-images', {
          method: 'POST',
          headers: {
            apikey: cfg.anonKey,
            Authorization: 'Bearer ' + cfg.anonKey,
            'content-type': 'application/json'
          },
          body: JSON.stringify({ paths: cacheMisses, expiresIn: 3600 })
        });
        if (res.ok) {
          const signed = await res.json();
          (Array.isArray(signed) ? signed : []).forEach(function(item, index){
            const path = normalizePhotoPath(item && (item.path || cacheMisses[index]));
            const rawSignedUrl = normalizePhotoPath(item && (item.signedURL || item.signedUrl));
            if (!path || !rawSignedUrl || !pendingResolvers.has(path)) return;
            const signedUrl = rawSignedUrl.charAt(0) === '/'
              ? cfg.url + (rawSignedUrl.indexOf('/storage/v1/') === 0 ? '' : '/storage/v1') + rawSignedUrl
              : rawSignedUrl;
            signedMap.set(path, signedUrl);
          });
        }
      } catch (e) {}

      const expiresAt = Date.now() + SIGNED_URL_TTL_MS;
      let hasNewSessionEntry = false;
      cacheMisses.forEach(function(path){
        const signedUrl = signedMap.get(path) || '';
        signedUrlCache.set(path, signedUrl);
        signedUrlPending.delete(path);
        pendingResolvers.get(path)(signedUrl);
        resolvedMap.set(path, signedUrl);
        if (!signedUrl) return;
        sessionCache.entries[signedSessionEntryKey(path)] = {
          url:signedUrl,
          expiresAt:expiresAt
        };
        hasNewSessionEntry = true;
      });
      if (hasNewSessionEntry) {
        sessionCache.entries = cleanSignedSessionEntries(sessionCache.entries, Date.now());
        writeSignedSessionCache(sessionCache);
      }
    }

    await Promise.all(unique.map(async function(path){
      if (resolvedMap.has(path)) return;
      if (signedUrlCache.has(path)) {
        resolvedMap.set(path, signedUrlCache.get(path));
        return;
      }
      const pending = signedUrlPending.get(path);
      resolvedMap.set(path, pending ? await pending : '');
    }));

    return function(path){
      const value = normalizePhotoPath(path);
      if (!value || isDirectPhotoUrl(value)) return value;
      return resolvedMap.get(value) || '';
    };
  }

  async function signHeroPhoto(data){
    const heroPath = normalizePhotoPath(data && data.heroPhoto);
    if (!data || !heroPath) {
      if (data) data.heroPhoto = '';
      return;
    }
    try {
      const resolveSignedPath = await signPaths([heroPath]);
      data.heroPhoto = resolveSignedPath(heroPath);

function setGalleryFaqExpanded(item, question, answer, expanded){
  item.classList.toggle('open', expanded);
  question.setAttribute('aria-expanded', expanded ? 'true' : 'false');

  function nextFrame(callback){
    if (typeof window.requestAnimationFrame === 'function') window.requestAnimationFrame(callback);
    else callback();
  }

  if (expanded) {
    answer.hidden = false;
    answer.removeAttribute('inert');
    answer.setAttribute('aria-hidden', 'false');
    answer.style.maxHeight = '0px';
    nextFrame(function(){
      if (item.classList.contains('open')) answer.style.maxHeight = answer.scrollHeight + 'px';
    });
    return;
  }

  answer.setAttribute('aria-hidden', 'true');
  answer.setAttribute('inert', '');
  answer.style.maxHeight = answer.scrollHeight + 'px';

  function finishHide(){
    if (item.classList.contains('open')) return;
    answer.hidden = true;
    answer.style.maxHeight = '';
  }

  var reduceMotion = typeof window.matchMedia === 'function'
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduceMotion) {
    answer.style.maxHeight = '0px';
    finishHide();
    return;
  }

  function onTransitionEnd(event){
    if (event.target !== answer || event.propertyName !== 'max-height') return;
    answer.removeEventListener('transitionend', onTransitionEnd);
    finishHide();
  }
  answer.addEventListener('transitionend', onTransitionEnd);
  nextFrame(function(){
    if (!item.classList.contains('open')) answer.style.maxHeight = '0px';
  });
}

  function close(){
    if (!overlay.classList.contains('open')) return;
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden','true');
    unlockBackground();
    if (returnFocus && returnFocus.isConnected) returnFocus.focus({ preventScroll:true });
    returnFocus = null;
  }

  fab.addEventListener('click', function(event){ open(event.currentTarget); });
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', function(e){ if (e.target === overlay) close(); });
  document.addEventListener('keydown', function(event){
    if (!overlay.classList.contains('open')) return;
    if (event.key === 'Escape') {
      event.preventDefault();
      close();
      return;
    }
    if (event.key !== 'Tab') return;
    var focusable = getFocusableElements();
    if (!focusable.length) {
      event.preventDefault();
      closeBtn.focus({ preventScroll:true });
      return;
    }
    var first = focusable[0];
    var last = focusable[focusable.length - 1];
    var activeIndex = focusable.indexOf(document.activeElement);
    if (!overlay.contains(document.activeElement) || activeIndex === -1) {
      event.preventDefault();
      (event.shiftKey ? last : first).focus({ preventScroll:true });
    } else if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus({ preventScroll:true });
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus({ preventScroll:true });
    }
  });
  list.querySelectorAll('.ask-faq-item').forEach(function(item){
    var q = item.querySelector('.ask-faq-q');
    var a = item.querySelector('.ask-faq-a');
    q.addEventListener('click', function(){
      setGalleryFaqExpanded(item, q, a, !item.classList.contains('open'));
    });
  });
  consultBtn.addEventListener('click', function(){
    if (isPreviewMode || isReviewMode){
      alert(isReviewMode ? REVIEW_MESSAGE : PREVIEW_MESSAGE);
      return;
    }
    close();
    var target = document.getElementById('cslOpenBtn');
    if (target) target.click();
    else location.hash = '#finale';
  });
}

function initDeferredImages(signPaths){
  var imgs = document.querySelectorAll('img[data-src], img[data-photo-path]');
  if (!imgs.length) return;
  var groupLoads = new Map();
  var boundDayImages = new WeakSet();

  function dayImageParts(img){
    var trigger = img && img.closest ? img.closest('.art-lightbox-trigger') : null;
    if (!trigger) return null;
    return { trigger:trigger, status:trigger.querySelector('.art-image-status') };
  }

  function setDayImageState(img, state){
    var parts = dayImageParts(img);
    if (!parts) return;
    var trigger = parts.trigger;
    var status = parts.status;
    trigger.dataset.imageState = state;
    if (state === 'ready') {
      trigger.disabled = false;
      trigger.removeAttribute('aria-busy');
      trigger.removeAttribute('aria-describedby');
      if (status) {
        status.textContent = '';
        status.hidden = true;
      }
      return;
    }
    trigger.disabled = true;
    trigger.setAttribute('aria-busy', state === 'loading' ? 'true' : 'false');
    if (status) {
      status.textContent = state === 'loading' ? '이미지 준비 중' : '이미지를 불러오지 못했습니다';
      status.hidden = false;
      if (status.id) trigger.setAttribute('aria-describedby', status.id);
    }
  }

  function syncCompletedDayImage(img){
    if (!dayImageParts(img) || !img.hasAttribute('src') || !img.src || !img.complete) return;
    setDayImageState(img, img.naturalWidth > 0 ? 'ready' : 'error');
  }

  function bindDayImageState(img){
    if (!dayImageParts(img) || boundDayImages.has(img)) return;
    boundDayImages.add(img);
    setDayImageState(img, 'loading');
    img.addEventListener('load', function(){
      setDayImageState(img, img.hasAttribute('src') && img.src && img.naturalWidth > 0 ? 'ready' : 'error');
    });
    img.addEventListener('error', function(){ setDayImageState(img, 'error'); });
    syncCompletedDayImage(img);
  }

  imgs.forEach(function(img){ bindDayImageState(img); });

  function loadPrepared(img){
    if (!img.dataset.src) return;
    img.src = img.dataset.src;
    img.removeAttribute('data-src');
    syncCompletedDayImage(img);
  }

  function groupImages(group){
    return Array.prototype.filter.call(document.querySelectorAll('img[data-photo-path]'), function(img){
      return (img.dataset.photoGroup || '') === group;
    });
  }

  function loadSignedGroup(group){
    if (!group || typeof signPaths !== 'function') {
      groupImages(group).forEach(function(img){ setDayImageState(img, 'error'); });
      return Promise.resolve();
    }
    if (groupLoads.has(group)) return groupLoads.get(group);

    var candidates = groupImages(group);
    var entries = candidates.map(function(img){
      return { img:img, path:String(img.dataset.photoPath || '').trim() };
    }).filter(function(entry){ return entry.path; });
    candidates.forEach(function(img){
      if (!String(img.dataset.photoPath || '').trim()) setDayImageState(img, 'error');
    });

    var loadPromise = (async function(){
      if (!entries.length) return;
      var resolveSignedPath;
      try {
        resolveSignedPath = await signPaths(entries.map(function(entry){ return entry.path; }));
      } catch (e) {
        entries.forEach(function(entry){ setDayImageState(entry.img, 'error'); });
        return;
      }
      entries.forEach(function(entry){
        var img = entry.img;
        if (!img.isConnected || String(img.dataset.photoPath || '').trim() !== entry.path) return;
        var src = typeof resolveSignedPath === 'function' ? resolveSignedPath(entry.path) : '';
        if (!src) {
          setDayImageState(img, 'error');
          return;
        }
        try {
          img.src = src;
          img.removeAttribute('data-photo-path');
          img.removeAttribute('data-photo-group');
          syncCompletedDayImage(img);
        } catch (e) {
          setDayImageState(img, 'error');
        }
      });
    })();

    groupLoads.set(group, loadPromise);
    return loadPromise;
  }

  function load(img){
    if (img.dataset.src) {
      loadPrepared(img);
      return Promise.resolve();
    }
    var group = img.dataset.photoGroup || '';
    if (!group) {
      setDayImageState(img, 'error');
      return Promise.resolve();
    }
    return loadSignedGroup(group);
  }

  if (!('IntersectionObserver' in window)){
    imgs.forEach(function(img){ load(img).catch(function(){ setDayImageState(img, 'error'); }); });
    return;
  }
  var observer = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if (!entry.isIntersecting) return;
      var group = entry.target.dataset.photoGroup || '';
      var targets = group ? groupImages(group) : [entry.target];
      targets.forEach(function(img){ observer.unobserve(img); });
      load(entry.target).catch(function(){
        targets.forEach(function(img){ setDayImageState(img, 'error'); });
      });
    });
  }, { rootMargin: '200px' });
  imgs.forEach(function(img){ observer.observe(img); });
}

// ── 입학안내(admissions) + 오시는 길(directions) 렌더 (M1) ──
function renderInfoSections(data, c, esc, detailQuery, hasAdmissionData, hasDirectionsData){
  // M2: 입학안내·오시는 길은 공개형 새 페이지로 분리. 메인에는 요약+이동 버튼만 남긴다.
  var qs = detailQuery || '';
  var admSec = document.getElementById('admissionsSec');
  if (admSec){
    if (!qs || !hasAdmissionData){ admSec.hidden = true; }
    else {
      admSec.hidden = false;
      var adm = data.admission;
      admSec.innerHTML = '<h2 class="info-title">입학안내</h2>'
        + '<div class="adm-preview" style="background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin:0 0 16px;text-align:left">'
        + (adm.target ? '<div style="font-size:.85rem;font-weight:600;color:var(--ink-soft);margin-bottom:4px">모집 대상</div><div style="font-size:.96rem;color:var(--char);margin-bottom:12px">'+esc(adm.target)+'</div>' : '')
        + (adm.period ? '<div style="font-size:.85rem;font-weight:600;color:var(--ink-soft);margin-bottom:4px">모집 기간</div><div style="font-size:.96rem;color:var(--char)">'+esc(adm.period)+'</div>' : '')
        + '</div>'
        + '<a class="info-link-btn" href="admissions.html' + qs + '">입학안내 자세히 보기 →</a>';
    }
  }
  var dirSec = document.getElementById('directionsSec');
  if (dirSec){
    if (!qs || !hasDirectionsData){ dirSec.hidden = true; }
    else {
      dirSec.hidden = false;
      dirSec.innerHTML = '<h2 class="info-title">오시는 길</h2>'
        + '<p class="info-lead">지도와 교통편·주차 안내를 확인하세요.</p>'
        + '<a class="info-link-btn" href="directions.html' + qs + '">오시는 길 보기 →</a>';
    }
  }
}

// 카카오맵 JS SDK: 주소 검색 후 마커 표시. 키는 kakao-config.js(window.__KAKAO_CONFIG__)에서 주입.
function loadKakaoMap(address, containerId){
  var cfg = window.__KAKAO_CONFIG__;
  var container = document.getElementById(containerId);
  if (!container || !address) return;
  if (!cfg || !cfg.appkey){ console.warn('[kakao] appkey 없음 — 지도를 건너뜁니다.'); return; }
  function render(){
    kakao.maps.load(function(){
      var map = new kakao.maps.Map(container, { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 3 });
      var geocoder = new kakao.maps.services.Geocoder();
      geocoder.addressSearch(address, function(result, status){
        if (status === kakao.maps.services.Status.OK){
          var coords = new kakao.maps.LatLng(result[0].y, result[0].x);
          map.setCenter(coords);
          new kakao.maps.Marker({ map: map, position: coords });
        }
      });
    });
  }
  if (window.kakao && window.kakao.maps){ render(); return; }
  if (!window.__kakaoSDKPromise){
    window.__kakaoSDKPromise = new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(cfg.appkey) + '&libraries=services&autoload=false';
      s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  window.__kakaoSDKPromise.then(render).catch(function(){ console.error('[kakao] SDK 로드 실패'); });
}

function initConsultationForm(client, centerId, pageState, blockedMessage){
  var overlay = document.getElementById('cslOverlay');
  var panel = overlay && overlay.querySelector('.csl-panel');
  var openBtn = document.getElementById('cslOpenBtn');
  var closeBtn = document.getElementById('cslCloseBtn');
  var form = document.getElementById('cslForm');
  var errorEl = document.getElementById('cslError');
  var formWrap = document.getElementById('cslFormWrap');
  var doneWrap = document.getElementById('cslDoneWrap');
  var returnFocus = null;
  var previousBodyOverflow = '';
  var inertedBackgroundElements = [];

  function hasOtherOpenOverlay(){
    return Array.prototype.some.call(
      document.querySelectorAll('.csl-overlay.open, .ask-modal-overlay.open, .info-modal-overlay.open, .lightbox-overlay.open'),
      function(candidate){ return candidate !== overlay; }
    );
  }

  function lockBackground(){
    previousBodyOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    inertedBackgroundElements = [];
    Array.prototype.forEach.call(document.body.children, function(element){
      if (element === overlay || element.tagName === 'SCRIPT' || element.tagName === 'STYLE') return;
      if (element.hasAttribute('inert')) return;
      element.setAttribute('inert', '');
      inertedBackgroundElements.push(element);
    });
  }

  function unlockBackground(){
    document.body.style.overflow = previousBodyOverflow;
    inertedBackgroundElements.forEach(function(element){
      if (element.isConnected) element.removeAttribute('inert');
    });
    inertedBackgroundElements = [];
  }

  function getFocusableElements(){
    return Array.prototype.filter.call(
      panel.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'),
      function(element){
        if (element.hidden || element.closest('[hidden],[aria-hidden="true"]')) return false;
        var style = window.getComputedStyle(element);
        return style.display !== 'none' && style.visibility !== 'hidden';
      }
    );
  }

  function openModal(trigger){
    if (!pageState || pageState.canConsult !== true){ alert(blockedMessage); return; }
    if (overlay.classList.contains('open') || hasOtherOpenOverlay()) return;
    returnFocus = trigger && trigger.isConnected ? trigger : document.activeElement;
    formWrap.hidden = false;
    doneWrap.hidden = true;
    form.reset();
    errorEl.textContent = '';
    lockBackground();
    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden', 'false');
    var firstInput = document.getElementById('csl-name');
    if (firstInput) firstInput.focus({ preventScroll:true });
    else closeBtn.focus({ preventScroll:true });
  }

  function closeModal(){
    if (!overlay.classList.contains('open')) return;
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    unlockBackground();
    if (returnFocus && returnFocus.isConnected) returnFocus.focus({ preventScroll:true });
    returnFocus = null;
  }

  if (openBtn) openBtn.addEventListener('click', function(event){ openModal(event.currentTarget); });
  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e){ if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function(event){
    if (!overlay.classList.contains('open')) return;
    if (event.key === 'Escape') {
      event.preventDefault();
      closeModal();
      return;
    }
    if (event.key !== 'Tab') return;
    var focusable = getFocusableElements();
    if (!focusable.length) {
      event.preventDefault();
      closeBtn.focus({ preventScroll:true });
      return;
    }
    var first = focusable[0];
    var last = focusable[focusable.length - 1];
    var activeIndex = focusable.indexOf(document.activeElement);
    if (!overlay.contains(document.activeElement) || activeIndex === -1) {
      event.preventDefault();
      (event.shiftKey ? last : first).focus({ preventScroll:true });
    } else if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus({ preventScroll:true });
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus({ preventScroll:true });
    }
  });

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    errorEl.textContent = '';
    if (!pageState || pageState.canConsult !== true){
      errorEl.textContent = blockedMessage;
      return;
    }
    if (!document.getElementById('csl-consent').checked){ errorEl.textContent = '개인정보 수집 동의가 필요해요.'; return; }
    var payload = {
      center_id: centerId,
      parent_name: document.getElementById('csl-name').value,
      phone: document.getElementById('csl-phone').value,
      kind: document.getElementById('csl-kind').value,
      wish_class: document.getElementById('csl-class').value || null,
      wish_time: document.getElementById('csl-time').value || null,
      consent_at: new Date().toISOString()
    };
    var submitBtn = form.querySelector('.csl-submit');
    submitBtn.disabled = true;
    if (!pageState || pageState.canConsult !== true){
      submitBtn.disabled = false;
      errorEl.textContent = blockedMessage;
      return;
    }
    var { error } = await client.from('consultations').insert(payload);
    submitBtn.disabled = false;
    if (error){ console.error(error); errorEl.textContent = '접수 중 문제가 생겼어요. 다시 시도해주세요.'; return; }
    formWrap.hidden = true;
    doneWrap.hidden = false;
    if (overlay.classList.contains('open')) doneWrap.focus({ preventScroll:true });
  });
}
