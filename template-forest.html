    function initInteractions() {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      initImageFallbacks();
      initDeferredImages();

      // ── 라이트박스 ──
      (function(){
        var overlay = document.getElementById('lightbox');
        var closeBtn = document.getElementById('lightboxClose');
        var img = document.getElementById('lightboxImg');
        var cap = document.getElementById('lightboxCap');
        var returnFocus = null;
        if (!overlay) return;
        function open(src, alt){
          if (!src) return;
          var directorGreetingModal = document.getElementById('directorGreetingModal');
          if (directorGreetingModal && directorGreetingModal.classList.contains('open')) return;
          returnFocus = document.activeElement;
          img.src = src; img.alt = alt || '';
          cap.textContent = alt || '';
          overlay.classList.add('open');
          overlay.setAttribute('aria-hidden','false');
          closeBtn.focus();
        }
        function close(){
          if (!overlay.classList.contains('open')) return;
          overlay.classList.remove('open');
          overlay.setAttribute('aria-hidden','true');
          img.removeAttribute('src');
          if (returnFocus && returnFocus.isConnected) returnFocus.focus();
        }
        window.__openLightbox__ = open;
        closeBtn.addEventListener('click', close);
        overlay.addEventListener('click', function(e){ if(e.target===overlay) close(); });
        document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
      })();

      // ── '우리 반' 버튼 → ourclass.html ──
      var ourclassBtn = document.getElementById('ourclassBtn');
      if (ourclassBtn) ourclassBtn.addEventListener('click', function(e){
        e.preventDefault();
        location.href = 'ourclass.html';
      });

      document.querySelectorAll('.facility-lightbox').forEach(function(button){
        button.addEventListener('click', function(){
          if (window.__openLightbox__) {
            window.__openLightbox__(button.dataset.lightboxSrc, button.dataset.lightboxAlt);
          }
        });
      });

      (function(){
        var moreBtn = document.getElementById('directorGreetingMore');
        var modal = document.getElementById('directorGreetingModal');
        var panel = modal && modal.querySelector('.director-greeting-panel');
        var closeBtn = document.getElementById('directorGreetingClose');
        var returnFocus = null;
        var previousBodyOverflow = '';
        if (!moreBtn || !modal || !panel || !closeBtn) return;

        function openDirectorGreeting(){
          if (modal.classList.contains('open')) return;
          var albumLightbox = document.getElementById('lightbox');
          if (albumLightbox && albumLightbox.classList.contains('open')) return;
          returnFocus = document.activeElement;
          previousBodyOverflow = document.body.style.overflow;
          document.body.style.overflow = 'hidden';
          modal.classList.add('open');
          modal.setAttribute('aria-hidden','false');
          moreBtn.setAttribute('aria-expanded','true');
          closeBtn.focus();
        }

        function closeDirectorGreeting(){
          if (!modal.classList.contains('open')) return;
          modal.classList.remove('open');
          modal.setAttribute('aria-hidden','true');
          moreBtn.setAttribute('aria-expanded','false');
          document.body.style.overflow = previousBodyOverflow;
          if (returnFocus && returnFocus.isConnected) returnFocus.focus();
        }

        moreBtn.addEventListener('click', openDirectorGreeting);
        closeBtn.addEventListener('click', closeDirectorGreeting);
        modal.addEventListener('click', function(e){
          if (e.target === modal) closeDirectorGreeting();
        });
        document.addEventListener('keydown', function(e){
          if (!modal.classList.contains('open')) return;
          if (e.key === 'Escape') {
            e.preventDefault();
            closeDirectorGreeting();
            return;
          }
          if (e.key !== 'Tab') return;
          var focusable = panel.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])');
          if (!focusable.length) {
            e.preventDefault();
            panel.focus();
            return;
          }
          var first = focusable[0];
          var last = focusable[focusable.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        });
      })();

      var programToggle = document.getElementById('programToggle');
      var programGrid = document.getElementById('programGrid');
      if (programToggle && programGrid){
        programToggle.addEventListener('click', function(){
          var expanded = programToggle.getAttribute('aria-expanded') === 'true';
          programToggle.setAttribute('aria-expanded', expanded ? 'false' : 'true');
          programGrid.classList.toggle('is-collapsed', expanded);
          programToggle.textContent = expanded ? '프로그램 더 보기' : '프로그램 접기';
          if (!expanded) initDeferredImages();
        });
      }

      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
      }, { threshold: 0.12 });
      var revealEls = document.querySelectorAll('.reveal');
      revealEls.forEach(function (el) { io.observe(el); });
      requestAnimationFrame(function () {
        revealEls.forEach(function (el) { el.classList.add('in'); });
      });

      var bg = document.querySelector('.forest-bg');
      var rays = document.querySelector('.light-rays');
      var depths = [
        { top: '#DCE8CC', bot: '#EEF2E0', rays: .9 },
        { top: '#C4D8B0', bot: '#DCE8CC', rays: .8 },
        { top: '#A8C690', bot: '#C4D8B0', rays: .7 },
        { top: '#8CB074', bot: '#A8C690', rays: .65 },
        { top: '#F4E8C4', bot: '#DCE8CC', rays: 1 }
      ];
      var stops = Array.prototype.slice.call(document.querySelectorAll('.stop'));
      var current = -1;
      var dio = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) {
            var idx = stops.indexOf(e.target);
            var step = Math.min(idx, depths.length - 1);
            if (step !== current) {
              current = step; var p = depths[step];
              bg.style.background = 'linear-gradient(180deg,' + p.top + ' 0%,' + p.bot + ' 60%)';
              rays.style.opacity = p.rays;
            }
          }
        });
      }, { rootMargin: '-45% 0px -45% 0px' });
      stops.forEach(function (s) { dio.observe(s); });

      // 떠다니는 나뭇잎
      if(!reduce){
        var leafColors = ['#7BA05B','#A8C686','#4A6B3A','#E8B864'];
        for(var i=0;i<2;i++){
          (function(idx){
            var leaf = document.createElement('div');
            leaf.className = 'leaf-float';
            var size = 14 + Math.random()*12;
            var col = leafColors[idx % leafColors.length];
            leaf.innerHTML = '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24"><path d="M12 2 Q22 8 12 22 Q2 8 12 2Z" fill="'+col+'"/><path d="M12 4 V20" stroke="rgba(255,255,255,.4)" stroke-width="1"/></svg>';
            leaf.style.top = '0px';
            document.body.appendChild(leaf);
            var baseX = Math.random()*100;
            var y = -40 - Math.random()*window.innerHeight;
            var speed = 0.4+Math.random()*0.5, sway = 14+Math.random()*22, phase = Math.random()*6.28, rot = Math.random()*360;
            function fall(){
              y += speed; phase += 0.015; rot += 0.4;
              if(y > window.innerHeight + 40){ y = -40; baseX = Math.random()*100; }
              leaf.style.left = baseX + '%';
              leaf.style.transform = 'translate('+(Math.sin(phase)*sway)+'px,'+y+'px) rotate('+rot+'deg)';
              requestAnimationFrame(fall);
            }
            fall();
          })(i);
        }
      }

      var tabBtns = document.querySelectorAll('.tab-btn');
      var tabPanels = document.querySelectorAll('.tab-panel');
      tabBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var tab = btn.getAttribute('data-tab');
          tabBtns.forEach(function (b) { b.classList.remove('active'); });
          tabPanels.forEach(function (p) { p.classList.remove('active'); });
          btn.classList.add('active');
          document.querySelector('.tab-panel[data-panel="' + tab + '"]').classList.add('active');
        });
      });

      var floatEl = document.getElementById('float');
      var hero = document.querySelector('.hero');
      var finale = document.getElementById('finale');
      if (floatEl && !floatEl.hidden && hero && finale && !finale.hidden) {
        var fio = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.target === hero) { if (e.isIntersecting) { floatEl.classList.remove('show'); } else { floatEl.classList.add('show'); } }
            if (e.target === finale) { if (e.isIntersecting) { floatEl.classList.add('hide'); } else { floatEl.classList.remove('hide'); } }
          });
        }, { threshold: 0.4 });
        fio.observe(hero); fio.observe(finale);
      }

      var menuBtn = document.getElementById('menuBtn');
      var menuPanel = document.getElementById('menuPanel');
      function closeMenu() { menuBtn.classList.remove('open'); menuPanel.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false'); }
      menuBtn.addEventListener('click', function () {
        var open = menuPanel.classList.toggle('open');
        menuBtn.classList.toggle('open', open);
        menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      menuPanel.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closeMenu); });
      document.addEventListener('click', function (e) { if (!menuPanel.contains(e.target) && !menuBtn.contains(e.target)) closeMenu(); });

      document.querySelectorAll('.faq-item').forEach(function (item) {
        var q = item.querySelector('.faq-q');
        var a = item.querySelector('.faq-a');
        q.addEventListener('click', function () {
          var open = item.classList.toggle('open');
          q.setAttribute('aria-expanded', open ? 'true' : 'false');
          a.style.maxHeight = open ? (a.scrollHeight + 'px') : null;
        });
      });
    }

    function setupAskPanel(faqs, canConsult){
      var fab = document.getElementById('askFab');
      var overlay = document.getElementById('askModal');
      var closeBtn = document.getElementById('askModalClose');
      var list = document.getElementById('askFaqList');
      var empty = document.getElementById('askFaqEmpty');
      var consultBtn = document.getElementById('askConsultBtn');
      if (!fab || !overlay || !list || !consultBtn) return;
      function askEsc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]; }); }
      function askWithBr(s){ return askEsc(s).replace(/\n/g,'<br>'); }
      var items = (faqs && faqs.items) || [];
      if (!items.length && !canConsult){
        fab.hidden = true;
        return;
      }
      fab.hidden = false;
      consultBtn.hidden = !canConsult;
      list.innerHTML = items.map(function(it){
        return '<div class="ask-faq-item">'
          + '<button type="button" class="ask-faq-q" aria-expanded="false">' + askEsc(it.q) + '</button>'
          + '<div class="ask-faq-a"><p>' + askWithBr(it.a) + '</p></div>'
          + '</div>';
      }).join('');
      if (empty) empty.hidden = items.length > 0;
      function open(){ overlay.classList.add('open'); overlay.setAttribute('aria-hidden','false'); }
      function close(){ overlay.classList.remove('open'); overlay.setAttribute('aria-hidden','true'); }
      fab.addEventListener('click', open);
      if (closeBtn) closeBtn.addEventListener('click', close);
      overlay.addEventListener('click', function(e){ if (e.target === overlay) close(); });
      document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
      list.querySelectorAll('.ask-faq-item').forEach(function(item){
        var q = item.querySelector('.ask-faq-q');
        var a = item.querySelector('.ask-faq-a');
        q.addEventListener('click', function(){
          var openItem = item.classList.toggle('open');
          q.setAttribute('aria-expanded', openItem ? 'true' : 'false');
          a.style.maxHeight = openItem ? (a.scrollHeight + 'px') : null;
        });
      });
      consultBtn.addEventListener('click', function(){
        if (!canConsult) return;
        close();
        var target = document.getElementById('cslOpenBtn');
        if (target) target.click();
      });
    }

    function initImageFallbacks(){
      document.querySelectorAll('img:not(#lightboxImg)').forEach(function(img){
        if (img.dataset.errorFallbackBound === 'true') return;
        img.dataset.errorFallbackBound = 'true';
        img.addEventListener('error', function(){
          var heroPhoto = img.closest('.hero-photo');
          if (heroPhoto){
            var hero = document.getElementById('hero');
            if (hero) hero.classList.add('hero-no-photo');
            heroPhoto.remove();
            return;
          }
          var directorPhoto = img.closest('.director-photo');
          if (directorPhoto){
            var signpost = directorPhoto.closest('.signpost');
            if (signpost) signpost.classList.add('no-photo');
            directorPhoto.remove();
            return;
          }
          var directorGreetingPhoto = img.closest('.director-greeting-photo');
          if (directorGreetingPhoto){
            directorGreetingPhoto.remove();
            return;
          }
          var media = img.closest('.facility-media,.prog-img,.teacher-photo');
          if (media){
            var contentCard = media.closest('.facility-card,.prog-card,.teacher-card-view');
            var contentBody = contentCard && contentCard.querySelector('.facility-body,.prog-body,.teacher-copy');
            if (!contentBody && contentCard) {
              contentCard.hidden = true;
              var contentSection = contentCard.closest('section');
              if (contentSection && !contentSection.querySelector('.facility-card:not([hidden]),.prog-card:not([hidden]),.teacher-card-view:not([hidden])')) contentSection.hidden = true;
            } else {
              if (contentCard) contentCard.classList.add('no-photo');
              media.classList.add('image-missing');
            }
            img.remove();
            return;
          }
          var dayMedia = img.closest('.media-frame');
          if (dayMedia){
            var dayCard = dayMedia.closest('.card');
            var dayBody = dayCard && dayCard.querySelector('.body');
            if (dayCard && dayBody && dayBody.children.length) {
              dayCard.classList.add('no-photo');
            } else {
              var stop = dayCard && dayCard.closest('.stop');
              if (stop) stop.hidden = true;
              var daySection = document.getElementById('day');
              if (daySection && !daySection.querySelector('.stop:not([hidden])')) daySection.hidden = true;
            }
            dayMedia.remove();
            return;
          }
          img.remove();
        });
      });
    }

    function initDeferredImages(){
      var imgs = document.querySelectorAll('img[data-src]');
      if (!imgs.length) return;
      function load(img){
        if (!img.dataset.src) return;
        img.src = img.dataset.src;
        img.removeAttribute('data-src');
      }
      if (!('IntersectionObserver' in window)){
        imgs.forEach(load);
        return;
      }
      var observer = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if (!entry.isIntersecting) return;
          load(entry.target);
          observer.unobserve(entry.target);
        });
      }, { rootMargin: '200px' });
      imgs.forEach(function(img){ observer.observe(img); });
    }

    // ── 입학안내(admissions) + 오시는 길(directions) 렌더 (M1) ──
    function disableReviewDetailLinks(){
      document.querySelectorAll('a[href^="admissions.html"], a[href^="directions.html"]').forEach(function(link){
        var note = document.createElement('span');
        note.className = link.className || 'info-link-btn';
        note.textContent = '검수 모드에서는 별도 페이지 이동이 제한됩니다';
        link.replaceWith(note);
      });
    }

    function renderInfoSections(data, c, esc, isPreviewMode, previewTemplateId, isReviewMode, routeItems, busRoutes){
      // M2: 입학안내·오시는 길은 공개형 새 페이지로 분리. 메인에는 요약+이동 버튼만 남긴다.
      var qs = (isPreviewMode && previewTemplateId)
        ? ('?preview=' + encodeURIComponent(previewTemplateId))
        : (c.slug ? ('?slug=' + encodeURIComponent(c.slug)) : '');
      var admSec = document.getElementById('admissionsSec');
      if (admSec){
        var adm = data.admission || {};
        var admissionRows = [
          { label:'모집 대상', value:adm.target },
          { label:'모집 인원', value:adm.capacity_info },
          { label:'모집 기간', value:adm.period }
        ].filter(function(row){ return hasVisibleText(row.value); });
        var hasAdmissionDetails = [adm.process,adm.supplies,adm.notes].some(hasVisibleText);
        if (!admissionRows.length && !hasAdmissionDetails){ admSec.hidden = true; }
        else {
          admSec.hidden = false;
          admSec.innerHTML = '<div class="info-shell">'
            + '<div><div class="info-kicker">입학 안내소</div><h2 class="info-title">입학안내</h2></div>'
            + '<div class="info-content">'
            + (admissionRows.length ? '<div class="adm-preview">' + admissionRows.map(function(row){
              return '<div class="adm-row"><div class="adm-label">'+esc(row.label)+'</div><div class="adm-value">'+esc(row.value)+'</div></div>';
            }).join('') + '</div>' : '')
            + '<a class="info-link-btn" href="admissions.html' + qs + '">입학안내 자세히 보기 →</a>'
            + '</div></div>';
        }
      }
      var dirSec = document.getElementById('directionsSec');
      if (dirSec){
        var address = cleanText(c.address);
        var directions = Array.isArray(routeItems) ? routeItems : [];
        var schoolBusRoutes = Array.isArray(busRoutes) ? busRoutes : [];
        if (!address && !directions.length && !schoolBusRoutes.length){ dirSec.hidden = true; }
        else {
          dirSec.hidden = false;
          dirSec.innerHTML = '<div class="info-shell">'
            + '<div><div class="info-kicker">산책로의 시작</div><h2 class="info-title">오시는 길</h2></div>'
            + '<div class="info-content"><div class="direction-list">'
            + (address ? '<div class="direction-row"><strong>주소</strong>'+esc(address)+'</div>' : '')
            + directions.map(function(item){
              return '<div class="direction-row" data-direction-type="' + esc(item.type) + '"><strong>' + esc(item.label) + '</strong>' + escWithBr(item.text) + '</div>';
            }).join('')
            + '</div>'
            + (schoolBusRoutes.length ? '<div class="bus-preview"><h3 class="bus-preview-title">통학차량 노선</h3><div class="bus-route-list">'
              + schoolBusRoutes.map(function(route){
                return '<article class="bus-route-card">'
                  + (hasVisibleText(route.name) ? '<div class="bus-route-name"><span class="bus-route-dot" style="background:' + esc(safeBusColor(route.color)) + '"></span><span>' + esc(route.name) + '</span></div>' : '')
                  + '<ul class="bus-stop-list">' + route.stops.map(function(stop){
                    var pickup = busTime(stop.pickup_time);
                    var dropoff = busTime(stop.dropoff_time);
                    return '<li class="bus-stop">'
                      + (hasVisibleText(stop.stop_name) ? '<span class="bus-stop-name">' + escWithBr(stop.stop_name) + '</span>' : '')
                      + ((pickup || dropoff) ? '<span class="bus-stop-times">'
                        + (pickup ? '<span>등원 ' + esc(pickup) + '</span>' : '')
                        + (dropoff ? '<span>하원 ' + esc(dropoff) + '</span>' : '')
                        + '</span>' : '')
                      + '</li>';
                  }).join('') + '</ul></article>';
              }).join('') + '</div></div>' : '')
            + '<a class="info-link-btn" href="directions.html' + qs + '">오시는 길 자세히 보기 →</a>'
            + '</div></div>';
        }
      }
    }

    // 카카오맵 JS SDK: 주소 검색 후 마커 표시. 키는 kakao-config.js(window.__KAKAO_CONFIG__)에서 주입.
    function loadKakaoMap(address, containerId){
      var cfg = window.__KAKAO_CONFIG__;
      var container = document.getElementById(containerId);
      if (!container || !address) return;
      if (!cfg || !cfg.appkey){ console.warn('[kakao] appkey 없음 — 지도를 건너뜁니다.'); return; }
      function render(){
        kakao.maps.load(function(){
          var map = new kakao.maps.Map(container, { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 3 });
          var geocoder = new kakao.maps.services.Geocoder();
          geocoder.addressSearch(address, function(result, status){
            if (status === kakao.maps.services.Status.OK){
              var coords = new kakao.maps.LatLng(result[0].y, result[0].x);
              map.setCenter(coords);
              new kakao.maps.Marker({ map: map, position: coords });
            }
          });
        });
      }
      if (window.kakao && window.kakao.maps){ render(); return; }
      if (!window.__kakaoSDKPromise){
        window.__kakaoSDKPromise = new Promise(function(resolve, reject){
          var s = document.createElement('script');
          s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(cfg.appkey) + '&libraries=services&autoload=false';
          s.onload = resolve; s.onerror = reject;
          document.head.appendChild(s);
        });
      }
      window.__kakaoSDKPromise.then(render).catch(function(){ console.error('[kakao] SDK 로드 실패'); });
    }

    function initConsultationForm(client, centerId, canConsult) {
      var overlay = document.getElementById('cslOverlay');
      var panel = overlay && overlay.querySelector('.csl-panel');
      var openBtn = document.getElementById('cslOpenBtn');
      var closeBtn = document.getElementById('cslCloseBtn');
      var form = document.getElementById('cslForm');
      var errorEl = document.getElementById('cslError');
      var formWrap = document.getElementById('cslFormWrap');
      var doneWrap = document.getElementById('cslDoneWrap');
      if (!canConsult || !openBtn) return;
      var returnFocus = null;
      var submitting = false;

      function openModal() {
        returnFocus = document.activeElement;
        overlay.classList.add('open');
        overlay.setAttribute('aria-hidden', 'false');
        openBtn.setAttribute('aria-expanded', 'true');
        formWrap.hidden = false;
        doneWrap.hidden = true;
        form.reset();
        errorEl.textContent = '';
        requestAnimationFrame(function(){
          var firstInput = document.getElementById('csl-name');
          if (firstInput) firstInput.focus();
          else if (panel) panel.focus();
        });
      }
      function closeModal() {
        if (!overlay.classList.contains('open')) return;
        overlay.classList.remove('open');
        overlay.setAttribute('aria-hidden', 'true');
        openBtn.setAttribute('aria-expanded', 'false');
        if (returnFocus && returnFocus.isConnected) returnFocus.focus();
      }

      if (openBtn) openBtn.addEventListener('click', openModal);
      closeBtn.addEventListener('click', closeModal);
      overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        errorEl.textContent = '';
        if (!canConsult || submitting) return;
        if (!document.getElementById('csl-consent').checked) { errorEl.textContent = '개인정보 수집 동의가 필요해요.'; return; }
        var payload = {
          center_id: centerId,
          parent_name: document.getElementById('csl-name').value,
          phone: document.getElementById('csl-phone').value,
          kind: document.getElementById('csl-kind').value,
          wish_class: document.getElementById('csl-class').value || null,
          wish_time: document.getElementById('csl-time').value || null,
          consent_at: new Date().toISOString()
        };
        var submitBtn = form.querySelector('.csl-submit');
        submitting = true;
        submitBtn.disabled = true;
        try {
          var { error } = await client.from('consultations').insert(payload);
          if (error) { console.error(error); errorEl.textContent = '접수 중 문제가 생겼어요. 다시 시도해주세요.'; return; }
          formWrap.hidden = true;
          doneWrap.hidden = false;
          doneWrap.focus();
        } catch (error) {
          console.error(error);
          errorEl.textContent = '접수 중 문제가 생겼어요. 다시 시도해주세요.';
        } finally {
          submitting = false;
          submitBtn.disabled = false;
        }
      });
    }
  </script>
